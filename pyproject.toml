[project]
name = "astro-ai"
version = "0.0.1"
description = "Vedic astrology reading web app — MVP using LLM-only chart inference."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    # Chart calculation stack — real ephemeris instead of LLM guessing.
    # pyswisseph: Swiss Ephemeris (AGPL or commercial). Industry-standard
    # planetary positions; supports sidereal/Vedic mode with Lahiri ayanamsa.
    "pyswisseph>=2.10",
    # geopy with Nominatim: free, no API key, place name -> (lat, lon).
    "geopy>=2.4",
    # timezonefinder: offline, lat/lon -> IANA timezone name. Handles
    # historical TZ correctly when paired with stdlib zoneinfo.
    "timezonefinder>=6.5",
    # itsdangerous: signed cookies (persist seeker birth details client-side
    # without a DB, tamper-proofed by HMAC).
    "itsdangerous>=2.2",
    # google-cloud-storage: optional generic key→file store (see storage.py).
    # Survives Cloud Run cold starts; used by Rashifal today, available to any
    # future feature with cross-user-shared output. Falls back silently to the
    # SQLite cache when BHAGYA_STORAGE_BUCKET isn't configured.
    "google-cloud-storage>=2.18",
    # httpx: direct HTTP client for the Brevo transactional-email API. Already
    # a transitive dep of openai, but pin it explicitly since email_sender.py
    # uses it directly.
    "httpx>=0.27",
    # google-auth: verifies Google Identity Services ID tokens server-side.
    # Used by /auth/google to validate a Sign-in-with-Google credential JWT
    # against Google's public keys before granting a session.
    "google-auth>=2.30",
]

[project.scripts]
astro-ai = "astro_ai.main:cli"

# Dev-only. NOT in [project.dependencies], so the Docker build never resolves
# it and the Cloud Run image stays as small as it is today.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # Drives scripts/verify_devanagari_serif.py, which reads the fonts the
    # browser ACTUALLY painted via CDP rather than trusting the CSS. Until it
    # was added the gate returned 2 ("could not verify") before running a
    # single check, so #189's regression guard had never once executed.
    #
    # scripts/verify_lang_switch_browser.py (#124) needs it for the same
    # reason: it clicks the language control and reads <html lang> plus the
    # computed root font-size, which no server-side test can see. Both gates
    # exit 2 rather than 0 when playwright is absent, so a sweep cannot
    # mistake an unrunnable gate for a green one.
    "playwright>=1.47",
    "tiktoken>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "network_allowed(*hosts, reason): permit a test to resolve and connect to exactly these hosts. Narrow door in the socket guard (tests/conftest.py _no_outbound_sockets); reason is mandatory prose.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_ai"]
# Non-code assets inside the package — be explicit so a future build tweak
# doesn't silently drop them (prompts/templates/manifest/icons/SW).
include = [
    "src/astro_ai/prompts/*.txt",
    "src/astro_ai/templates/**/*.html",
    "src/astro_ai/static/*.webmanifest",
    "src/astro_ai/static/*.js",
    "src/astro_ai/static/icons/*.png",
]

# prompteval is a dev/eval-only tool, not a runtime dep — it lives in the
# sibling repo and is invoked from evals/ scripts directly when needed.
# Keeping it out of pyproject.toml means the Docker build doesn't try to
# resolve a local path that doesn't exist inside the build context.
