# Starts one delivery cycle. The loop itself lives in .claude/commands/agent-cycle.md.
#
# SCHEDULING IS A QUOTA DECISION
# ------------------------------
# These agents run on a Claude subscription, not an API key, so they spend the
# same five-hour rolling budget as interactive work on this account. That cap
# has already been hit once: com.vivatrades.stock-analysis.plist was moved from
# 02:00 to 04:30 with the note "to avoid collision with the Claude Max 5h
# rolling cap — by 04:30 the day's accrued usage from prior sessions has reset
# cleanly."
#
# 23:00 UTC is 04:30 IST, the same post-reset window that already works.
#
# ONE ISSUE PER RUN
# -----------------
# A cycle is 10-15 agent invocations: project-manager, dev-lead, architect,
# engineer, qa — and /bug records that this project has run fifteen QA passes
# with every one failing its first submission, so budget two or three rounds.
# A run that starts a second issue leaves both half-done when the budget ends.
name: Agent work

on:
  schedule:
    - cron: "0 23 * * *"   # 04:30 IST, after the rolling cap resets
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work (blank = let project-manager rank)"
        required: false

concurrency:
  group: agent-work
  cancel-in-progress: false   # never kill a cycle mid-QA; let it finish

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write        # push a branch — never main
      # `gh run list` / `gh run download` read ANOTHER workflow's runs, which
      # needs this scope. An omitted scope is `none`, never inherited, so
      # without it the step gets
      #     HTTP 403: Resource not accessible by integration
      # and since that step is continue-on-error it fails SILENTLY.
      #
      # Measured in the 2026-10-09 nightly (run 37876433396 at 02:50:34): the
      # delivery cycle has NEVER received the analyst's measurement. The
      # scoring arm of the loop — the one ARCHITECTURE.md calls load-bearing,
      # "without it the others ship forever and never learn" — has been
      # feeding nothing into delivery since it was wired up.
      #
      # Found by scripts/verify_workflows.py on its first run, not by a human.
      #
      # WRITE, not read, since #322. The net below opens a PR with
      # `github.token`, and GitHub emits no `pull_request` event for anything
      # GITHUB_TOKEN does — so `pr-gates` never fired on it and `agent-merge`
      # refused the PR forever on "no checks reported", with no red run to
      # explain why. PR #318 sat gate-less for ~14h that way.
      #
      # `workflow_dispatch` is the documented exception: a run dispatched with
      # GITHUB_TOKEN DOES start, and it attaches its check runs to the head
      # SHA, which is what agent-merge reads. Dispatching needs `actions:
      # write`; reading runs needed only `read`.
      actions: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # project-manager diffs against origin/main

      # enable-cache MUST be an explicit false. The action defaults to `auto`,
      # which turns caching on for hosted runners, so merely deleting
      # `enable-cache: true` left it on — and its POST step kept exiting 2 while
      # pruning, failing a job whose every real step had passed. agent-merge
      # gates on this workflow concluding success, so that flake would block
      # every agent PR after the work was already done.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          uv sync --all-groups
          npm ci

      # Keyless. The org forbids service-account keys
      # (constraints/iam.disableServiceAccountKeyCreation), so the analyst's
      # data comes through Workload Identity Federation scoped to this repo.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/89117619584/locations/global/workloadIdentityPools/github/providers/astro-ai
          service_account: agent-analytics@bhagya-500701.iam.gserviceaccount.com

      - name: Identify as the agent
        run: |
          git config user.name  "shubhagya-agent"
          git config user.email "agent@users.noreply.github.com"


      # Plan from the analyst's latest run rather than re-deriving it. Falls
      # through quietly when no measurement exists yet — a first run must not be
      # blocked by the absence of a prior one.
      - name: Fetch the latest measurement
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow agent-measure.yml --status success \
                 --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" -n measurement --dir /tmp/measure \
              && echo "measurement from run $id" \
              && ls -la /tmp/measure
          else
            echo "no prior measurement — proceeding without one"
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /agent-cycle ${{ github.event.inputs.issue }}

            /tmp/measure/report.md, if present, is the analyst's latest
            measurement. project-manager should rank against it — an issue the
            analyst showed moving nothing outranks nothing.
          # In automation mode a plain-text prompt grants NO tools. agent-measure
          # proved it the hard way: 7 turns, 4 denials, nothing done, step green.
          # The delivery loop needs the full set because it dispatches subagents
          # and they write code.
          #
          # `git push` is granted ONLY for issue/* branches. A push to main is
          # refused by the pattern itself, so CLAUDE.md's rule is enforced by the
          # runner rather than by an agent remembering it — which is the failure
          # this repo has twice.
          claude_args: |
            --max-turns 150
            --effort high
            # Broad Bash, because enumerating verbs left the first nightly
            # cycle with 4 denials and nothing to show: 10 turns, no branch, no
            # PR, and a green run. A half-blocked agent spends its turns
            # discovering what it may not do.
            #
            # The loop may push its branch and merge its own PR once QA passes —
            # the user's grant of 2026-10-08, recorded in CLAUDE.md. Everything
            # is allowed except the operations below, which are denied because
            # they are irreversible or reach outside this repository:
            #
            #   rm         deleting work is never part of shipping an issue
            #   sudo       nothing here needs root
            #   git push --force / reset --hard   discards history, not a fix
            #   gh repo / gh secret               deletes repos, rotates creds
            #   gcloud                            the deploy trigger and IAM live there
            #
            # A push to `main` is not in that list because the loop should not
            # want one: it branches and opens a PR, which is what makes pr-gates
            # run at all. A direct commit to main would deploy with no gate
            # between the agent and production.
            --allowedTools "Agent,Read,Write,Edit,Glob,Grep,Skill,WebFetch,WebSearch,TodoWrite,Bash"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git reset --hard:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gcloud:*)"
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

      # A cycle that dies on quota leaves a branch behind. Say so on the run,
      # because a silent half-finished branch is how GROWTH_LOG.md stopped for
      # ten weeks with nobody noticing.
      - name: Report an unfinished cycle
        if: failure()
        run: |
          {
            echo "### Cycle did not finish"
            echo "Branches pushed by this run, if any:"
            git branch -r --list 'origin/issue/*' --sort=-committerdate | head -3
            echo ""
            echo "If no PR was opened, the work is on the branch and the issue has no comment."
          } >> "$GITHUB_STEP_SUMMARY"

      # A safety net, not the primary path. The agent may push and open the PR
      # itself now; this catches the case where it committed and then ran out of
      # turns or budget before pushing — which would otherwise leave the work on
      # a local branch inside a runner that is about to be destroyed.
      #
      # Idempotent: exits quietly if the branch is already pushed or a PR exists.
      - name: Push the branch and open the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Say what happened, every time, in the summary. Three runs against
          # #272 concluded `success` having produced nothing, and the failure was
          # invisible except by noticing an absent branch — the fourth silent
          # success this system produced in a day. The outcome is now stated
          # whether or not anything shipped.
          branch=$(git rev-parse --abbrev-ref HEAD)
          case "$branch" in
            issue/*) ;;
            *)
              {
                echo "### Cycle shipped nothing"
                echo "Ended on \`$branch\`, not an \`issue/*\` branch, so no work was committed."
                echo ""
                echo "Either the cycle stopped legitimately at step 0 — \`cannot-reproduce\`, or a"
                echo "premise it could not establish — or it dispatched a subagent and ended its"
                echo "turn before the result came back, which kills the subagent (#285). Read the"
                echo "issue comment this run wrote: a legitimate stop says so, a lost dispatch"
                echo "claims an engineer was dispatched and leaves nothing behind."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "on '$branch', not an issue branch — nothing to push"
              exit 0 ;;
          esac
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            {
              echo "### Cycle shipped nothing"
              echo "Branch \`$branch\` was created and carries **no commits**."
              echo ""
              echo "A branch with no commits means work started and did not finish — most likely"
              echo "a subagent that was dispatched and then lost when the parent ended its turn"
              echo "(#285). This is not a legitimate stop; a legitimate stop never branches."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "no commits on $branch — the cycle produced nothing"
            exit 0
          fi
          # Already pushed by the agent? Then there is nothing for this net to
          # catch, and trying anyway FAILS A SUCCESSFUL CYCLE: the agent pushes
          # with the action's GitHub App token, while this step has only
          # github.token over HTTPS, which cannot push —
          #   "Password authentication is not supported for Git operations"
          # That is how run 37741141641 went red having produced PR #292.
          # Point the remote at THIS JOB's token before trying anything.
          #
          # claude-code-action rewrites the remote URL at startup to embed its
          # GitHub App installation token, and those expire after exactly one
          # hour. Run 37749887640 ran 63 minutes, finished the work, and died
          # here with "Invalid username or token" — pushing to a URL carrying a
          # dead credential. The App token cannot be refreshed mid-run.
          #
          # GITHUB_TOKEN is different: minted per job, valid for the life of the
          # job rather than sixty minutes. With contents: write it can push. So
          # the rescue was always available; the step was just aimed at the wrong
          # credential.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already on origin — the agent pushed it"
            # Still push: the agent may have pushed early (step 3.6) and added
            # commits afterwards that its expiring token could not deliver.
            git push origin "$branch" || echo "::warning::branch exists; later commits could not be pushed"
          else
            git push -u origin "$branch" || {
              echo "::warning::fallback push failed even with the job token"
              exit 0
            }
          fi
          if gh pr list --repo "$GH_REPO" --head "$branch" --json number --jq '.[0].number' | grep -q .; then
            echo "PR already open for $branch"
          else
            gh pr create --repo "$GH_REPO" --base main --head "$branch" --fill
          fi

          # #322: a PR this net opened is born WITHOUT CHECKS, and would stay
          # that way forever.
          #
          # GitHub does not emit `pull_request` events for actions taken with
          # GITHUB_TOKEN. The primary path is unaffected because the agent uses
          # the Claude App token, which is why PRs #319 and #321 had checks and
          # #318 — the first PR this net ever opened — had none. `agent-merge`
          # then refuses it, correctly, on "no checks reported": there is no red
          # run, no skipped run, no event at all to explain the silence.
          #
          # Dispatching `pr-gates` on the branch is the fix that needs no new
          # credential. `workflow_dispatch` is the one documented exception to
          # the recursion guard — a GITHUB_TOKEN dispatch DOES start a run — and
          # that run attaches its check runs to the head SHA, which is what
          # agent-merge reads. Defect 7 on #313 used exactly this for
          # close-on-evidence.
          #
          # What this does NOT give us: the dispatched run tests the BRANCH, not
          # `refs/pull/N/merge`, so it cannot catch a conflict with a moved
          # `main`. That is a weaker assertion than a real `pull_request` run and
          # is stated here so nobody reads this green as the stronger one. The
          # first push by a human or the App to the branch produces the real run.
          #
          # Never fail the cycle over this: the work is pushed and the PR is
          # open, which is the net's whole job. A missed dispatch is a stall the
          # steward can see, not a reason to discard a delivered branch.
          if gh workflow run pr-gates.yml --repo "$GH_REPO" --ref "$branch"; then
            echo "::notice::dispatched pr-gates on $branch — the net's PR would otherwise carry no checks (#322)"
          else
            echo "::warning::could not dispatch pr-gates on $branch. The PR is open and carries NO CHECKS, so agent-merge will refuse it on 'no checks reported' and it will not merge. Dispatch it by hand: gh workflow run pr-gates.yml --ref $branch"
          fi
