# Pre-merge gate. This is the green that `agent-merge` waits for.
#
# WHY THIS EXISTS
# ---------------
# `verify-production.yml` asserts against the ALREADY-DEPLOYED site. Its own
# header says so, and it cannot gate a pull request — by the time it runs, the
# code is live. There are 26 `scripts/verify_*.py` gates and a behaviour suite
# in this repo and, until now, no workflow ran any of them on a PR.
#
# That matters more than usual here: `main` auto-deploys, there is no staging,
# and production is the first place code runs. An autonomous loop that opens PRs
# needs something other than its own opinion to decide what lands.
#
# EXIT 2 IS NOT A PASS
# --------------------
# Several gates exit 2 to mean "I could not run" — `verify_css_build` when
# tailwindcss is absent, `verify_devanagari_serif` when no server answers. They
# say so explicitly: "SKIPPED (exit 2). This is NOT a pass — the check did not
# run." A workflow that only tests for exit 0 would silently lose coverage and
# still show green, which is the precise failure these gates were written to
# avoid. So this job builds the CSS and starts the app BEFORE the sweep, and
# treats 2 as a failure.
name: PR gates

# Pull requests AND pushes to `main`.
#
# `main` WAS dropped from this list, and the reasoning is kept here because it
# was not wrong — it was incomplete. Running on every merge re-ran 21 gates
# against a tree that had just passed them as a PR, ~5 minutes to re-prove the
# same thing; merging #284 fired four workflows for a two-file change and made
# that obvious. What that argument missed is that a PR leg does not prove what
# it appears to prove: it asserts `<branch> + main-at-the-time`, never `main` as
# it actually ends up. Two PRs can each be green alone and red as a pair, and on
# 2026-10-20 two of them were (#461, detailed at the `push:` key below). No
# amount of re-running the PR leg catches that, so the ~5 minutes is not a
# duplicate of the PR run; it is the only run that reads the tree that ships.
#
# What else covers `main` after a merge:
#   verify-build.yml       on push — the committed CSS matches a fresh build
#   verify-production.yml  on push — the LIVE SITE, which is the only claim a
#                          post-merge check can make that a pre-merge one cannot
#   main-red-report.yml    on workflow_run — turns a red `main` run into an
#                          issue comment, because neither `workflow_run`
#                          listener on this workflow acts on a push run
#
# verify-production still covers the squash-onto-a-moved-`main` case against the
# deployed site — the stronger assertion, and with BUILD_SHA set (2026-10-08) it
# can prove which commit is serving. It just does it AFTER the bad code is live,
# which is what the `push:` leg below exists to get ahead of.
on:
  pull_request:
    # `ready_for_review` is NOT in the default set, which is
    # [opened, synchronize, reopened] — and its absence stranded PR #303.
    #
    # /agent-cycle opens its PR as a DRAFT while QA is still running (deliberate:
    # "a PR that exists and is not ready is recoverable; work that never left the
    # runner is not"). Marking it ready afterwards therefore emitted an event
    # nothing listened to, so a PR could be un-drafted and still carry no checks
    # at all — and agent-merge refuses on "no checks reported", correctly. The PR
    # sat with qa-pass and nothing to merge on.
    types: [opened, synchronize, reopened, ready_for_review]

  # #322: so agent-work's fallback net can make this run against a branch whose
  # PR was opened with GITHUB_TOKEN, which emits no `pull_request` event. Those
  # PRs were born gate-less and agent-merge refused them forever.
  #
  # A dispatched run checks out the BRANCH, not `refs/pull/N/merge`, so it does
  # not prove the merge result — only that the branch itself passes. That is
  # weaker than the `pull_request` leg above and must not be mistaken for it.
  # It is still strictly better than the nothing it replaces.
  workflow_dispatch:

  # #461: THE MERGE RESULT IS WHAT SHIPS, AND NOTHING GATED IT.
  #
  # Every leg above asserts against `<branch> + main-at-the-time`, never
  # against `main` as it actually ends up. On 2026-10-20 two PRs landed the
  # same day: #455 added a mutation row whose `test` field named
  # `test_the_window_selector`, a test that has never existed, and a sibling PR
  # added the per-row targeting that READS that field and treats it as
  # load-bearing. Each was green on its own branch -- #455 was measured before
  # the check existed, the check was measured against a tree without the row.
  # The PAIR is red. No amount of per-PR gating catches that, because neither
  # PR is wrong by itself; only their merge is.
  #
  # `main` then stayed red from 2026-10-20 to 2026-10-21 and nothing said so.
  # It surfaced only when PR #451 merged `main` in and inherited the failure,
  # where it read as a #398 defect and cost a diagnosis round to attribute.
  # The last run on `main` before this was 2026-10-08 (`db4834c`), thirteen
  # days earlier.
  #
  # The two `github.event.pull_request.base.sha` reads below already have
  # non-PR fallbacks written for exactly this case -- the scope step falls back
  # to `HEAD~1` and the mutation step says "not a pull request -> every row".
  # EVERY ROW is the right choice here and must not be "optimised" to the
  # push diff: the #455 row arrived in one main commit and its reader in
  # another, so a sweep scoped to either commit's diff sees neither half. The
  # full sweep is the only thing that reads the tree as it actually is.
  #
  # Downstream listeners were checked before this was added, because both are
  # triggered by `workflow_run` on this workflow:
  #   * agent-merge.yml  -- its job `if:` demands
  #     `workflow_run.event == 'pull_request'`, so a push run never reaches it.
  #   * qa-on-green.yml  -- resolves the PR by head branch and exits 0 on
  #     "No open PR on `main`".
  # Neither acts on a push run; the cost is one ~10s no-op per main commit.
  # That is WHY `main-red-report.yml` exists: a push run that goes red has no
  # downstream listener at all, so without it a red `main` is visible only to
  # whoever thinks to open the Actions tab -- which is the situation #461 is.
  push:
    branches: [main]

concurrency:
  # ONE GROUP PER REF, and `main` is deliberately NOT cancellable.
  #
  # A cancelled run reports nothing. With `cancel-in-progress: true` on `main`,
  # a second push during the first push's ~8 minutes would cancel it, and the
  # commit that broke the tree would leave no verdict at all -- re-creating the
  # exact invisibility #461 is about, through the mechanism added to fix it.
  # Nearly every commit on `main` gets its own verdict; branches still coalesce,
  # NOT every one: GitHub keeps a single PENDING run per group, so a burst of
  # three pushes inside one run drops the middle one (`agent-merge.yml:110-117`
  # records the same mechanism). That commit gets no verdict of its own, and
  # the reporter deliberately reports `cancelled` -- so it can file a
  # "[main-red] ... did not pass" for a commit whose gates never actually
  # failed. Round 4 of #461 found this claim overstated; it is narrowed rather
  # than deleted because the common case really is one verdict per commit.
  # because there only the latest push matters.
  group: pr-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `contents: read` is all the checkout needs, and it must stay that way: a gate
# that can push is a gate that can relax itself. Nothing in this workflow writes
# anywhere -- reporting a red `main` is `main-red-report.yml`'s job, a separate
# `workflow_run` listener, because a reporter inside this job cannot report this
# job being KILLED (`failure()` is false on `cancelled` and `timed_out`).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # 35, not 20. Measured on run 39053584241 (PR #410, 2026-10-17): the job was
    # killed at 20m10s *inside* the verification sweep, having already spent
    #   behaviour suite        16s
    #   mutation sweep     15m46s   <- 178 rows at ~5.3s each
    #   verification gates  2m32s   (21 of 25 reached, then the axe)
    # The previous head of that same PR passed at 19m58s — two seconds of
    # margin — so every branch in the repo was sitting on this cliff, not just
    # the one that fell off. main's own sweep is 13m31s (run 39086177280).
    #
    # Raising a timeout is not relaxing a gate. A gate killed by the clock does
    # not FAIL, it never RUNS, which is this file's own "exit 2 is skipped, not
    # passed" hazard arriving by a different road: the four gates after
    # verify_numerology_reduction asserted nothing and nobody could tell.
    # agent-merge blocks on `cancelled` correctly, so the PR stayed shut — the
    # defect is that the evidence was never produced, not that it was ignored.
    #
    # The sweep is the cost and it is a real one; 178 mutations have to run the
    # suite 178 times. The durable fix is to shard it into a parallel job. This
    # buys the room to do that deliberately instead of under a red PR.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the base branch

      # A docs-only change cannot break the behaviour suite, and running 50
      # mutation sandboxes to prove that a CLAUDE.md edit is safe is ~5 minutes
      # of a 2,000-minute monthly allowance spent on nothing.
      #
      # The WORKFLOW still runs on every PR, deliberately. agent-merge is
      # triggered by workflow_run on this workflow completing, so a paths-ignore
      # filter would mean no event, no agent-merge, and an agent PR that can
      # never auto-merge — a PR with no check at all, which is precisely the
      # ambiguity this repo spent a morning chasing. So: always run, but skip the
      # expensive steps when nothing they test has changed.
      - name: Does this touch code?
        id: scope
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          changed=$(git diff --name-only "$base" HEAD || echo "")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Everything the suite, the gates or the build actually read.
          # .github/workflows counts: the behaviour suite reads
          # verify-production.yml to check its jq field reads still match /health.
          # A HERESTRING, not `echo ... | grep -q` (#461 round 4). Under
          # `pipefail` a `grep -q` exits as soon as it matches, the upstream
          # dies of SIGPIPE, and the PIPELINE reports 141 -- but only once the
          # input crosses the 64 KB pipe buffer, so no fixture-sized test
          # catches it. Not reachable here today (the largest `main` commit's
          # file list measured 847 bytes, and every tracked file name together
          # is 27 KB) but it is the class that cost this PR two rounds, and a
          # herestring removes it rather than relying on the input staying
          # small.
          if grep -qE '^(src/|tests/|scripts/|assets/|\.github/workflows/|package(-lock)?\.json|tailwind\.config\.js|pyproject\.toml|uv\.lock)' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> running the full gates"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> docs/config only; the suite has nothing to say about it"
            {
              echo "### Gates skipped — no code changed"
              echo "Changed paths touch none of src/, tests/, scripts/, assets/,"
              echo ".github/workflows/, or the build manifests, so the behaviour"
              echo "suite and the verification gates have nothing to assert on."
              echo ""
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # #384: ARCHITECTURE.md reached `main` carrying a live conflict block at
      # lines 40-44 and every gate passed over it, because none of them looked.
      # `verify_architecture_counts.py` reads that exact file and matches each row
      # by label, taking the first hit, so the duplicated row behind the marker
      # was invisible to it.
      #
      # NO `if:` HERE, DELIBERATELY. The scope step above reads a docs-only diff
      # as code=false and skips the behaviour suite and the whole verify_* sweep
      # -- and a docs-only diff is exactly the shape that shipped this defect. A
      # conflict marker in Markdown is invisible to every other check here, so
      # this one must not be skippable.
      #
      # It therefore runs BEFORE setup-uv and `uv sync`, and the gate is stdlib
      # only so that it can. It reads the INDEX -- paths from `git ls-files -s`
      # and content from `git cat-file --batch`, both of which the checkout
      # already provides -- not the working tree, which during a live merge is
      # supposed to hold markers. 0.16s over 620 files, measured 2026-10-28.
      #
      # That sentence was HALF TRUE when it was written: the first version took
      # its paths from the index and read each file from the working tree. In
      # CI the two coincide, which is why it passed review and why the gap
      # could only ever have been found by reading the code rather than the
      # runs. It is true now.
      #
      # On a code PR the `scripts/verify_*.py` sweep below picks it up again and
      # it runs twice. That is 0.17s, and the duplication is the point: the sweep
      # is the normal path, this step is the docs-only safety net.
      - name: Merge-conflict markers in tracked files
        run: python3 scripts/verify_conflict_markers.py

      # enable-cache MUST be an explicit false. The action defaults to `auto`,
      # which turns caching on for hosted runners, so merely deleting
      # `enable-cache: true` left it on — and its POST step kept exiting 2 while
      # pruning, failing a job whose every real step had passed. agent-merge
      # gates on this workflow concluding success, so that flake would block
      # every agent PR after the work was already done.
      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.code == 'true'
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: "22"
          cache: npm

      # verify_rule_citations shells out to pdftotext to read the corpus PDFs
      # and check that a cited line range actually contains the quotation. The
      # runner has no poppler, so without this the gate fails AND its own
      # mutation self-test cannot go red — it reports "mutation did not turn the
      # gate red", which is the gate correctly refusing to vouch for itself.
      - name: System packages
        if: steps.scope.outputs.code == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: |
          uv sync --all-groups
          npm ci

      # verify_css_build skips without this, and a skip is not a pass.
      - name: Build CSS
        if: steps.scope.outputs.code == 'true'
        run: npm run build:css

      # verify_lang_switch_browser drives a real browser.
      - name: Playwright browser
        if: steps.scope.outputs.code == 'true'
        run: uv run playwright install --with-deps chromium

      - name: Syntax sweep
        if: steps.scope.outputs.code == 'true'
        run: |
          find src scripts -name '*.py' -print0 \
            | xargs -0 -n1 uv run python -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())'

      - name: Behaviour suite
        if: steps.scope.outputs.code == 'true'
        run: uv run pytest -q

      # A suite that cannot go red proves nothing. #141 and #146 are why.
      # SCOPED ON A PR, EVERY ROW ON main. Measured on this repo's own run: 545s
      # of a ~640s job, 90% of `gates`, against 25s for the behaviour suite it
      # validates. 467 rows x ~0.66s of pytest start-up that no narrowing
      # removes -- so the only remaining lever is running fewer rows.
      #
      # That IS a relaxation and is treated as one. A row is selected when its
      # mutated file OR its named test's file is in the diff, so a PR deleting a
      # guard still hits that row's GUARD GONE check. The assumption for
      # everything else -- that an untouched file's guard still goes red -- was
      # proven by the last full sweep on main, which is why main never scopes.
      # The script forces every row anyway if the harness, tests/conftest.py,
      # pyproject.toml or uv.lock changed, or if the diff cannot be computed at
      # all: a scoping bug must cost time, never coverage. The CONTROL always
      # runs.
      #
      # Measured against real diff shapes: one route file 10/467 rows, this
      # whole PR minus the harness 40/467, a template- or docs-only change 0.
      - name: Prove the suite can fail
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            echo "pull request -> scoping to the diff against $BASE"
            uv run python scripts/mutate_behaviour_suite.py --changed-since "$BASE"
          else
            echo "not a pull request -> every row"
            uv run python scripts/mutate_behaviour_suite.py
          fi

      # Same rule, applied to the workflow gate. `verify_workflows.py` already
      # runs via the `scripts/verify_*.py` sweep below, but running is not the
      # same as being PROVEN, and ARCHITECTURE.md's standing rule is "prove a
      # gate can fail before trusting that it passes".
      #
      # This step was missing while ARCHITECTURE.md asserted it was here. QA
      # caught both halves: the gate was live and unproven in CI, which is
      # precisely the condition its harness exists to prevent. The doc was right
      # about what should be true and wrong about what was.
      #
      # Cheap, unlike the behaviour-suite mutations: no sandboxed test runs, just
      # the gate re-executed over temp copies of .github/workflows.
      - name: Prove the workflow gate can fail
        if: steps.scope.outputs.code == 'true'
        run: uv run python scripts/mutate_verify_workflows.py

      # verify_devanagari_serif needs a live server on 127.0.0.1:8000.
      - name: Start the app
        if: steps.scope.outputs.code == 'true'
        run: |
          uv run astro-ai > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && echo "up after ${i}s" && exit 0
            sleep 1
          done
          echo "app did not start"; tail -40 /tmp/app.log; exit 1

      - name: Verification gates
        if: steps.scope.outputs.code == 'true'
        run: |
          # GitHub runs `run:` under `bash -e`, so a failing gate would kill this
          # step before the exit code is even read — no notice, no summary, just
          # "exit code 1". That is how the first run of this workflow reported
          # nothing about which gate failed. The sweep must handle its own
          # failures, so disable the shell's.
          set +e

          # Two gates need a WORKING LLM, not a stub: they fetch rendered pages
          # and assert on the prose. Without a key the app answers "API key not
          # configured", which they correctly report as English text on a Hindi
          # URL. CI has no key by design — settings.json stubs it and a real one
          # would spend the free Groq budget on every PR. They belong in
          # verify-production.yml, which runs against the deployed site where
          # the LLM works, and that is where they should move.
          NEEDS_LIVE_LLM="verify_english_surface verify_hindi_surface"

          # RUN THEM IN PARALLEL, except the ones that cannot be.
          # Measured 2026-10-20: this step was 170s and 110s on two consecutive
          # runs, 13% of the job, with ~24 gates executed one after another.
          # Nearly all of them only read files.
          #
          # NOT parallel: anything that drives the dev server on a fixed port.
          # `verify_lang_switch_browser` drives a real Chromium and
          # `verify_devanagari_serif` needs the server on 127.0.0.1:8000, and
          # CLAUDE.md records that port being squatted by foreign processes as a
          # live hazard. They run after, serially, with no concurrency to add a
          # second failure mode to a check that has already been flaky.
          NEEDS_SERVER="verify_devanagari_serif verify_lang_switch_browser"

          # NO HEREDOC. The first version wrote the per-gate helper with
          # `cat > ... <<'GATE'` inside this block scalar, which made the whole
          # workflow unparseable -- `verify_workflows.py` caught it in one run,
          # on the same day an empty expression in a comment took this repo's
          # steward offline for two days -- in the comment explaining that very
          # rule, and the gate caught this one too. A `run:` block is YAML first and shell
          # second, and anything that looks like a key is a trap.
          RES=$(mktemp -d)

          par=""; ser=""
          for f in scripts/verify_*.py; do
            n=$(basename "$f" .py)
            case " $NEEDS_LIVE_LLM " in
              *" $n "*) echo "::notice::$n not run here — needs a live LLM; covered by verify-production.yml"; continue ;;
            esac
            case " $NEEDS_SERVER " in
              *" $n "*) ser="$ser $f"; continue ;;
            esac
            par="$par $f"
          done

          # -P 4 matches the runner's cores; -n 1 so one gate is one process.
          # `_` is argv[0] for the inner shell, then the gate file and the
          # results directory arrive as "$1" and "$2" -- passed as ARGUMENTS
          # rather than interpolated into the script, so a path can never be
          # parsed as code.
          printf '%s\n' $par \
            | xargs -n 1 -P 4 -I GATEFILE sh -c 'n=$(basename "$1" .py); uv run python "$1" > "/tmp/$n.log" 2>&1; echo $? > "$2/$n.code"' _ GATEFILE "$RES"
          for f in $ser; do n=$(basename "$f" .py); uv run python "$f" > "/tmp/$n.log" 2>&1; echo $? > "$RES/$n.code"; done

          # VERDICTS ARE READ AFTER THE FACT, from files. A parallel loop cannot
          # accumulate shell variables -- each gate runs in its own process and
          # its `pass=$((pass+1))` would be lost, which would read as "0 of 24
          # passed" and fail every PR. The exit code of each gate is the only
          # thing crossing the boundary.
          pass=0; failed=""; skipped=""
          for f in $par $ser; do
            n=$(basename "$f" .py)
            code=$(cat "$RES/$n.code" 2>/dev/null || echo 99)
            case $code in
              0) pass=$((pass+1)); echo "::notice::$n PASS" ;;
              2) skipped="$skipped $n"; echo "::error::$n SKIPPED (exit 2) — the check did not run, which is not a pass" ;;
              99) failed="$failed $n"; echo "::error::$n produced NO exit code — it never ran, which is not a pass" ;;
              *) failed="$failed $n"; echo "::error::$n FAIL (exit $code)"; tail -25 "/tmp/$n.log" ;;
            esac
          done
          total=$(( $(ls scripts/verify_*.py | wc -l) - $(echo $NEEDS_LIVE_LLM | wc -w) ))
          echo "### Gates: $pass/$total passed" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$skipped" ] && echo "- skipped (NOT a pass):$skipped" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$failed" ]  && echo "- failed:$failed" >> "$GITHUB_STEP_SUMMARY"

          # No hard-coded floor. #124 took the count from 19 to 23 between one
          # commit and the next, and a literal number goes stale the moment a
          # gate is added — then it either blocks every PR or, worse, is edited
          # downward to make a red build green.
          #
          # The rule instead: every gate that is not explicitly excluded must
          # pass. Excluding one is a visible, reviewable line in NEEDS_LIVE_LLM
          # with a reason beside it; silently dropping coverage is not possible.
          if [ -n "$failed" ] || [ -n "$skipped" ] || [ "$pass" -ne "$total" ]; then
            echo "::error::$pass of $total gates passed — failed:$failed skipped:$skipped"
            exit 1
          fi

      # THE REPORTER READS THIS STEP BY NAME (#461). Everything above is
      # `if: steps.scope.outputs.code == 'true'`, so a docs- or
      # measurements-only push SKIPS every gate and the job still concludes
      # `success` -- indistinguishable, from outside, from a run in which all
      # 21 gates passed. Measured 2026-10-31: 26 of the last 40 commits on
      # `main` were that shape.
      #
      # `main-red-report.yml` therefore asks the jobs API for this step's
      # conclusion rather than trusting the run's. `success` here means the
      # gates really executed; `skipped` means the run asserted nothing and so
      # must neither open a sentinel nor close one. Renaming this step without
      # updating the reporter silently restores the bug, which is why the
      # reporter fails loudly when it cannot find the step at all.
      - name: GATES ASSERTED
        if: steps.scope.outputs.code == 'true'
        run: echo "the suite and every gate ran against this commit"

      - name: App log on failure
        if: failure()
        run: tail -60 /tmp/app.log || true
