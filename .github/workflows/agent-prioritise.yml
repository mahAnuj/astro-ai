# The standing answer to "what is most important right now".
#
# project-manager already ranks correctly — but only inside a delivery cycle,
# once a night, and the result dies with the runner. The cycle takes the top
# item and the other six rankings evaporate. BACKLOG.md was meant to be that
# memory; its last full scan was 2026-08-25 against 36 open issues, and there
# are now 60. /prioritise is the command that writes it and nothing has ever
# scheduled it.
#
# So: rank weekly, persist it, and let the nightly cycle rank against a
# maintained list rather than rediscovering the backlog every night.
name: Agent prioritise
# The title is how chain_cycle.py recognises a retrofit run (it cannot read
# inputs from the runs API); tests/test_evidence_retrofit.py pins both copies.
run-name: ${{ inputs.mode == 'evidence' && 'Evidence retrofit' || 'Agent prioritise' }}

on:
  schedule:
    - cron: "0 17 * * 0"   # Sundays, 22:30 IST — ahead of the week's loops
  workflow_dispatch:
    inputs:
      # EVIDENCE MODE (2026-11-10). Measured that day: 63 of 112 open issues
      # failed verify_issue_evidence.py, so the build loop refused them at
      # Step 1 and its runs alternated between the few eligible items and
      # nothing. The cycle may not write its own eligibility; this loop's
      # project-manager is a different agent that already holds issues: write
      # and the four-kind close grant. chain_cycle.py dispatches this mode when
      # 3 or more open issues fail the gate (at most once per 6h).
      mode:
        description: "rank (the weekly queue) or evidence (retrofit or close issues failing the Evidence Block gate)"
        type: choice
        options: [rank, evidence]
        default: rank

concurrency:
  group: agent-prioritise
  cancel-in-progress: false

jobs:
  prioritise:
    # LOOP PAUSE (#903): set the repository variable LOOP_PAUSED=true to skip
    # every Claude-spending loop job; delete it (or set anything else) to resume.
    if: vars.LOOP_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read      # project-manager is read-only, including on BACKLOG.md
      issues: write       # triage comments and proposed closures
      actions: read
      # Required by claude-code-action for its GitHub App auth. Without it the
      # step fails three times with "Could not fetch an OIDC token" before the
      # agent runs at all — which is how the first dispatch of this workflow
      # died. Every other loop already had it; this one was written without.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # it diffs against the SHA in BACKLOG.md's header

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-groups

      # Ranking against the analyst's numbers rather than against issue titles.
      - name: Fetch the latest measurement
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PREFER THE COMMITTED REPORT (2026-11-06) over agent-measure.yml's artifact. It commits the
          # analyst's report as measurements/latest.md, which this checkout already
          # holds. The artifact download below picked the newest SUCCESSFUL
          # agent-measure run, which is usually a collectors-only run with the
          # analyst job skipped and no artifact ("no valid artifacts found") --
          # measured: 18 of 74 build cycles since 10-30 actually got the report.
          mkdir -p /tmp/measure
          if [ -s measurements/latest.md ]; then
            cp measurements/latest.md /tmp/measure/report.md
            echo "analyst report from measurements/latest.md: $(head -1 measurements/latest.md)"
            exit 0
          fi
          id=$(gh run list --workflow agent-measure.yml --status success \
                 --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" -n measurement --dir /tmp/measure && ls -la /tmp/measure
          else
            echo "no prior measurement — ranking on harm alone"
          fi

      - name: List the issues the build loop refuses
        if: inputs.mode == 'evidence'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uv run python scripts/evidence_backlog.py --out /tmp/evidence_backlog.md > /dev/null
          head -1 /tmp/evidence_backlog.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Retrofit or close
        if: inputs.mode == 'evidence'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          # chain_cycle.py dispatches this step as github-actions, and the action
          # refuses a bot-initiated run unless named here: run 42933391630
          # (2026-11-11 00:41Z) died with "Workflow initiated by non-human
          # actor: github-actions (type: Bot)" before the agent started, so the
          # retrofit never ran and the ops alert "agent-prioritise.yml's last
          # run failed" (#876) went up. Exactly the grant agent-work.yml and
          # agent-steward.yml already carry, and no wider: not "*".
          allowed_bots: "github-actions"
          prompt: |
            You are project-manager, in EVIDENCE MODE. Follow the project-manager
            agent definition. Do not rank, and do not rewrite BACKLOG.md.

            /tmp/evidence_backlog.md lists, in harm order, every open issue the
            build loop refuses because `scripts/verify_issue_evidence.py` fails
            it. The build cycle may not write those blocks itself -- that would
            be grading its own eligibility -- so until you do, those issues are
            unbuildable however real they are. Measured 2026-11-10: 63 of 112.

            Take them from the top. Stop after 15, or sooner if you are running
            out of turns: the next retrofit run continues from the new list.
            For EACH issue, read the body and every comment, then MEASURE on this
            checkout (and the live site with curl where useful). Never copy a
            number, a line range or a rule from the issue's own text.

            1. If it is one of the four kinds below, close it, exactly as the
               closing rules at the end of this prompt require: already fixed (quote the commit
               and what you checked), does not reproduce (the command and its
               output), overtaken by events (the grep returning nothing), or
               duplicate (name the survivor). Never close for age or low value.
            2. Otherwise, if the premise holds, post ONE comment headed
               `**Evidence Block (retrofit, measured at <short sha>)**` with plain
               `key: value` lines -- `repro:` (a command and its expected result
               after `->`, with today's output), `corpus:` (a
               `src/astro_ai/knowledge/<file>.md:<a>-<b>` range you opened that
               supports the rule, `[UNSOURCED]`, or `n/a -- <reason>`), `tokens:`
               (a measured number; `0` with how you know for a path with no LLM
               call), `thesis:`, `metric:` (a falsifiable number), and `gsc:` or
               `ga4:` with a YYYY-MM-DD window when the labels carry none of bug,
               chore or category:technical -- read them from measurements/, never
               invent one. Then re-run
               `uv run python scripts/verify_issue_evidence.py <n>` and confirm it
               exits 0. If it does not, fix your comment by posting a corrected
               one (the checker reads the LAST occurrence of each field).
            3. If you cannot establish the premise either way, add the label
               `needs-evidence` and comment exactly what is missing.

            An astrological rule with no knowledge/*.md line range is
            `[UNSOURCED]`, never a citation you did not open. data/ may be absent
            on this runner; say so where it matters. No anecdotes, no invented
            numbers: on this site a fabricated measurement is the worst defect.

            Close only these four kinds, each with a closing comment that lets
            someone else check you (command, output, SHA). Do NOT close anything
            whose fix shipped but is unverified in production -- that is
            close-on-evidence.yml's job. You never push, and you never touch a
            QA label.

            Write /tmp/report.md: one line per issue you handled
            (`#n | closed <kind> | block posted, checker exit 0 | needs-evidence`)
            and the count left on the list.
          claude_args: |
            --max-turns 80
            --effort high
            --allowedTools "Read,Write,Glob,Grep,TodoWrite,Bash,WebFetch,Agent"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gcloud:*),Bash(gh secret:*),Bash(gh repo:*),Bash(gh pr:*)"

      - name: Rank
        if: inputs.mode != 'evidence'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WITHOUT THIS, A LOOP CANNOT DIAGNOSE ITS OWN FAILURE.
          #
          # The action's default hides the agent's output: "Running Claude Code
          # via SDK (full output hidden for security)". So when a run produces
          # nothing, the only evidence left is the result JSON -- a turn count,
          # a duration and a cost. Measured on run 41204804846: the action step
          # SUCCEEDED (`is_error: false`, `permission_denials_count: 0`) after
          # 2 turns in 17s, wrote no /tmp/report.md, and "Publish the queue"
          # correctly failed the job with "No queue written". Why the agent
          # stopped after two turns is unanswerable from the log. A successful
          # run of this same loop takes 14-31 turns.
          #
          # That is almost certainly the same wall behind `loop-outcomes`'
          # standing finding that `agent-work` concluded success with no PR and
          # no cannot-reproduce/needs-evidence trace on 29 of 32 runs: the loop
          # reports a cost and a silence, and nobody can see which.
          #
          # The repo is PUBLIC, so this log is public. It is enabled here only,
          # not across the other nine agent loops, because this is the loop
          # being diagnosed -- widen it only after reading what one run prints.
          show_full_output: "true"
          prompt: |
            /prioritise

            Follow .claude/commands/prioritise.md and the project-manager agent
            definition exactly.

            **The staleness sweep comes first, and it matters more than usual
            this week.** BACKLOG.md's last full scan is 2026-08-25 against 36
            open issues; there are now 60, and roughly ten were filed by the
            agent loops in the last two days. Treat BACKLOG.md as a cache that
            has outlived its evidence — use it to decide where to look, never to
            skip a check, and never restamp a carried-forward verdict with
            today's SHA.

            Probe rather than read. `uv run python scripts/validate_issue.py <n>`
            exists now; use it where an issue has an executable repro. Per #281,
            `NO-REPRO` means "not checkable by HTTP probe", not "not a problem" —
            establish the premise another way and say which way.

            /tmp/measure/report.md, if present, is the analyst's latest
            measurement. Rank against it: an issue the analyst showed moving
            nothing outranks nothing, and a page carrying real impressions
            outranks a page carrying none.

            measurements/lessons.md is the loop's memory (scripts/collect_lessons.py):
            the last 30 days of our own QA FAILs by theme, reverts, failed production
            checks, the analyst's HIT/MISS verdicts, and competitor patterns. Read it
            before choosing work. Do not repeat a kind of change that MISSED without
            saying why this time differs, and treat a repeated error theme as a
            reason to fix the cause, not just the instance.

            measurements/sync/chief-guidance.md is chief's twice-weekly review of
            every agent against OBJECTIVE.md. Read your role's row and follow its
            instruction, unless it conflicts with a gate, CLAUDE.md, a QA verdict
            or knowledge/*.md; then say so in your output and do not follow it.

            Rank by user harm, then unblocking power. Not by ease, not by age,
            not by label. At most 5-7 items in the queue.

            WRITE THE WHOLE THING TO /tmp/report.md, in the shape BACKLOG.md
            takes: the ranked queue with reasons, the stale list with evidence,
            the blocked list, the explicitly-not-recommended list, and the full
            open-issue index with a `checked@` SHA per row. **A row you did not
            individually re-verify this pass gets an em-dash, not today's SHA.**
            Restamping unchecked rows is how this file becomes next week's false
            confidence, and it has already cost this repo once.

            Note the deltas against the existing BACKLOG.md — what changed, what
            you carried forward unchecked, what is new since the last scan.

            ## You may close issues now — with evidence, and only these kinds

            Granted 2026-10-08 by the user, who wants the backlog maintained
            without their attention. It applies to THIS loop only; the delivery
            loop's agents are still denied it.

            Close only what your staleness sweep proves, and only these four:

            - **Already fixed** — verified against `origin/main`, never against a
              claim in a comment. Quote the commit and what you checked.
            - **Does not reproduce** — you probed it. Give the request and the
              response. #156 and #157 were filed against a local tree.
            - **Overtaken by events** — the code it describes no longer exists.
              Show the grep that returns nothing.
            - **Duplicate or subsumed** — name the survivor and say why it covers
              this one.

            **Do NOT close** anything whose fix shipped but is unverified in
            production. That is `close-on-evidence.yml`'s job, and it waits for
            three facts: the PR merged, verify-production green for that exact
            commit, and /health reporting that commit as serving. #143 was closed
            as fixed while a fourth wrong date was still live — that is the
            incident this split exists to prevent.

            **Every closing comment must let someone else check you**, exactly as
            CLAUDE.md requires: the command you ran, its output, and the SHA you
            verified at. "Fixed" is not a closing comment. If you cannot produce
            that evidence, do not close it — comment and leave it open.

            A wrong close is cheap to undo and a wrong push is not, which is why
            this permission exists and the push one does not.

            You never push.
          claude_args: |
            --max-turns 80
            --effort high
            --allowedTools "Agent,Read,Write,Glob,Grep,TodoWrite,Bash,WebFetch"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gcloud:*),Bash(gh secret:*),Bash(gh repo:*)"

      - name: Publish the queue
        if: always()
        run: |
          if [ -s /tmp/report.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/report.md
          else
            echo "### No queue written — treat this run as having produced nothing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          # A RUN THAT PRODUCED NOTHING IS A FAILURE, NOT A SUCCESS.
          # It used to echo this line and exit 0. Measured on agent-prioritise:
          # three runs (2026-10-08, 10-11, 10-18) concluded `success` in 74-109
          # seconds having written no report at all, so `measurements/prioritise/`
          # has nothing newer than 10-08 and BACKLOG.md nothing newer than
          # 2026-08-27 -- its header still reads "36 open issues at scan time"
          # against ~60 now. Nobody looked, because nothing was red.
          # This is CLAUDE.md's named signature failure: "A green run that did
          # exactly nothing." The `if: always()` above stays, so the summary is
          # still written and the artifact still uploads; only the verdict changes.
            exit 1
          fi

      - name: Collect for persistence
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -f /tmp/report.md /tmp/out/report.md 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prioritise-report
          path: /tmp/out
          if-no-files-found: ignore

  # Separate job, no agent in it. project-manager is read-only on BACKLOG.md by
  # definition — "you read it but never write it; the parent session updates it
  # from what you hand back" — so the agent job stays contents:read and this
  # shell step does the writing.
  persist:
    needs: prioritise
    # The retrofit writes issue comments, not a queue: nothing to commit.
    if: always() && inputs.mode != 'evidence' && needs.prioritise.result != 'skipped'   # #903: nothing to keep when the loop is paused
    runs-on: ubuntu-latest
    permissions:
      # contents       the branch push
      # pull-requests  `gh pr create` and `gh pr merge --auto`
      # actions        `gh workflow run` -- #322: a PR opened with GITHUB_TOKEN
      #                emits no `pull_request` event, so pr-gates and
      #                verify-build have to be dispatched or the required
      #                checks never report and the PR never merges
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prioritise-report
          path: /tmp/out
        continue-on-error: true

      # #393: the PR opened below must NOT be authored by `github-actions[bot]`.
      # Since 2026-06-11 GitHub holds the `pull_request` runs of a PR that bot
      # opens in `action_required`, and while one held suite sits on the head
      # SHA it reports NO status rollup for the PR AT ALL -- measured on #477
      # and #478, where `gates` and `build-gates` were green on the SHA, the
      # rollup was null for nine minutes, and auto-merge never fired. There is
      # no setting that disables it; the fork-PR approval policy was tested at
      # its loosest value and made no difference. A GitHub App token is
      # GitHub's own documented remedy, and this repo already demonstrates it:
      # `claude[bot]`'s PRs have never been held.
      #
      # `continue-on-error` plus the `||` below is what keeps a missing or
      # expired key from being WORSE than the bot: the publish still happens on
      # `github.token`, the checks are held, and someone approves them by hand
      # -- exactly today's behaviour, rather than a failed step and a
      # dashboard that silently stops moving.
      - name: Mint a publisher token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

      - name: Commit the queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s /tmp/out/report.md ] || { echo "nothing to persist"; exit 0; }
          mkdir -p measurements/prioritise
          stamp=$(date -u +%Y-%m-%d)
          cp /tmp/out/report.md "measurements/prioritise/$stamp.md"
          cp /tmp/out/report.md measurements/prioritise/latest.md
          # THROUGH A PULL REQUEST, not `git push origin HEAD:main` (#393).
          # `main` requires one, so the old direct push was rejected with
          # GH006. This loop is weekly, so its breakage was still latent when
          # the fix landed -- `agent-measure` is the one that surfaced it, by
          # failing ~40 times in six days.
          # BACKLOG.md itself is NOT written here: it sits at the repo root,
          # outside measurements/**, so committing it would redeploy production
          # for a triage document -- and publish_measurements.sh refuses any
          # path outside measurements/ for exactly that reason. Promote from
          # measurements/prioritise/latest.md by hand when it is worth it.

          bash scripts/publish_measurements.sh \
            --path measurements/prioritise --title "backlog scan"
