# Close an issue when production proves its fix is live — and only then.
#
# CLAUDE.md's two-stage close, mechanised:
#
#   1. the fix lands locally  -> comment with the SHA. DO NOT CLOSE.
#   2. once deployed          -> verify against production, then close with
#                                that evidence.
#
# Every agent is explicitly denied `gh issue close`, deliberately: #143 was
# closed as fixed while a fourth wrong date was still live. That rule is right
# and stays. What was missing is the second stage ever happening — this morning
# a ranking proposed five closures with evidence and nothing acted on them, so
# the backlog grows and every weekly ranking re-sweeps issues already known dead.
#
# This is not an agent exercising judgment. It is a mechanical check of the
# condition CLAUDE.md already requires:
#
#   a PR that says "closes #N" merged to main, AND
#   verify-production concluded success for that exact commit, AND
#   /health reports that commit as the revision serving
#
# All three, or nothing happens.
name: Close on production evidence

on:
  workflow_run:
    workflows: ["verify-production"]
    types: [completed]
  # DISPATCH ENTRY POINT — this is what makes the autonomous chain complete.
  #
  # Measured 2026-10-09: a `verify-production` run that `agent-merge` dispatched
  # with GITHUB_TOKEN emits NO `workflow_run` event, so the trigger above never
  # fires for it. Dispatching the identical workflow against the identical
  # commit with a user token fired it immediately:
  #
  #   agent-merge, GITHUB_TOKEN  run 37887912818  success  -> no close-on-evidence
  #   a user token, same commit  run 37890955328  success  -> fired (37891007703)
  #
  # GitHub's recursion guard reaches one level further than expected: the
  # `workflow_dispatch` exemption is enough to START a run, but that run is
  # still marked GITHUB_TOKEN-originated and its completion reaches no listener.
  # So every autonomously-merged PR got as far as merge -> deploy -> verified,
  # and then stopped: #268 and #304 both needed a dispatch by hand.
  #
  # `verify-production` now calls this directly on its own success when its
  # event was `workflow_dispatch`. A dispatch IS exempt from the guard, which is
  # the whole reason this path works.
  #
  # Deliberately NOT solved by having agent-merge close the issue itself: that
  # would duplicate every rule below — the keyword, the `Refs` suppression, the
  # branch fallback, the live-SHA check — in a second place, and this repo
  # already records what copied logic does ("copied files diverge", five times
  # in two days). One implementation, two entry points.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to close against. Must be the revision /health reports."
        required: true

permissions:
  contents: read
  issues: write
  # REQUIRED, and its absence made this workflow incapable of its one job.
  # The close step calls `gh api repos/{}/commits/{sha}/pulls` to find what the
  # commit shipped, and listing a commit's pull requests needs this scope. It
  # was missing, so that call returned
  #     gh: Resource not accessible by integration (HTTP 403)
  # and the step exited 1 — run 37817857859, the first run ever to get past
  # this job's `if`. Nothing had closed on production evidence, ever.
  pull-requests: read

jobs:
  close:
    # A red verification proves nothing is live. Nothing to close.
    #
    # `workflow_dispatch` is accepted alongside `push`, and that is what makes
    # this workflow reachable for autonomously-merged PRs at all. Measured
    # 2026-10-08: GitHub does not start a run for an event created with the
    # default GITHUB_TOKEN, so `agent-merge` merging a PR produces NO
    # push-triggered verify-production run — PR #299 got 0, while the three
    # PRs a human merged got 2 each. `agent-merge` now dispatches
    # verify-production itself (workflow_dispatch being the documented
    # exception to the guard), and this is the clause that lets the result
    # count. Without it the dispatch would run, go green, and close nothing.
    #
    # `schedule` is still excluded, deliberately: a drift run asserts that
    # production satisfies the invariants NOW, whoever deployed last. It is not
    # evidence that any particular commit shipped, which is the claim a close
    # makes. The live-SHA check below would mostly catch that anyway; this
    # keeps the intent explicit rather than relying on it.
    # A direct dispatch carries no workflow_run payload, so it is allowed through
    # on its own terms. It is not a weaker path: the caller is verify-production
    # itself, only on its own success, and every check below still runs — above
    # all that /health reports THIS commit, which is the claim a close makes.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.event == 'push'
              || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
      # Via env, not interpolated into the `run:` block below: this workflow
      # carries a privileged trigger (workflow_run), so verify_workflows.py
      # requires every value to arrive this way. See #358 for why -- `${{ }}`
      # is substituted before bash parses the script, so an interpolated value
      # is shell source, not a shell string.
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Is this exact commit serving?
        id: live
        run: |
          live=$(curl -s --max-time 30 https://shubhagya.com/health | jq -r '.build_sha // empty')
          echo "deployed build_sha: ${live:-null}   workflow head: $SHA"
          if [ -z "$live" ]; then
            # Before BUILD_SHA was set this was always null, and a null means we
            # cannot say WHICH commit is live — which is exactly the uncertainty
            # that makes closing unsafe.
            echo "::notice::/health reports no build_sha — cannot prove which commit is live, not closing anything"
            exit 0
          fi
          # 2026-11-18: a newer deploy that CONTAINS this commit is still proof it
          # is live. Requiring live == SHA skipped every PR merged in a burst: by
          # the time its verify-production finished, a later merge was serving.
          # Measured: #1056 (PR #1077, verify green 2026-11-15) never closed.
          if [ "$live" != "$SHA" ]; then
            rel=$(gh api "repos/$GH_REPO/compare/$SHA...$live" --jq .status 2>/dev/null || echo error)
            if [ "$rel" != "ahead" ]; then
              echo "::notice::live commit $live does not contain $SHA (compare: $rel) — not closing"
              exit 0
            fi
            echo "live $live contains $SHA"
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Close what this commit shipped
        if: steps.live.outputs.ok == 'true'
        env:
          LIVE: ${{ steps.live.outputs.live }}
        run: |
          # Only issues a merged PR explicitly claimed. A commit message
          # mentioning an issue is not a claim that it is fixed.
          # Every PR merged in the last 14 days whose merge commit is in $SHA's
          # history, not only $SHA's own PR (2026-11-18). A green run on $SHA
          # proves the code of all of them is live and passing now -- including
          # PRs whose own run was skipped (a newer deploy already serving) or
          # failed on the deploy-wait timeout (#1080 via PR #1118). Closing is
          # idempotent: an issue already closed is skipped below.
          # 14 days, not 7: #838 and #856's fixes merged 7-8 days before this
          # landed (issue_flow.py merged-but-open, 2026-11-18). At ~30 merges a day
          # that is ~400 PRs, so: page through them, keep only PRs that claim an
          # issue that is still OPEN, and spend a compare call on those alone.
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # Fail LOUD (QA on #1212): a listing that errors must turn the run red,
          # never pass as "nothing to close". pipefail covers the gh | jq pipes;
          # each listing is captured on its own so `bash -e` sees its status.
          set -o pipefail
          open_json=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
                        --jq '[.[] | select(.pull_request == null) | .number]' | jq -s 'add // []') \
            || { echo "::error::could not list open issues -- closing nothing"; exit 1; }
          list=$(gh api --paginate "repos/$GH_REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
                 --jq ".[] | select(.merged_at != null and .merged_at >= \"$since\") | {n: .number, m: .merge_commit_sha, t: ((.title // \"\") + \" \" + (.body // \"\")), b: .head.ref}" \
               | jq -r --argjson open "$open_json" \
                   '((if (.t | test("(?i)(clos(e|es|ed)|fix(es|ed)?|resolv(e|es|ed))\\s+#[0-9]")) then [.t | scan("#([0-9]+)") | .[0] | tonumber] else [] end)
                     + [.b | scan("^issue/([0-9]+)-") | .[0] | tonumber]) as $c
                    | select(any($c[]; . as $x | $open | index($x)) or .m == env.SHA) | "\(.n):\(.m)"') \
            || { echo "::error::could not list merged PRs -- closing nothing"; exit 1; }
          prs=""; compare_errors=0
          for pr_merge in $list; do
            pr=${pr_merge%%:*}; merge=${pr_merge#*:}
            if [ "$merge" = "$SHA" ]; then prs="$prs $pr"; continue; fi
            if ! rel=$(gh api "repos/$GH_REPO/compare/$merge...$SHA" --jq .status 2>/dev/null); then
              echo "::warning::compare failed for PR #$pr ($merge) -- not closing its issues this run"
              compare_errors=$((compare_errors + 1)); continue
            fi
            if [ "$rel" = "ahead" ]; then prs="$prs $pr"; fi
          done
          if [ -z "$prs" ]; then
            if [ "$compare_errors" -gt 0 ]; then
              echo "::error::$compare_errors compare call(s) failed and nothing else qualified -- closing nothing"; exit 1
            fi
            echo "no PR in the last 14 days is contained in $SHA"; exit 0
          fi
          echo "PRs contained in $SHA:$prs"

          reopen_errors=0
          for pr in $prs; do
            body=$(gh pr view "$pr" --repo "$GH_REPO" --json body,title --jq '.title + "\n" + .body')
            merged_at=$(gh pr view "$pr" --repo "$GH_REPO" --json mergedAt --jq .mergedAt)
            # GitHub's own closing keywords, so behaviour matches what an author
            # reading the PR would expect.
            # A list counts too: "Closes #1185, #1186 and #1187" closed only #1185
            # until 2026-11-18 (PR #1196), leaving #1186 and #1187 open.
            issues=$(echo "$body" | grep -oiE '(clos(e|es|ed)|fix(e[sd])?|resolv(e|es|ed))[[:space:]]+#[0-9]+([[:space:]]*(,|and|&)[[:space:]]*#[0-9]+)*' \
                     | grep -oE '[0-9]+' | sort -u || true)
            # `|| true` like refs= and the branch fallback below: under pipefail a
            # body with no closing keyword makes grep exit 1, and `bash -e` then
            # killed the step with no message and nothing closed (QA on #1212 at
            # e101051). "No keyword" is a normal state the fallback exists for.

            # FALL BACK TO THE BRANCH NAME. The keyword is prose an agent has to
            # remember to write, and on 2026-10-09 it did not: PR #312 was titled
            # "Lift the learn sticky CTA above the mobile tab bar (#304)" — a
            # MENTION, not a closing keyword — so this workflow ran, concluded
            # success, and closed nothing. Run 37891007703: "PR #312 claims no
            # issue". The first close-on-evidence run in this repo's history to
            # reach its own close step, and it had nothing to act on.
            #
            # `issue/<n>-<slug>` is not a convention anyone has to remember: it is
            # what /agent-cycle step 4 creates, and what `agent-merge` already
            # parses to comment on the issue. A branch name is structural, a
            # keyword in a body is a promise — and this repo's rule is that a glob
            # beats a promise.
            #
            # Deliberately a FALLBACK, not a replacement: an explicit `closes #N`
            # may name an issue the branch name does not, and it stays
            # authoritative where present.
            # An explicit `Refs #N` SUPPRESSES the branch-name fallback for N.
            #
            # The fallback below exists for a PR whose author FORGOT the keyword.
            # It must not override one that deliberately omitted it. PR #314 is
            # exactly that case: it implements part 1 of #313 and says
            # "Refs #313 — does not close it", because part 2 is unbuilt and two
            # recorded defects are undecided. Its branch is
            # `issue/313-verify-workflows-gate`, so without this the fallback
            # would close #313 on merge and silently abandon the rest — the very
            # thing writing `Refs` was meant to prevent.
            #
            # So: "no keyword" and "explicitly a reference, not a claim" are
            # different states, and only the first is a mistake to correct.
            refs=$(printf '%s' "$body" | grep -oiE 'refs?[[:space:]]+#[0-9]+' \
                   | grep -oE '[0-9]+' | sort -u || true)
            if [ -n "$refs" ]; then
              echo "PR #$pr explicitly REFS (does not claim) #$(printf '%s' "$refs" | tr '\n' ' ')— fallback suppressed for those"
            fi

            if [ -z "$issues" ]; then
              branch=$(gh pr view "$pr" --repo "$GH_REPO" --json headRefName --jq .headRefName)
              # grep -oE, not `sed 's|...\([0-9]\+\)...|'`: `\+` is a GNU
              # extension, so that pattern works on ubuntu-latest and silently
              # matches NOTHING on a BSD sed. A branch-name parser that cannot be
              # tested on the machine the author is using is a parser nobody
              # tests. This form behaves identically everywhere.
              issues=$(printf '%s' "$branch" | grep -oE '^issue/[0-9]+' | grep -oE '[0-9]+' || true)
              # Drop anything the body explicitly only REFS.
              for r in $refs; do
                if [ "$issues" = "$r" ]; then
                  echo "branch names #$r but the body refs it deliberately — not closing"
                  issues=""
                fi
              done
              # if/then, NOT `[ -n "$x" ] && echo`. Under `bash -e` that compound
              # returns 1 when $x is empty and KILLS THE STEP — the trap this repo
              # has now hit four times (pr-gates' gate sweep, its skipped-report
              # line, agent-merge's PR lookup, and this line as first written).
              if [ -n "$issues" ]; then
                echo "PR #$pr claims no issue in its body; taking #$issues from branch '$branch'"
              fi
            fi
            [ -n "$issues" ] || { echo "PR #$pr claims no issue, and its branch name carries none"; continue; }

            for n in $issues; do
              state=$(gh issue view "$n" --repo "$GH_REPO" --json state --jq .state 2>/dev/null || echo MISSING)
              [ "$state" = "OPEN" ] || { echo "#$n is $state — skipping"; continue; }
              # REOPENED AFTER THIS PR MERGED = production disagreed (QA on #1212
              # at f71d4db). Since this step looks back 14 days, every green run
              # would otherwise re-close an issue a human reopened, and the closing
              # comment's own "Reopen if production disagrees" would mean nothing.
              # A later PR that claims it (merged after the reopen) still closes it.
              # An unreadable timeline closes nothing on a guess.
              if ! reopened=$(gh api --paginate "repos/$GH_REPO/issues/$n/events" \
                     --jq "[.[] | select(.event == \"reopened\" and .created_at > \"$merged_at\")] | length" \
                     | jq -s 'add // 0'); then
                echo "::warning::could not read #$n's events -- not closing it this run"
                reopen_errors=$((reopen_errors + 1)); continue
              fi
              if [ "${reopened:-0}" != "0" ]; then
                echo "#$n was reopened after PR #$pr merged — not re-closing it"; continue
              fi
              # Empty on a workflow_dispatch run, which has no workflow_run payload.
              if [ -n "${RUN_URL:-}" ]; then run_link=" ([run]($RUN_URL))"; else run_link=""; fi
              gh issue close "$n" --repo "$GH_REPO" --reason completed --comment \
          "Closed on production evidence.

          - PR #$pr merged to \`main\`
          - \`verify-production\` concluded **success** for \`$SHA\`$run_link
          - \`/health\` reports \`build_sha\` = \`$LIVE\`, which is or contains \`$SHA\`, so **this PR's code is serving**

          That is CLAUDE.md's two-stage close: the fix landed, the deploy was verified, and the commit was confirmed live before closing. Reopen if production disagrees — a green run proves the invariants it asserts, not that nothing else broke."
              echo "closed #$n"
            done
          done
          if [ "$reopen_errors" -gt 0 ]; then
            echo "::error::$reopen_errors issue timeline read(s) failed -- those issues were not closed; the next green run retries them"
          fi
          if [ "$compare_errors" -gt 0 ]; then
            echo "::error::$compare_errors compare call(s) failed -- those PRs' issues were not closed; the next green run retries them"
          fi
          if [ "$compare_errors" -gt 0 ] || [ "$reopen_errors" -gt 0 ]; then exit 1; fi
