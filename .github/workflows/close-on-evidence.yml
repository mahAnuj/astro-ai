# Close an issue when production proves its fix is live — and only then.
#
# CLAUDE.md's two-stage close, mechanised:
#
#   1. the fix lands locally  -> comment with the SHA. DO NOT CLOSE.
#   2. once deployed          -> verify against production, then close with
#                                that evidence.
#
# Every agent is explicitly denied `gh issue close`, deliberately: #143 was
# closed as fixed while a fourth wrong date was still live. That rule is right
# and stays. What was missing is the second stage ever happening — this morning
# a ranking proposed five closures with evidence and nothing acted on them, so
# the backlog grows and every weekly ranking re-sweeps issues already known dead.
#
# This is not an agent exercising judgment. It is a mechanical check of the
# condition CLAUDE.md already requires:
#
#   a PR that says "closes #N" merged to main, AND
#   verify-production concluded success for that exact commit, AND
#   /health reports that commit as the revision serving
#
# All three, or nothing happens.
name: Close on production evidence

on:
  workflow_run:
    workflows: ["verify-production"]
    types: [completed]

permissions:
  contents: read
  issues: write
  # REQUIRED, and its absence made this workflow incapable of its one job.
  # The close step calls `gh api repos/{}/commits/{sha}/pulls` to find what the
  # commit shipped, and listing a commit's pull requests needs this scope. It
  # was missing, so that call returned
  #     gh: Resource not accessible by integration (HTTP 403)
  # and the step exited 1 — run 37817857859, the first run ever to get past
  # this job's `if`. Nothing had closed on production evidence, ever.
  pull-requests: read

jobs:
  close:
    # A red verification proves nothing is live. Nothing to close.
    #
    # `workflow_dispatch` is accepted alongside `push`, and that is what makes
    # this workflow reachable for autonomously-merged PRs at all. Measured
    # 2026-10-08: GitHub does not start a run for an event created with the
    # default GITHUB_TOKEN, so `agent-merge` merging a PR produces NO
    # push-triggered verify-production run — PR #299 got 0, while the three
    # PRs a human merged got 2 each. `agent-merge` now dispatches
    # verify-production itself (workflow_dispatch being the documented
    # exception to the guard), and this is the clause that lets the result
    # count. Without it the dispatch would run, go green, and close nothing.
    #
    # `schedule` is still excluded, deliberately: a drift run asserts that
    # production satisfies the invariants NOW, whoever deployed last. It is not
    # evidence that any particular commit shipped, which is the claim a close
    # makes. The live-SHA check below would mostly catch that anyway; this
    # keeps the intent explicit rather than relying on it.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Is this exact commit serving?
        id: live
        run: |
          live=$(curl -s --max-time 30 https://shubhagya.com/health | jq -r '.build_sha // empty')
          echo "deployed build_sha: ${live:-null}   workflow head: $SHA"
          if [ -z "$live" ]; then
            # Before BUILD_SHA was set this was always null, and a null means we
            # cannot say WHICH commit is live — which is exactly the uncertainty
            # that makes closing unsafe.
            echo "::notice::/health reports no build_sha — cannot prove which commit is live, not closing anything"
            exit 0
          fi
          if [ "$live" != "$SHA" ]; then
            echo "::notice::live commit $live is not this run's $SHA — a newer deploy landed, not closing"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Close what this commit shipped
        if: steps.live.outputs.ok == 'true'
        run: |
          # Only issues a merged PR explicitly claimed. A commit message
          # mentioning an issue is not a claim that it is fixed.
          prs=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[].number')
          [ -n "$prs" ] || { echo "no PR for $SHA"; exit 0; }

          for pr in $prs; do
            body=$(gh pr view "$pr" --repo "$GH_REPO" --json body,title --jq '.title + "\n" + .body')
            # GitHub's own closing keywords, so behaviour matches what an author
            # reading the PR would expect.
            issues=$(echo "$body" | grep -oiE '(clos(e|es|ed)|fix(e[sd])?|resolv(e|es|ed))[[:space:]]+#[0-9]+' \
                     | grep -oE '[0-9]+' | sort -u)

            # FALL BACK TO THE BRANCH NAME. The keyword is prose an agent has to
            # remember to write, and on 2026-10-09 it did not: PR #312 was titled
            # "Lift the learn sticky CTA above the mobile tab bar (#304)" — a
            # MENTION, not a closing keyword — so this workflow ran, concluded
            # success, and closed nothing. Run 37891007703: "PR #312 claims no
            # issue". The first close-on-evidence run in this repo's history to
            # reach its own close step, and it had nothing to act on.
            #
            # `issue/<n>-<slug>` is not a convention anyone has to remember: it is
            # what /agent-cycle step 4 creates, and what `agent-merge` already
            # parses to comment on the issue. A branch name is structural, a
            # keyword in a body is a promise — and this repo's rule is that a glob
            # beats a promise.
            #
            # Deliberately a FALLBACK, not a replacement: an explicit `closes #N`
            # may name an issue the branch name does not, and it stays
            # authoritative where present.
            if [ -z "$issues" ]; then
              branch=$(gh pr view "$pr" --repo "$GH_REPO" --json headRefName --jq .headRefName)
              # grep -oE, not `sed 's|...\([0-9]\+\)...|'`: `\+` is a GNU
              # extension, so that pattern works on ubuntu-latest and silently
              # matches NOTHING on a BSD sed. A branch-name parser that cannot be
              # tested on the machine the author is using is a parser nobody
              # tests. This form behaves identically everywhere.
              issues=$(printf '%s' "$branch" | grep -oE '^issue/[0-9]+' | grep -oE '[0-9]+' || true)
              # if/then, NOT `[ -n "$x" ] && echo`. Under `bash -e` that compound
              # returns 1 when $x is empty and KILLS THE STEP — the trap this repo
              # has now hit four times (pr-gates' gate sweep, its skipped-report
              # line, agent-merge's PR lookup, and this line as first written).
              if [ -n "$issues" ]; then
                echo "PR #$pr claims no issue in its body; taking #$issues from branch '$branch'"
              fi
            fi
            [ -n "$issues" ] || { echo "PR #$pr claims no issue, and its branch name carries none"; continue; }

            for n in $issues; do
              state=$(gh issue view "$n" --repo "$GH_REPO" --json state --jq .state 2>/dev/null || echo MISSING)
              [ "$state" = "OPEN" ] || { echo "#$n is $state — skipping"; continue; }
              gh issue close "$n" --repo "$GH_REPO" --reason completed --comment \
          "Closed on production evidence.

          - PR #$pr merged to \`main\`
          - \`verify-production\` concluded **success** for \`$SHA\` ([run](${{ github.event.workflow_run.html_url }}))
          - \`/health\` reports \`build_sha\` = \`$SHA\`, so **this commit is the revision serving**

          That is CLAUDE.md's two-stage close: the fix landed, the deploy was verified, and the commit was confirmed live before closing. Reopen if production disagrees — a green run proves the invariants it asserts, not that nothing else broke."
              echo "closed #$n"
            done
          done
