# Turns a green gate into a merge, unattended. This is where "full autonomy"
# stops being a plan.
#
# WHAT DECIDES, AND WHAT DOES NOT
# -------------------------------
# No agent decides what lands. CLAUDE.md's rule survives intact — subagents
# never push to `main`, they push a branch and open a PR — and the authority to
# merge lives here, in a workflow, gated on evidence rather than on anyone's
# judgment that the work is finished.
#
# Four conditions, all required:
#   0. The PR was opened by this system or by the repo owner (AGENT_AUTHORS).
#      Authorship, never a branch name -- see that variable for why.
#   1. `pr-gates` green on the head SHA. Not "no failures" — actually green.
#   2. A QA comment on the PR whose verdict line says PASS. qa.md is explicit
#      that "PASS is a report, not an action", so the report is read here and
#      the action is taken here, by different things.
#   3. The diff is inside the size limit below and touches none of the
#      trust-boundary paths (#354), which a human merges.
#
# WHY A SIZE LIMIT ON AN AUTONOMOUS LOOP
# --------------------------------------
# Green CI means very different things for different changes. CLAUDE.md:
# "test coverage is narrow — a behaviour suite covers request paths only, and
# most of the app has none." For #262 (delete a dead file) green is a real
# signal. For #114 (3D WebGL chart) it proves close to nothing, and `main`
# auto-deploys with no staging.
#
# So a large diff is not blocked — it is left open and labelled. This is a
# machine rule, not a human in the loop. Raise MAX_LINES or delete the step to
# remove it.
name: Agent merge

# BOTH signals, because either can be the last one to arrive.
#
# Run 37762286251 fired when pr-gates completed, read `labels: none`, and left
# #299 open. QA applied qa-pass moments later and nothing re-triggered the
# check — a PR that met every condition, sat there.
#
# Label-only would mirror the same race rather than remove it: QA does not wait
# for the gates, so a fast QA on a slow gate run labels first, this fires, finds
# the gates still running, and stalls identically.
#
# So: fire on either, re-check everything each time, merge when all of it is
# true. Order stops mattering.
on:
  workflow_run:
    workflows: ["PR gates"]
    types: [completed]
  pull_request_target:
    types: [labeled]
  # THE SWEEP (#357). Both triggers above are EDGES, and this job had no way to
  # re-ask the question after one was spent. Whenever the last green check
  # landed after the last edge, a PR stayed green, qa-pass and MERGEABLE
  # forever. It happened four times:
  #
  #   #303  `ready_for_review` was not in pr-gates' `pull_request` types, so
  #         the readied PR carried no check at all
  #   #322  a GITHUB_TOKEN-authored PR emits no workflow_run
  #   #352  the run that went green was `workflow_dispatch`, which the `if:`
  #         below deliberately excludes (a dispatched run checks out the
  #         BRANCH, not refs/pull/N/merge, so it does not prove the merge)
  #   #356  `verify-build` is a different workflow, and this one listens only
  #         to "PR gates"
  #
  # Each was fixed by adding or correcting an edge, and a fifth edge was always
  # going to be missed -- so the answer is to stop relying on edges. #356 shows
  # why the ordering is not even unlikely: pr-gates SKIPS its suite on a
  # docs-only change and finishes in 9s (deliberately, so this job still gets
  # its trigger), while verify-build has no such skip and takes ~70s. Measured
  # 2026-10-15: pr-gates 9s vs verify-build 68s on #356; 8m34s vs 75s on the
  # code PR before it. The "pr-gates is the slowest check" assumption holds for
  # code and inverts for exactly the PRs the skip was written for.
  #
  # The sweep adds NO new authority. It only supplies a PR number; every
  # condition -- author, gates green, qa-pass, size, trust boundary -- is
  # re-read from the API by the same steps, in the same order. So the worst a
  # sweep can do is merge something that already satisfies every condition.
  schedule:
    - cron: "*/30 * * * *"
  # For draining the queue by hand after a fix, without waiting for the cron.
  workflow_dispatch:

# Serialised repo-wide, NOT keyed on the PR: the workflow_run leg does not know
# which PR it is about until the first step has run, so a per-PR group cannot be
# expressed here. `cancel-in-progress: false` because cancelling a merge
# half-way is the one outcome worth avoiding; GitHub keeps a single pending run
# per group, so a sweep firing during an edge-triggered run queues behind it and
# a redundant third is dropped -- which is correct, since the next sweep asks
# again in 30 minutes.
concurrency:
  group: agent-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  # Needed to dispatch verify-production after the merge. See the step at the
  # end of this job for why that dispatch is not optional.
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    # A FORK PR NEVER REACHES THIS JOB (#358). The repo is public and this job
    # holds contents+actions write. Before this guard, a fork PR satisfied the
    # workflow_run clause with no maintainer action at all: pr-gates runs on
    # `pull_request` (fork PRs included), it completes, workflow_run fires in
    # the BASE repo with the base repo's definition and the write token, and
    # `workflow_run.event == 'pull_request'` was true.
    #
    # The loop only ever merges work opened in this repository, and `qa-pass`
    # is written only by scripts/qa_verdict.sh, which a fork PR cannot cause to
    # run. So a fork head is not a case to handle carefully -- it is a case to
    # refuse, and it is refused here rather than relying on the author filter
    # below (a fork PR can be authored by anyone, including the owner).
    #
    # Both legs are guarded: `pull_request_target` carries
    # `event.pull_request.head.repo`, `workflow_run` carries
    # `event.workflow_run.head_repository`, and neither is readable from the
    # other, so one clause cannot cover both.
    if: >-
      (
        github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository
      ) || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Every gh call needs --repo: this job has no checkout step (it needs no
      # code), so gh cannot infer the repository from a git remote and fails
      # with "not a git repository".
      GH_REPO: ${{ github.repository }}
      # WHO MAY HAVE THEIR WORK MERGED UNATTENDED -- the one source of truth,
      # read by the sweep filter and by the `own` step below.
      #
      # This used to be a BRANCH-NAME test (`case` on `issue/*`), and the name
      # turned out to carry none of the meaning it was asked to carry. Cycles
      # correctly moved to `partial/<n>-<slug>` whenever acceptance criteria
      # remained that the loop could not do (agent-cycle.md Step 4), and every
      # one of those PRs became unmergeable by this job -- not on a safety
      # judgment, but on its spelling. #480, #482 and #487 each carried
      # `qa-pass` from the cycle, went green on the gates, and were taken out
      # of draft by the loop itself; all three then waited for a human, and
      # between 2026-10-21 and 2026-10-25 EVERY code PR did. The last branch
      # this job merged on its own was #469 on 2026-10-21.
      #
      # Authorship is the property that was actually meant: work this system
      # produced, or the repo owner's own. A fork PR cannot reach this job at
      # all (the job `if:` and the head-repo filters below), so the author set
      # is the remaining question, and a name prefix never answered it.
      #
      # Owner comes from the context, not a literal, so a rename or a fork of
      # the whole repo does not silently widen or empty the set.
      AGENT_AUTHORS: claude[bot],${{ github.repository_owner }}
      # NOTHING FROM THE PULL REQUEST IS INTERPOLATED INTO A `run:` BLOCK (#358).
      # `${{ }}` is textual substitution performed BEFORE bash parses the
      # script, so an interpolated value is not a shell string -- it is shell
      # source. This job runs under pull_request_target/workflow_run with
      # contents+actions write, so a value the PR author chooses must never
      # reach it that way. Every such value arrives as an environment variable,
      # which bash never re-parses, and is expanded quoted.
      #
      # verify_workflows.py enforces this for every workflow carrying a
      # privileged trigger; see `no `${{ }}` in run:` there.
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      # Raised far above any plausible diff on 2026-10-08. The user's position:
      # "we should not restrict git push and merge for this autonomous system to
      # be successful. If QA is passed, push and merge."
      #
      # Left in place rather than deleted so the mechanism survives: lower it to
      # 400 and large diffs are labelled and held again, one edit, no new code.
      MAX_LINES: 1000000
      # THE TRUST BOUNDARY — the one place it is listed (#354). A PR touching
      # any of these is never auto-merged; see the "Trust boundary" step.
      # One entry per line. An entry ending in `/` matches everything beneath
      # it at any depth; any other entry matches that exact path and nothing
      # else (so `events.py` does not catch `events_helper.py`).
      #
      #   prompts/    the system prompts. routes/deps.py PROMPTS_DIR loads them and
      #               they become the system prompt for every request.
      #   knowledge/  NOT read at runtime (measured 2026-10-15: no Python opens
      #               one). It is what agents treat as the authority, so a
      #               poisoned rule gets transcribed into code as a *sourced*
      #               change by the next agent to touch that area.
      #   workflows/  the gates themselves, and this file with them.
      #   events.py   what is recorded about a user.
      #   notify.py / email_sender.py   what leaves to Telegram / Brevo.
      #   storage.py  where it is kept.
      TRUST_BOUNDARY: |
        src/astro_ai/prompts/
        src/astro_ai/knowledge/
        .github/workflows/
        src/astro_ai/events.py
        src/astro_ai/notify.py
        src/astro_ai/email_sender.py
        src/astro_ai/storage.py
    steps:
      - name: Find the pull request
        id: pr
        run: |
          # if/then rather than `[ test ] && action`. The REASON recorded here
          # before was wrong, and the correction matters because it changes
          # where the danger is. Measured 2026-10-09:
          #
          #   bash -e -c '[ -z "$n" ] && exit 0; echo after'   with n set
          #     -> prints "after", exits 0.   NOT a set -e trap.
          #
          # bash's -e explicitly exempts a failing command inside a && list
          # other than the final one, so this shape never "exits on the success
          # path". What actually bites is narrower and sharper: a trailing
          # `[ test ] && action` becomes THE SCRIPT'S EXIT STATUS, so a false
          # test makes a step that did all its work report failure:
          #
          #   printf 'echo work\n[ -n "$x" ] && echo skip\n' > t; bash -e t
          #     -> prints "work", exits 1.   The step goes red having succeeded.
          #
          # So the rule is not "never use && in a run block". It is: never let
          # `[ test ] && action` be the last line, and prefer if/then so the
          # question never arises. pr-gates' skipped-report line was exactly
          # that shape and would have failed a completely passing run.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # THE SWEEP picks a CANDIDATE, it does not decide anything (#357).
            # The filters here are only what makes a candidate worth spending
            # the remaining steps on:
            #
            #   state=open, not draft      there is something left to merge
            #   head.repo == this repo     a fork head never reaches a write
            #                              token, the same rule as the job `if:`
            #   user.login in AGENT_AUTHORS  work this system produced or the
            #                              owner's own, re-checked by the
            #                              `own` step anyway. NOT a branch
            #                              name -- see AGENT_AUTHORS above.
            #   qa-pass present            otherwise the `qa` step would stop,
            #                              and the sweep would spend every run
            #                              on an ineligible PR and never reach
            #                              an eligible one
            #   qa-fail / needs-human-review / too-large-to-automerge absent
            #                              all three mean "a human decides";
            #                              holding them here is what keeps the
            #                              sweep from re-labelling the same PR
            #                              every 30 minutes forever
            #
            # Every one of those is re-read and re-decided downstream. Lowest
            # number first, one per run: a second eligible PR is taken by the
            # next sweep, which is the same "one issue per run" rule the rest
            # of the loop follows.
            # No `--paginate`: with `--jq`, gh applies the filter PER PAGE, so
            # `sort | first` would print one number per page and `n` would hold
            # several. per_page=100 is well past any plausible open-PR count for
            # this loop; if it is ever exceeded the sweep still works, it just
            # considers the first 100.
            candidates=$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '
                  [ .[]
                    | select(.draft == false)
                    | select(.head.repo.full_name == "'"$GH_REPO"'")
                    | select(.user.login as $a
                             | ("'"$AGENT_AUTHORS"'" | split(",")) | index($a))
                    | select([.labels[].name] | index("qa-pass"))
                    | select([.labels[].name]
                             | (index("qa-fail") // index("needs-human-review")
                                // index("too-large-to-automerge")) | not)
                    | .number ]
                  | sort | join(" ")')

            # MERGEABILITY IS CHECKED HERE, AND THE LIST IS WALKED (#374).
            #
            # The filter above cannot ask: the `pulls` LIST endpoint does not
            # return `mergeable`, only `pulls/{n}` does. So the shortlist is
            # built first and each candidate is asked in turn.
            #
            # Walking matters more than the check. The first version took
            # `sort | first` and stopped, so one conflicting PR low in the
            # range was selected on EVERY run, forever, and nothing behind it
            # was ever reached. An edge-triggered run does not have this
            # problem -- it fires for one specific PR, so a conflict fails once
            # and that is the end of it. Adding a cron turned a one-off failure
            # into a permanent block. Observed on PR #360, 2026-10-15: the
            # sweep selected it while CONFLICTING and ran the whole chain,
            # stopping only because the trust boundary held it for storage.py.
            # Without that hold it would have reached `gh pr merge`, which
            # fails on a conflict, turning this workflow red every 30 minutes.
            #
            # UNKNOWN IS NOT MERGEABLE. GitHub computes mergeability lazily and
            # answers UNKNOWN while it does. Treating that as eligible would
            # reintroduce the failure intermittently, which is worse than
            # reliably -- so it is skipped and the next sweep asks again.
            n=""
            for cand in $candidates; do
              m=$(gh pr view "$cand" --repo "$GH_REPO" --json mergeable --jq .mergeable 2>/dev/null || echo "")
              if [ "$m" = "MERGEABLE" ]; then
                n="$cand"
                echo "::notice::sweep picked PR #$n — every condition is re-checked below"
                break
              fi
              # Said out loud: a sweep that found candidates and silently took
              # none reads identically to "nothing to do", and #357 exists
              # because silence hid four stranded PRs.
              echo "  skipping #$cand — mergeable=${m:-unreadable}"
            done
          elif [ "$EVENT_NAME" = "pull_request_target" ]; then
            n="$EVENT_PR_NUMBER"
          else
            # `github.event.workflow_run.head_sha`, NOT `steps.pr.outputs.sha`.
            # This step's own id IS `pr`, so that expression read its own
            # output before it existed and always rendered EMPTY, giving
            #     gh: No commit found for SHA:  (HTTP 422)
            # and exit 1. The whole `workflow_run` leg of this workflow failed
            # 100% of the time — four runs on 2026-10-08 (37823306954,
            # 37824154542, 37878016497, 37878770889) and every one before them.
            #
            # Only the `pull_request_target` branch above ever worked, so the
            # dual-trigger design documented at the top of this file has been
            # running on one leg since it was written: a PR whose gates finish
            # AFTER its qa-pass label was never re-checked by anything.
            #
            # The later steps may still use steps.pr.outputs.sha — by then this
            # step has completed and the output exists. Only a self-reference
            # inside the defining step is empty.
            n=$(gh api "repos/$GH_REPO/commits/$RUN_HEAD_SHA/pulls" \
                  --jq '.[0].number // empty')
          fi
          if [ -z "$n" ]; then
            echo "nothing to merge (no PR for this SHA, or no sweep candidate)"
            exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
          gh pr view "$n" --repo "$GH_REPO" \
            --json headRefName,headRefOid,additions,deletions,files,isDraft,state,author > /tmp/pr.json
          # An edge and a sweep can both reach the same PR, and the sweep can
          # fire while an earlier run is merging. `gh pr merge` on a merged PR
          # fails, after every condition has already been satisfied, so the
          # cheapest place to notice is here.
          state=$(jq -r .state /tmp/pr.json)
          if [ "$state" != "OPEN" ]; then
            echo "::notice::PR #$n is $state — already handled, nothing to do"
            exit 0
          fi
          echo "branch=$(jq -r .headRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          # `gh pr view` renders a bot as `app/claude`; the REST API and the
          # sweep filter above both say `claude[bot]`. Normalise to the API
          # form so one AGENT_AUTHORS list covers both paths.
          author=$(jq -r '.author.login' /tmp/pr.json)
          case "$author" in
            app/*) author="${author#app/}[bot]" ;;
          esac
          echo "author=$author" >> "$GITHUB_OUTPUT"
          # Resolve the head SHA from the PR, not from the event. A `labeled`
          # event has no workflow_run payload, so every message built from
          # `workflow_run.head_sha` would render an empty backtick pair.
          echo "sha=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      # Only work this system produced, or the owner's own. See AGENT_AUTHORS
      # at the top of this job for why this is authorship and not a branch
      # name, and for the four days of PRs the name test stranded.
      #
      # THE OWNER IS IN THE SET DELIBERATELY, and it is the one widening here
      # that is not merely a bug fix: before this, `partial/*` and a human's
      # branch were both refused, so the owner's own branches were never
      # auto-merged. They are now. Everything downstream still has to hold --
      # gates green on the head SHA, `qa-pass` on record, no `qa-fail`, inside
      # the size limit, no trust-boundary path -- so this grants no exemption;
      # it only stops the job from ignoring the PR. A branch the owner wants
      # held regardless carries `needs-human-review`, which the sweep filter
      # and the labels step both refuse.
      - name: Is this ours to merge?
        id: own
        if: steps.pr.outputs.number
        env:
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          # Exact, comma-delimited membership. A substring test would let
          # `claude[bot]-x` or `notmahAnuj` in, and `grep -w` splits on `[`
          # so it would not match `claude[bot]` at all.
          case ",$AGENT_AUTHORS," in
            *",$PR_AUTHOR,"*)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$PR_BRANCH authored by $PR_AUTHOR — ours to merge" ;;
            *)
              echo "::notice::$PR_BRANCH authored by $PR_AUTHOR, not in AGENT_AUTHORS — leaving it alone" ;;
          esac

      # Query the API, do not read the event. A `labeled` event carries no
      # workflow_run payload at all, so the old check had nothing to read and
      # would have failed closed forever on that trigger.
      - name: Gates green?
        id: gates
        if: steps.own.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
                  --json headRefOid --jq .headRefOid)
          echo "head: $sha"
          # Exclude THIS run's own check. On a pull_request_target trigger GitHub
          # creates a check run for the `merge` job, in_progress for exactly as
          # long as this step is reading the list — so "all checks green" could
          # never be true and the workflow waited on itself. Run 37768968298:
          # `merge=in_progress:pending` beside two green ones.
          #
          # Filtered by run id, not job name, so a rename cannot silently
          # reintroduce the deadlock.
          # ONE CHECK RUN PER NAME, the LATEST. A name can appear more than once
          # on a SHA, and an older entry never disappears.
          #
          # `pr-gates` sets `cancel-in-progress: true` — deliberately, to save
          # Actions minutes on a branch that gets a second push — and a cancelled
          # run leaves a `cancelled` check run attached to the commit forever.
          # PR #319 had `qa-pass`, a green `gates`, a green `build-gates`, and:
          #
          #   gates=completed:success
          #   gates=completed:cancelled     <- the superseded run, 11 min older
          #   -> not all checks are green yet
          #
          # So a fully QA'd product fix could NEVER merge. Run 37968579453 fired
          # correctly the moment the gates went green and declined on a corpse.
          # The rule below is right; it was reading a state it did not anticipate.
          #
          # Sorted by `started_at` and reduced to the last per name, which is what
          # GitHub's own pull-request UI shows. That keeps the rule intact — a
          # pending or failed LATEST check is still not a pass — while a
          # superseded attempt stops voting. `.id` as a tiebreak because two runs
          # can share a start second.
          runs=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" --paginate \
                   --jq "[.check_runs[]
                          | select((.details_url // \"\") | contains(\"/runs/$GITHUB_RUN_ID/\") | not)]
                         | sort_by(.started_at, .id)
                         | reduce .[] as \$c ({}; . + {(\$c.name): \$c})
                         | to_entries[]
                         | \"\(.value.name)=\(.value.status):\(.value.conclusion // \"pending\")\"")
          echo "$runs" | sed 's/^/  /'
          # Every check must have finished, and none may be anything but success.
          # `pending` counts as not-green: a check still running is not a pass,
          # which is the same rule pr-gates applies to its own exit-2 gates.
          # Test for NON-EMPTY OUTPUT, not `grep -q`'s exit status. Measured
          # 2026-10-10: on BSD grep (macOS) `grep -qv ':success$'` exits 1 on a
          # list that plainly contains a non-success line, while `grep -v` on the
          # same input prints it. GNU grep on ubuntu-latest gets it right, so the
          # rule has always worked in CI — run 37968579453 blocked correctly on
          # `gates=completed:cancelled`.
          #
          # Changed anyway, because a rule that cannot be exercised on the
          # maintainer's own machine is a rule nobody tests. That is the same
          # trap as the GNU-only `\+` in a sed pattern, found in this repo twice
          # on the same day. This form behaves identically on both.
          notgreen=$(printf '%s\n' "$runs" | grep -v ":success$" || true)
          if [ -n "$notgreen" ]; then
            echo "::notice::not all checks are green yet — leaving the PR open"
            printf '  blocking: %s\n' "$notgreen"
            exit 0
          fi
          if [ -z "$runs" ]; then
            echo "::notice::no checks reported for $sha — not merging"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # qa.md: "PASS is a report, not an action." Read the report here.
      #
      # A LABEL, not a comment grep. The first agent PR (#292) had a QA verdict
      # and no PR comment carrying it, so a text match would have left it open
      # forever with green checks and nothing saying why. A label is binary,
      # survives any formatting, shows in `gh pr list --label qa-pass`, and —
      # applied to the issue as well — makes the whole loop auditable in one
      # query instead of by reading comment bodies.
      #
      # qa-fail is checked too, and wins: a PR that QA failed must not merge
      # because something later added qa-pass alongside it.
      #
      # THAT IS NOT A PERMANENT BLOCK, and it used to be. A re-QA that passes
      # now CLEARS `qa-fail` as part of recording its verdict -- one atomic
      # transition in scripts/qa_verdict.sh, which is the only thing that
      # writes these labels. So the two states cannot coexist to begin with,
      # and this check refuses a stale failure rather than a fixed one. Before
      # that script, agent-cycle.md told the cycle a later pass "cannot
      # override a failure nobody re-verified" -- true, but it also meant a
      # failure somebody DID re-verify stayed fatal, and #530 was heading
      # there.
      - name: QA verdict
        id: qa
        if: steps.gates.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
                     --json labels --jq '[.labels[].name] | join(",")')
          echo "labels: ${labels:-none}"
          case ",$labels," in
            *,qa-fail,*)
              echo "::notice::qa-fail is set — not merging, whatever else is present"
              exit 0 ;;
            *,qa-pass,*)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::no qa-pass label yet — leaving the PR open" ;;
          esac

      - name: Size and path limits
        id: size
        if: steps.qa.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          changed=$(( $(jq -r .additions /tmp/pr.json) + $(jq -r .deletions /tmp/pr.json) ))
          echo "diff is $changed lines (limit $MAX_LINES)"
          if [ "$changed" -gt "$MAX_LINES" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "too-large-to-automerge"
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body \
              "Gates green and QA passed, but this diff is ${changed} lines against a ${MAX_LINES}-line limit for unattended merge. Most of this app has no test coverage and \`main\` deploys on merge with no staging, so green proves less here than the line count suggests. Leaving it open."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # THE TRUST BOUNDARY (#354). The repo is public and this job merges
      # unattended, so "gates green + qa-pass" cannot be the whole test for a
      # change to the things that decide what the product says, what agents
      # believe, what the gates are, or where user data goes. Those are held
      # for a human, exactly as an over-limit diff is.
      #
      # THIS JOB HAS NO CHECKOUT AND MUST NOT GAIN ONE. It runs under
      # pull_request_target with a write token, so nothing from the PR may
      # execute here. The file list therefore comes from the API, and the
      # paths are only ever compared as strings: never eval'd, never
      # interpolated into the script (they arrive via a file), and quoted at
      # every use. A hostile file name can at worst be a false positive.
      #
      # THE FILES API, NOT `gh pr view --json files`: the latter stops at 100
      # files, so a PR could bury a protected path at position 101. The
      # paginated endpoint reaches 3,000; at that cap the list may be
      # truncated, so the step fails CLOSED and holds the PR.
      #
      # `previous_filename` is included: moving `prompts/natal.txt` out of the
      # protected tree is a change to it, and a rename lists only the new name
      # under `filename`.
      #
      # Fails closed on error too: if the API call fails the step fails, `ok`
      # is never set, and nothing downstream runs.
      - name: Trust boundary
        id: boundary
        if: steps.size.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Prints the matching entry and returns 0 if $1 is protected.
          # Kept a pure function of ($1, $TRUST_BOUNDARY) so a test can lift it
          # out of this file and drive it with a table of paths.
          is_protected() {
            local entry
            while IFS= read -r entry; do
              if [ -z "$entry" ]; then continue; fi
              case "$entry" in
                */)
                  case "$1" in
                    "$entry"*) printf '%s\n' "$entry"; return 0 ;;
                  esac ;;
                *)
                  if [ "$1" = "$entry" ]; then printf '%s\n' "$entry"; return 0; fi ;;
              esac
            done <<< "$TRUST_BOUNDARY"
            return 1
          }

          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/pr-files.txt
          total=$(wc -l < /tmp/pr-files.txt)
          echo "PR files and rename sources checked: $total"

          : > /tmp/pr-protected.txt
          while IFS= read -r f; do
            if hit=$(is_protected "$f"); then
              printf '%s  (%s)\n' "$f" "$hit" >> /tmp/pr-protected.txt
            fi
          done < /tmp/pr-files.txt
          # Sorted and de-duplicated: a rename lists both names and a path can
          # appear twice.
          sort -u /tmp/pr-protected.txt -o /tmp/pr-protected.txt

          capped=false
          if [ "$total" -ge 3000 ]; then capped=true; fi

          if [ ! -s /tmp/pr-protected.txt ] && [ "$capped" = "false" ]; then
            echo "no protected path touched"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::trust boundary touched — holding PR #$PR_NUMBER for a human"
          sed 's/^/  /' /tmp/pr-protected.txt

          # Idempotent: this job fires on every label and every gate run, so
          # comment once. The label is the record that it already did.
          labels=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,needs-human-review,*)
              echo "already labelled needs-human-review — not commenting again"
              exit 0 ;;
          esac

          {
            echo "Gates are green and QA passed, but this PR changes the trust boundary, so \`agent-merge\` will not merge it unattended. It stays open for a human."
            echo
            if [ -s /tmp/pr-protected.txt ]; then
              echo "Matched (file, then the protected entry it fell under):"
              echo
              echo '```'
              head -n 30 /tmp/pr-protected.txt
              echo '```'
              echo
            fi
            if [ "$capped" = "true" ]; then
              echo "The files API returned $total entries, its ceiling, so the list may be truncated and the PR is held."
              echo
            fi
            echo "Why: these paths decide what the product tells users (\`prompts/\`), what agents treat as authority (\`knowledge/\`), what the gates are (\`.github/workflows/\`), and what is recorded about, sent about, or stored about a user (\`events.py\`, \`notify.py\`, \`email_sender.py\`, \`storage.py\`). See #354."
            echo
            echo "To land it: review, then merge by hand. Removing the label does not release it; the next run puts it back."
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file /tmp/pr-comment.md
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "needs-human-review"

      # A DRAFT CANNOT MERGE, and this job used to fetch `isDraft` and never
      # read it. So a readied-by-nobody PR reached `gh pr merge` and failed
      # with "Pull request is in draft state" — after every condition that
      # matters had been satisfied.
      #
      # /agent-cycle now runs `gh pr ready` when QA passes, which is the
      # primary path and the right place for it. This is the safety net for a
      # cycle that died between QA and that command: PR #303 sat from
      # 2026-10-08 18:09 carrying qa-pass, un-draftable by anything in the
      # system.
      #
      # Un-drafting here is safe precisely BECAUSE it is the last step before
      # merging: gates green, qa-pass on record, no qa-fail, diff inside the
      # limit, no trust-boundary path touched. Nothing is being waved through — the draft flag is the only
      # thing left, and a draft carrying all of that is a bookkeeping error,
      # not a reservation. It is logged either way, because a net that acts
      # silently is indistinguishable from one that was never needed.
      - name: Take it out of draft if the cycle never did
        if: steps.boundary.outputs.ok == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$(jq -r .isDraft /tmp/pr.json)" = "true" ]; then
            echo "::warning::PR #$PR_NUMBER is still a draft although gates are green and qa-pass is set — /agent-cycle did not run 'gh pr ready'. Readying it here so the merge can proceed."
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
          else
            echo "not a draft"
          fi

      - name: Merge
        if: steps.boundary.outputs.ok == 'true'
        env:
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --delete-branch

          # Link both ways so a reviewer can follow the thread from either end.
          #
          # ANY namespace, not just `issue/`: now that authorship decides what
          # merges, a `partial/` slice lands through this step too, and an
          # issue whose slice shipped with no comment on it is the audit gap
          # Phase 7 exists to close. The WORDING differs because the outcome
          # does -- see the second branch.
          issue=$(printf '%s' "$PR_BRANCH" | grep -oE '^[a-z]+/[0-9]+' | grep -oE '[0-9]+' || true)
          case "$PR_BRANCH" in
            issue/*) full=1 ;;
            *)       full=0 ;;
          esac
          if [ -n "$issue" ] && [ "$full" = 1 ]; then
            gh issue comment "$issue" --repo "$GH_REPO" --body \
              "Merged by \`agent-merge\`: PR #$PR_NUMBER, \`pr-gates\` green on \`$PR_SHA\`, \`qa-pass\` on record.

          **Not closing this.** \`main\` deploys on merge, so it closes once \`verify-production.yml\` has asserted against the live site — CLAUDE.md's two-stage close. With BUILD_SHA set, that run can now prove *which* commit is serving."
          elif [ -n "$issue" ]; then
            # A PARTIAL slice. `close-on-evidence` reads `^issue/<n>` and will
            # not see this branch, which is correct and is the point -- but the
            # issue still owes the reader the fact that part of it shipped.
            gh issue comment "$issue" --repo "$GH_REPO" --body \
              "A **partial** slice merged by \`agent-merge\`: PR #$PR_NUMBER, \`pr-gates\` green on \`$PR_SHA\`, \`qa-pass\` on record.

          **This issue stays open, and nothing will close it automatically** — the branch is not \`issue/$issue-…\`, so \`close-on-evidence\` does not read it as a fix. What remains is in the PR body under what was deliberately not done."
          fi

          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body \
            "Merged automatically: \`pr-gates\` green on \`$PR_SHA\`, \`qa-pass\` on record, diff within the unattended limit.

          **Not closing the issue.** \`main\` deploys on merge, so the issue closes only once \`verify-production.yml\` has asserted against the live site — CLAUDE.md's two-stage close."

      # WITHOUT THIS, THE LOOP HAS NO LAST MILE. Measured 2026-10-08.
      #
      # GitHub does not start a workflow run for an event created with the
      # default GITHUB_TOKEN — the documented recursion guard, whose only
      # exceptions are `workflow_dispatch` and `repository_dispatch`. This job
      # merges with `GH_TOKEN: ${{ github.token }}`, so the push it creates
      # triggers NOTHING:
      #
      #   PR #299  merged by app/github-actions  ->  0 push-triggered runs
      #   PR #292  merged by mahAnuj             ->  2
      #   PR #296  merged by mahAnuj             ->  2
      #   PR #297  merged by mahAnuj             ->  2
      #
      # Two consequences, and the second is the serious one:
      #
      #   1. `close-on-evidence.yml` gates on a `verify-production` run whose
      #      event is `push`. For an agent-merged commit that run never exists,
      #      so no autonomously-merged PR can ever close its issue. #270 sat
      #      open with its fix live and `qa-pass` on record.
      #   2. The commit is NEVER VERIFIED AGAINST PRODUCTION. Cloud Build is a
      #      GCP-side webhook and is not subject to the Actions guard, so the
      #      merge DOES deploy — on a site with no staging, where production is
      #      the first place code runs. The verification that was supposed to
      #      end the loop simply did not happen.
      #
      # `workflow_dispatch` is the documented exception, so this dispatch does
      # start a run even from GITHUB_TOKEN. It is the whole fix.
      #
      # continue-on-error: the merge already succeeded and must not be reported
      # as failed because the follow-up dispatch did not land. A missing
      # verification is visible as an absent run on the commit; a red
      # agent-merge on a PR that merged cleanly is a misleading signal.
      - name: Verify production after the merge
        if: steps.boundary.outputs.ok == 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # --ref main, not a SHA: workflow_dispatch takes a branch or tag. The
          # run therefore verifies main's TIP. If another merge lands in the
          # seconds between, that newer commit is verified instead and this
          # PR's issue stays open until the next verification — incomplete, not
          # wrong, and it self-corrects. close-on-evidence requires
          # /health build_sha == the run's head_sha precisely so a superseded
          # commit cannot be reported as live.
          if gh workflow run verify-production.yml --repo "$GH_REPO" --ref main; then
            echo "::notice::dispatched verify-production for main after merging #$PR_NUMBER"
          else
            echo "::warning::could not dispatch verify-production — #$PR_NUMBER is merged and deploying, but NOTHING will assert against production and its issue will not auto-close. Dispatch it by hand: gh workflow run verify-production.yml --ref main"
          fi

      # A red gate is information the issue needs, not just a failed run nobody reads.
      - name: Report a failure onto the issue
        # `== failure` only. `cancelled` is not a red gate — pr-gates sets
        # cancel-in-progress, so every push inside the run window cancels the
        # previous one; reporting that as a failure writes "pr-gates failed" onto
        # the issue while the real run is still going and about to pass. And a
        # label event carries no conclusion at all.
        if: >-
          steps.own.outputs.ok == 'true'
          && github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'failure'
        env:
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          # Any namespace: a red gate on a `partial/` slice is as worth
          # reporting on the issue as a red gate on a full fix.
          issue=$(printf '%s' "$PR_BRANCH" | grep -oE '^[a-z]+/[0-9]+' | grep -oE '[0-9]+' || true)
          [ -z "$issue" ] && exit 0
          gh issue comment "$issue" --repo "$GH_REPO" --body \
            "\`pr-gates\` failed on PR #$PR_NUMBER (\`$PR_SHA\`), conclusion: $RUN_CONCLUSION.

          Run: $RUN_URL

          The PR stays open. Remember a gate exiting 2 is *skipped*, not passed — if that is what failed, the check did not run at all."
