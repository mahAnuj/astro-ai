# Turns a green gate into a merge, unattended. This is where "full autonomy"
# stops being a plan.
#
# WHAT DECIDES, AND WHAT DOES NOT
# -------------------------------
# No agent decides what lands. CLAUDE.md's rule survives intact — subagents
# never push to `main`, they push a branch and open a PR — and the authority to
# merge lives here, in a workflow, gated on evidence rather than on anyone's
# judgment that the work is finished.
#
# Three conditions, all required:
#   1. `pr-gates` green on the head SHA. Not "no failures" — actually green.
#   2. A QA comment on the PR whose verdict line says PASS. qa.md is explicit
#      that "PASS is a report, not an action", so the report is read here and
#      the action is taken here, by different things.
#   3. The diff is inside the size and path limits below.
#
# WHY A SIZE LIMIT ON AN AUTONOMOUS LOOP
# --------------------------------------
# Green CI means very different things for different changes. CLAUDE.md:
# "test coverage is narrow — a behaviour suite covers request paths only, and
# most of the app has none." For #262 (delete a dead file) green is a real
# signal. For #114 (3D WebGL chart) it proves close to nothing, and `main`
# auto-deploys with no staging.
#
# So a large diff is not blocked — it is left open and labelled. This is a
# machine rule, not a human in the loop. Raise MAX_LINES or delete the step to
# remove it.
name: Agent merge

# BOTH signals, because either can be the last one to arrive.
#
# Run 37762286251 fired when pr-gates completed, read `labels: none`, and left
# #299 open. QA applied qa-pass moments later and nothing re-triggered the
# check — a PR that met every condition, sat there.
#
# Label-only would mirror the same race rather than remove it: QA does not wait
# for the gates, so a fast QA on a slow gate run labels first, this fires, finds
# the gates still running, and stalls identically.
#
# So: fire on either, re-check everything each time, merge when all of it is
# true. Order stops mattering.
on:
  workflow_run:
    workflows: ["PR gates"]
    types: [completed]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  # Needed to dispatch verify-production after the merge. See the step at the
  # end of this job for why that dispatch is not optional.
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.workflow_run.event == 'pull_request'
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Every gh call needs --repo: this job has no checkout step (it needs no
      # code), so gh cannot infer the repository from a git remote and fails
      # with "not a git repository".
      GH_REPO: ${{ github.repository }}
      # Raised far above any plausible diff on 2026-10-08. The user's position:
      # "we should not restrict git push and merge for this autonomous system to
      # be successful. If QA is passed, push and merge."
      #
      # Left in place rather than deleted so the mechanism survives: lower it to
      # 400 and large diffs are labelled and held again, one edit, no new code.
      MAX_LINES: 1000000
    steps:
      - name: Find the pull request
        id: pr
        run: |
          # `[ -z "$n" ] && { ...; }` returns 1 when $n IS set, and under bash -e
          # that exits the step on the SUCCESS path. Same trap that blinded
          # pr-gates. Use if/then, which has no exit status of its own.
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            n="${{ github.event.pull_request.number }}"
          else
            # `github.event.workflow_run.head_sha`, NOT `steps.pr.outputs.sha`.
            # This step's own id IS `pr`, so that expression read its own
            # output before it existed and always rendered EMPTY, giving
            #     gh: No commit found for SHA:  (HTTP 422)
            # and exit 1. The whole `workflow_run` leg of this workflow failed
            # 100% of the time — four runs on 2026-10-08 (37823306954,
            # 37824154542, 37878016497, 37878770889) and every one before them.
            #
            # Only the `pull_request_target` branch above ever worked, so the
            # dual-trigger design documented at the top of this file has been
            # running on one leg since it was written: a PR whose gates finish
            # AFTER its qa-pass label was never re-checked by anything.
            #
            # The later steps may still use steps.pr.outputs.sha — by then this
            # step has completed and the output exists. Only a self-reference
            # inside the defining step is empty.
            n=$(gh api "repos/$GH_REPO/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
                  --jq '.[0].number // empty')
          fi
          if [ -z "$n" ]; then
            echo "no PR for this SHA — nothing to merge"
            exit 0
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
          gh pr view "$n" --repo "$GH_REPO" \
            --json headRefName,headRefOid,additions,deletions,files,isDraft > /tmp/pr.json
          echo "branch=$(jq -r .headRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          # Resolve the head SHA from the PR, not from the event. A `labeled`
          # event has no workflow_run payload, so every message built from
          # `workflow_run.head_sha` would render an empty backtick pair.
          echo "sha=$(jq -r .headRefOid /tmp/pr.json)" >> "$GITHUB_OUTPUT"

      # Only branches this system opened. A human's branch is never auto-merged.
      - name: Is this an agent branch?
        id: own
        if: steps.pr.outputs.number
        run: |
          case "${{ steps.pr.outputs.branch }}" in
            issue/*) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::${{ steps.pr.outputs.branch }} is not an agent branch — leaving it alone" ;;
          esac

      # Query the API, do not read the event. A `labeled` event carries no
      # workflow_run payload at all, so the old check had nothing to read and
      # would have failed closed forever on that trigger.
      - name: Gates green?
        id: gates
        if: steps.own.outputs.ok == 'true'
        run: |
          sha=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" \
                  --json headRefOid --jq .headRefOid)
          echo "head: $sha"
          # Exclude THIS run's own check. On a pull_request_target trigger GitHub
          # creates a check run for the `merge` job, in_progress for exactly as
          # long as this step is reading the list — so "all checks green" could
          # never be true and the workflow waited on itself. Run 37768968298:
          # `merge=in_progress:pending` beside two green ones.
          #
          # Filtered by run id, not job name, so a rename cannot silently
          # reintroduce the deadlock.
          runs=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" \
                   --jq ".check_runs[]
                         | select((.details_url // \"\") | contains(\"/runs/$GITHUB_RUN_ID/\") | not)
                         | \"\(.name)=\(.status):\(.conclusion // \"pending\")\"")
          echo "$runs" | sed 's/^/  /'
          # Every check must have finished, and none may be anything but success.
          # `pending` counts as not-green: a check still running is not a pass,
          # which is the same rule pr-gates applies to its own exit-2 gates.
          if echo "$runs" | grep -qv ":success$"; then
            echo "::notice::not all checks are green yet — leaving the PR open"
            exit 0
          fi
          if [ -z "$runs" ]; then
            echo "::notice::no checks reported for $sha — not merging"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # qa.md: "PASS is a report, not an action." Read the report here.
      #
      # A LABEL, not a comment grep. The first agent PR (#292) had a QA verdict
      # and no PR comment carrying it, so a text match would have left it open
      # forever with green checks and nothing saying why. A label is binary,
      # survives any formatting, shows in `gh pr list --label qa-pass`, and —
      # applied to the issue as well — makes the whole loop auditable in one
      # query instead of by reading comment bodies.
      #
      # qa-fail is checked too, and wins. A PR that QA failed must not merge
      # because someone later added qa-pass without removing it.
      - name: QA verdict
        id: qa
        if: steps.gates.outputs.ok == 'true'
        run: |
          labels=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" \
                     --json labels --jq '[.labels[].name] | join(",")')
          echo "labels: ${labels:-none}"
          case ",$labels," in
            *,qa-fail,*)
              echo "::notice::qa-fail is set — not merging, whatever else is present"
              exit 0 ;;
            *,qa-pass,*)
              echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::no qa-pass label yet — leaving the PR open" ;;
          esac

      - name: Size and path limits
        id: size
        if: steps.qa.outputs.ok == 'true'
        run: |
          changed=$(( $(jq -r .additions /tmp/pr.json) + $(jq -r .deletions /tmp/pr.json) ))
          echo "diff is $changed lines (limit $MAX_LINES)"
          if [ "$changed" -gt "$MAX_LINES" ]; then
            gh pr edit "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" --add-label "too-large-to-automerge"
            gh pr comment "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" --body \
              "Gates green and QA passed, but this diff is ${changed} lines against a ${MAX_LINES}-line limit for unattended merge. Most of this app has no test coverage and \`main\` deploys on merge with no staging, so green proves less here than the line count suggests. Leaving it open."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.size.outputs.ok == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" --squash --delete-branch

          # Link both ways so a reviewer can follow the thread from either end.
          issue=$(echo "${{ steps.pr.outputs.branch }}" | sed -n 's|issue/\([0-9]\+\).*|\1|p')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GH_REPO" --body \
              "Merged by \`agent-merge\`: PR #${{ steps.pr.outputs.number }}, \`pr-gates\` green on \`${{ steps.pr.outputs.sha }}\`, \`qa-pass\` on record.

          **Not closing this.** \`main\` deploys on merge, so it closes once \`verify-production.yml\` has asserted against the live site — CLAUDE.md's two-stage close. With BUILD_SHA set, that run can now prove *which* commit is serving."
          fi

          gh pr comment "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" --body \
            "Merged automatically: \`pr-gates\` green on \`${{ steps.pr.outputs.sha }}\`, \`qa-pass\` on record, diff within the unattended limit.

          **Not closing the issue.** \`main\` deploys on merge, so the issue closes only once \`verify-production.yml\` has asserted against the live site — CLAUDE.md's two-stage close."

      # WITHOUT THIS, THE LOOP HAS NO LAST MILE. Measured 2026-10-08.
      #
      # GitHub does not start a workflow run for an event created with the
      # default GITHUB_TOKEN — the documented recursion guard, whose only
      # exceptions are `workflow_dispatch` and `repository_dispatch`. This job
      # merges with `GH_TOKEN: ${{ github.token }}`, so the push it creates
      # triggers NOTHING:
      #
      #   PR #299  merged by app/github-actions  ->  0 push-triggered runs
      #   PR #292  merged by mahAnuj             ->  2
      #   PR #296  merged by mahAnuj             ->  2
      #   PR #297  merged by mahAnuj             ->  2
      #
      # Two consequences, and the second is the serious one:
      #
      #   1. `close-on-evidence.yml` gates on a `verify-production` run whose
      #      event is `push`. For an agent-merged commit that run never exists,
      #      so no autonomously-merged PR can ever close its issue. #270 sat
      #      open with its fix live and `qa-pass` on record.
      #   2. The commit is NEVER VERIFIED AGAINST PRODUCTION. Cloud Build is a
      #      GCP-side webhook and is not subject to the Actions guard, so the
      #      merge DOES deploy — on a site with no staging, where production is
      #      the first place code runs. The verification that was supposed to
      #      end the loop simply did not happen.
      #
      # `workflow_dispatch` is the documented exception, so this dispatch does
      # start a run even from GITHUB_TOKEN. It is the whole fix.
      #
      # continue-on-error: the merge already succeeded and must not be reported
      # as failed because the follow-up dispatch did not land. A missing
      # verification is visible as an absent run on the commit; a red
      # agent-merge on a PR that merged cleanly is a misleading signal.
      - name: Verify production after the merge
        if: steps.size.outputs.ok == 'true'
        continue-on-error: true
        run: |
          # --ref main, not a SHA: workflow_dispatch takes a branch or tag. The
          # run therefore verifies main's TIP. If another merge lands in the
          # seconds between, that newer commit is verified instead and this
          # PR's issue stays open until the next verification — incomplete, not
          # wrong, and it self-corrects. close-on-evidence requires
          # /health build_sha == the run's head_sha precisely so a superseded
          # commit cannot be reported as live.
          if gh workflow run verify-production.yml --repo "$GH_REPO" --ref main; then
            echo "::notice::dispatched verify-production for main after merging #${{ steps.pr.outputs.number }}"
          else
            echo "::warning::could not dispatch verify-production — #${{ steps.pr.outputs.number }} is merged and deploying, but NOTHING will assert against production and its issue will not auto-close. Dispatch it by hand: gh workflow run verify-production.yml --ref main"
          fi

      # A red gate is information the issue needs, not just a failed run nobody reads.
      - name: Report a failure onto the issue
        # `== failure` only. `cancelled` is not a red gate — pr-gates sets
        # cancel-in-progress, so every push inside the run window cancels the
        # previous one; reporting that as a failure writes "pr-gates failed" onto
        # the issue while the real run is still going and about to pass. And a
        # label event carries no conclusion at all.
        if: >-
          steps.own.outputs.ok == 'true'
          && github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'failure'
        run: |
          issue=$(echo "${{ steps.pr.outputs.branch }}" | sed -n 's|issue/\([0-9]\+\).*|\1|p')
          [ -z "$issue" ] && exit 0
          gh issue comment "$issue" --repo "$GH_REPO" --body \
            "\`pr-gates\` failed on PR #${{ steps.pr.outputs.number }} (\`${{ steps.pr.outputs.sha }}\`), conclusion: ${{ github.event.workflow_run.conclusion }}.

          Run: ${{ github.event.workflow_run.html_url }}

          The PR stays open. Remember a gate exiting 2 is *skipped*, not passed — if that is what failed, the check did not run at all."
