# Notices that the pipeline has stopped, and routes the repair.
#
# WHY A SEPARATE LOOP
# -------------------
# The other nine loops take work from the BACKLOG. None watches whether work
# that is already FINISHED is flowing. Between 2026-10-08 and 10-10 that gap
# held a fully-QA'd product fix for nine hours (PR #319, blocked forever by a
# `cancelled` check run), a draft nobody readied (PR #303), three issues whose
# close chain was broken, and a measurement fetch that returned HTTP 403 on
# every run since it was wired while every run went green.
#
# DETECTION IS CODE, REPAIR IS AN AGENT
# -------------------------------------
# `scripts/detect_stalls.py` decides whether anything is stuck. It is
# deterministic and takes no model, because an agent that judges whether the
# system is stalled can judge that it is not. The agent is invoked only when
# that script exits 1, and its job is DIAGNOSIS — turning "open 9h with every
# check green" into "a superseded check run votes forever" — plus routing the
# fix through the normal pipeline.
#
# The agent cannot merge, close, push, apply a QA verdict, or edit
# `.github/workflows/**`, `.claude/**` or `CLAUDE.md`. See steward.md for why
# each of those is load-bearing: a monitor that can repair the gates has every
# incentive to relax them, and that is `USER AUTHORISED PUSH` one level up.
name: Agent steward

#: The only workflow here that had no `name:`, so GitHub listed it by path and
#: every run of it said `.github/workflows/agent-steward.yml`. Harmless until a
#: `workflow_run` trigger had to NAME a workflow, at which point "what is this
#: one called" stopped being cosmetic.
name: Agent steward

on:
  schedule:
    # Twice daily, offset from every other loop. 09:00 and 15:00 UTC sit after
    # the 02:xx nightly has finished and its PR has had time to gate, and well
    # before the 23:00 dispatch. A stall caught within half a day is the point;
    # catching it within the hour would mostly catch normal operation.
    - cron: "0 9,15 * * *"
  # REACT, DO NOT ONLY POLL. A verdict recorded at 09:05 waited until 15:00 for
  # anything to notice, and the twice-daily cron plus "one dispatch per run"
  # means four stalls take two days to work through. `agent-work` finishing is
  # the moment a verdict is most likely to have just been written, so it is the
  # moment worth checking.
  #
  # WHY `workflow_run` AND NOT `pull_request: [labeled]`, which is the obvious
  # choice and does not work. The loop labels with `${{ github.token }}`, and
  # GitHub SUPPRESSES workflow-triggering events from GITHUB_TOKEN. This
  # repository has already paid for that lesson once -- it is the
  # `no-checks-ever (mergeable)` case, a PR "created by an actor whose events
  # GitHub suppresses" -- so a `labeled` trigger would fire for a label a human
  # applies and never for one the loop applies, which is the case it would be
  # built for. Wiring that reports present and never fires is #421 exactly.
  #
  # `workflow_run` fires regardless of the triggering actor, which is the whole
  # reason this is the shape chosen.
  #
  # Bounded on purpose: `agent-work` runs about once a day, so this adds about
  # one steward run a day (~2.5 minutes, under a minute when nothing is found).
  # NOT wired to `pr-gates`, which completes on every push to every PR and would
  # queue steward runs behind the `agent-steward` concurrency group all day.
  workflow_run:
    # "Agent work" is agent-work.yml's `name:`, NOT its filename, and the
    # distinction is the whole bug. `workflows: ["agent-work"]` matched nothing,
    # so this trigger could never fire — #421's class a third time, in the
    # change written to make the loop react, on top of the bot-actor miss #439
    # fixed. Two defects stacked in one trigger, both of the same shape: wiring
    # that reports present and does nothing.
    #
    # `scripts/verify_workflows.py` now fails a `workflow_run` naming a workflow
    # no file declares, so this cannot recur silently.
    workflows: ["Agent work"]
    types: [completed]
  workflow_dispatch:
    inputs:
      hours:
        description: "Age in hours before a PR counts as stalled (default 4)"
        required: false

concurrency:
  group: agent-steward
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write         # push a BRANCH for its repair PR — never main
      pull-requests: write    # comment and routing labels only — never qa-pass
      issues: write           # file an issue, comment on one
      actions: write          # dispatch agent-work at the issue it filed
      checks: read            # read the check runs a stall is diagnosed from
      # REQUIRED by anthropics/claude-code-action, which mints an OIDC token.
      # Without it the step dies with
      #     Unable to get ACTIONS_ID_TOKEN_REQUEST_URL
      # and that is what killed this loop's very first run, 38031373476.
      #
      # FIFTH instance in this repo: four agent loops shipped without it in
      # October, and this file made five on the day it was written. Eight of
      # nine claude-code-action workflows had it; only the newest did not.
      # Textbook "copied files diverge", and mechanically checkable — a
      # workflow using that action must grant this scope. Specified on #317.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install
        run: uv sync --all-groups

      # THE GATE ON THIS WHOLE LOOP. Exit 0 means nothing is stuck and no agent
      # runs — the cheap, common case, costing under a minute. Exit 2 means the
      # detector could not determine, which is NOT a pass: it is escalated as
      # loudly as a stall, because "the pipeline may be stalled and unobserved"
      # is the exact condition this loop exists for.
      - name: Is anything actually stuck?
        id: detect
        env:
          STALL_HOURS: ${{ github.event.inputs.hours || '4' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Timestamped BEFORE the agent runs, so "did anything happen" compares
          # against the right instant rather than against the whole day.
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Through `env:`, not interpolated. `workflow_run` is a PRIVILEGED
          # trigger -- repo-write permissions and secrets -- so a `${{ }}` in a
          # run block is substituted before bash parses the line and becomes
          # shell injection. scripts/verify_workflows.py refused this change
          # until it was fixed, which is the gate doing its job (#358).
          uv run python scripts/detect_stalls.py \
            --hours "${STALL_HOURS:-4}" --json > /tmp/stalls.txt 2>&1
          code=$?
          set -e
          cat /tmp/stalls.txt
          cp /tmp/stalls.txt "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case $code in
            0) echo "stalled=false" >> "$GITHUB_OUTPUT"
               echo "::notice::no stall detected — not waking the steward" ;;
            1) echo "stalled=true"  >> "$GITHUB_OUTPUT" ;;
            2) echo "stalled=true"  >> "$GITHUB_OUTPUT"
               echo "::warning::the detector could not determine the pipeline's state, which is not a pass — waking the steward to find out why" ;;
            *) echo "stalled=true"  >> "$GITHUB_OUTPUT"
               echo "::warning::detector exited $code, unexpected — waking the steward" ;;
          esac

      - uses: anthropics/claude-code-action@v1
        if: steps.detect.outputs.stalled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WITHOUT THIS THE workflow_run PATH DIES IN 1.5 SECONDS, which is
          # #421 again and in the change that was supposed to end it. For a
          # `workflow_run` event `github.actor` is whoever initiated the
          # ORIGINATING run — and when the steward dispatches `agent-work`, that
          # actor is `github-actions[bot]`. claude-code-action then refuses:
          #
          #   Workflow initiated by non-human actor: github-actions (type: Bot).
          #
          # So the first time the new trigger mattered — a cycle the steward
          # itself dispatched finishing — the steward's reaction run would have
          # died before reading a single stall. Measured on #421: 3 of 3
          # bot-initiated dispatches failed identically, 0 of 4 human or cron
          # runs did.
          #
          # `github-actions`, never `'*'`: exactly this repository's own
          # GITHUB_TOKEN, which already has the write access it would need, so
          # no new principal gains anything.
          allowed_bots: "github-actions"
          prompt: |
            Dispatch the `steward` agent with `run_in_background: false`.

            `scripts/detect_stalls.py` exited non-zero, so something is stuck
            or its state could not be determined.

            **Its findings are in `/tmp/stalls.txt`** — read that file first.
            They are a PREMISE TO VERIFY, not a conclusion: the detector is
            deterministic, not omniscient. Re-run it yourself with
            `uv run python scripts/detect_stalls.py --json`, then read the PRs,
            their check runs and the relevant run logs before writing any
            diagnosis. A finding you did not check is a guess.

            Your value is the diagnosis, not the detection. Read steward.md and
            obey its constraints exactly — in particular you may NOT apply or
            remove `qa-pass`/`qa-fail`, may not merge, close or push, and may
            not edit `.github/workflows/**`, `.claude/**` or `CLAUDE.md`. File
            an issue and dispatch a cycle instead.

            If every finding turns out to be normal operation, say so and
            produce nothing. A quiet run is a correct run.
          claude_args: |
            --max-turns 60
            --effort high
            --allowedTools "Agent,Read,Write,Edit,Glob,Grep,Skill,WebFetch,WebSearch,TodoWrite,Bash"
            # It may now commit and push a BRANCH, so `git commit` and `git push`
            # are no longer denied — the repair has to be able to exist. What
            # stays denied is everything that would let it skip the gates that
            # judge the repair:
            #
            #   gh pr merge / gh pr review   it does not decide what lands
            #   gh issue close / gh pr close it does not decide what is done
            #   git push --force / reset     it does not rewrite what happened
            #   gh pr edit --add-label       no label at all, so no QA verdict;
            #                                routing labels go through `gh issue
            #                                edit`, which cannot touch a PR
            #
            # `scripts/verify_no_relaxation.py` is the real guard and it runs on
            # the PR. This list is the second lock, not the first.
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git reset --hard:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh issue close:*),Bash(gh pr close:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gcloud:*)"

      # DID IT ACTUALLY DO THE ACTIONABLES? This step is why chief exists in
      # this file.
      #
      # Measured 2026-10-10: scheduled runs 38061473379 and 38078264987 each
      # diagnosed PR #321, #318 and #315 correctly, dispatched nothing, filed
      # nothing, escalated nothing, and concluded `success`. Green twice,
      # pipeline still stopped. The role built to catch a green run that did
      # nothing produced two.
      #
      # So the agent's own claim is not the evidence. This step computes what
      # happened AFTER the agent started, and it does so in `run:` with
      # `github.token`, which holds `actions: read` — the agent's own `gh` is
      # the Claude App token and 403s on that API (#323), so a check inside the
      # agent would be blind to exactly the thing it must verify.
      #
      # DETERMINISTIC ON PURPOSE. "Did a dispatch follow a stall that demanded
      # one" is computable, so code answers it. Waking chief on every run to
      # ask would make chief scheduled by proxy, which its own definition
      # forbids, and would cost a full agent invocation to usually learn
      # nothing.
      - name: Did the steward act on what it found?
        id: acted
        if: steps.detect.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SINCE: ${{ steps.detect.outputs.started }}
        run: |
          set -uo pipefail
          # How many stalls obliged an action is DECIDED BY THE DETECTOR, which
          # already holds the routing table and already knows whether an agent
          # can act on each one. This step used to re-derive it with its own
          # regex, and that copy disagreed the moment a stall appeared that
          # routes to an action no agent can take (PR #315, whose diff touches
          # `.github/workflows/**`): it counted it, found no action, and woke
          # chief to rule "a human has to do this" on every single run.
          #
          # Absent or unparseable is treated as 0 obliged, i.e. do NOT wake
          # chief. The detector exits non-zero on a stall and 2 on
          # could-not-verify, both already surfaced above; inventing an
          # escalation out of a missing line would spend an invocation on a
          # parsing bug.
          demanded=$(grep -oE '^OBLIGED_ACTIONS=[0-9]+$' /tmp/stalls.txt | tail -1 | cut -d= -f2)
          demanded=${demanded:-0}
          echo "stalls demanding an action: $demanded"
          if [ "$demanded" = "0" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "nothing in the findings obliged an action"
            exit 0
          fi

          # Any evidence of action taken since this run began.
          cycles=$(gh run list --repo "$GH_REPO" --workflow agent-work.yml --limit 10 \
                     --json createdAt --jq "[.[] | select(.createdAt > \"$SINCE\")] | length" 2>/dev/null || echo 0)
          issues=$(gh issue list --repo "$GH_REPO" --state all --limit 20 \
                     --json createdAt --jq "[.[] | select(.createdAt > \"$SINCE\")] | length" 2>/dev/null || echo 0)
          echo "since $SINCE: cycles dispatched=$cycles, issues filed=$issues"

          if [ "$cycles" -gt 0 ] || [ "$issues" -gt 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the steward acted — $cycles cycle(s), $issues issue(s)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$demanded stall(s) demanded an action and NOTHING happened — no cycle dispatched, no issue filed. Waking chief."
          fi

      # CHIEF, and only here. Not on a schedule, not on every steward run —
      # only when the steward was handed actionable findings and produced no
      # action. That is a Shape B decision: the options are known, the choice
      # is not the steward's to park, and nothing else in this system can
      # notice the watcher failed.
      - uses: anthropics/claude-code-action@v1
        if: steps.acted.outputs.ok == 'false'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same reason as the steward step above (#421). chief is woken when the
          # steward produced no action, and that is reached on the same
          # bot-actored path.
          allowed_bots: "github-actions"
          prompt: |
            Dispatch the `chief` agent with `run_in_background: false`.

            **The steward just ran, was handed actionable stalls, and did
            nothing.** No cycle was dispatched and no issue was filed. That is
            the defect the steward exists to catch, committed by the steward,
            and it has now happened on consecutive runs.

            Read `/tmp/stalls.txt` for the findings, and the steward's own
            comments on the PRs it names.

            Rule on it as a **Shape B** escalation under Standing ruling 4.
            The options are in `steward.md`'s routing table: dispatch a cycle at
            the owning issue, file an issue against the gate, or escalate
            because no agent can rescue the PR. Say which clause decided you.

            Before ruling, do what Standing ruling 4 requires: **go and get the
            data.** You have `actions: read` here only through `run:` steps, not
            through your own `gh` (#323) — so if a fact needs the Actions API,
            say you could not obtain it rather than guessing.

            And apply the role-gap section: for each stall, work out which role
            should have acted and whether it DID NOT RUN versus RAN AND
            DECLINED. Those look identical from a blocked PR and mean opposite
            things. One dispatch per role, three total.

            You may not merge, close, push, label a QA verdict, or edit
            `.github/workflows/**`, `.claude/**` or `CLAUDE.md`.

            **If you rule that a cycle should be dispatched, do not hand the
            command to a human — record it and a later step runs it.** Write
            `/tmp/chief-dispatch.txt` containing AT MOST ONE line, exactly
            `issue=<number>`, and nothing else. No line means no dispatch, and
            that is a legitimate ruling — #315's case is exactly it. Do not
            write a line for a PR a cycle cannot clear (one whose diff touches
            `.github/workflows/**`, or that a human authored), and do not write
            one to be safe: the step cannot tell a considered dispatch from a
            hedge, and a wasted cycle is ~50 Actions minutes under clause 1.

            You do not need to check whether a cycle is already running. The
            step checks that itself, with a credential that can actually read
            the Actions API, and refuses rather than queueing a second.
          claude_args: |
            --max-turns 50
            --effort high
            --allowedTools "Agent,Read,Glob,Grep,Bash,WebFetch,TodoWrite"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(git push:*),Bash(git commit:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh issue close:*),Bash(gh pr close:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gcloud:*)"

      # CHIEF DECIDES, CODE EXECUTES.
      #
      # chief ruled "dispatch one cycle at #305" on 2026-10-11 and could not do
      # it. Its `gh` is the Claude App token, which 403s on the Actions API
      # (#323); the `actions: write` above belongs to GITHUB_TOKEN, which is
      # handed to `run:` steps and never to the agent. So the ruling arrived as
      # a command for a human to paste, and a loop that needs a human to carry
      # out its own decision is not a loop.
      #
      # This step is the carrier. It is deliberately dumb: the workflow name is
      # hardcoded here, so the only thing chief chooses is the issue number.
      # chief cannot dispatch anything else, cannot dispatch twice, and cannot
      # dispatch over a cycle already in flight — the guard it could not verify
      # for itself is verified here, where the token can read the API.
      - name: Carry out chief's dispatch ruling
        if: steps.acted.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/chief-dispatch.txt ]; then
            echo "chief recorded no dispatch. That is a ruling, not a failure."
            exit 0
          fi

          # Strict parse. Anything that is not exactly `issue=<digits>` on the
          # first line is refused rather than guessed at, because the failure
          # mode of a lenient parser here is dispatching a cycle at the wrong
          # issue — 50 minutes spent on work nobody ruled on.
          line=$(head -1 /tmp/chief-dispatch.txt | tr -d '[:space:]')
          issue=$(printf '%s' "$line" | grep -oE '^issue=[0-9]+$' | cut -d= -f2)
          if [ -z "$issue" ]; then
            echo "::error::chief wrote an unparseable dispatch line: '$line'. Refusing to guess."
            exit 1
          fi

          # The issue must be open. A cycle at a closed issue is the
          # `cannot-reproduce` path burned at full cycle cost.
          state=$(gh issue view "$issue" --repo "$GH_REPO" --json state --jq .state 2>/dev/null || echo MISSING)
          if [ "$state" != "OPEN" ]; then
            echo "::error::chief ruled a dispatch at #$issue, which is $state. Not dispatching."
            exit 1
          fi

          # Guard 1, the one chief recorded as "could not establish".
          busy=$(gh run list --repo "$GH_REPO" --workflow agent-work.yml --limit 10 \
                   --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo unknown)
          if [ "$busy" != "0" ]; then
            echo "::warning::a cycle is in flight (or the check failed: '$busy'). Chief's ruling at #$issue stands; it waits for the next run rather than queueing behind this one."
            exit 0
          fi

          # `gh workflow run` EXITS 0 ONCE THE RUN IS CREATED, and says nothing
          # about whether it then did anything. That is how #421 stayed invisible
          # for three days: the action refused the Bot actor 1.5s in, the run
          # concluded `failure` in ~33s, and this step reported "carried out" to
          # the summary every time. A dispatch nobody can tell from a no-op is
          # worse than no dispatch, because the stall detector then sees a cycle
          # was tried and the steward reports success.
          #
          # So: remember the newest run id, dispatch, wait for a NEW one, and
          # give it a window to die in. Anything already `completed` inside the
          # window concluded without doing a cycle's work -- a real cycle runs
          # for tens of minutes -- so that is a failure of this step, not a
          # finished job.
          before=$(gh run list --repo "$GH_REPO" --workflow agent-work.yml \
                     --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
          gh workflow run agent-work.yml --repo "$GH_REPO" -f issue="$issue"
          echo "::notice::requested agent-work at #$issue on chief's ruling; verifying it started"

          run_id=""
          for _ in $(seq 1 12); do          # up to ~60s for the run to appear
            sleep 5
            cand=$(gh run list --repo "$GH_REPO" --workflow agent-work.yml \
                     --limit 1 --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
            if [ "$cand" != "0" ] && [ "$cand" != "$before" ]; then run_id="$cand"; break; fi
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatch at #$issue created no new agent-work run within 60s. Not reporting it as carried out."
            exit 1
          fi

          # 90s is chosen against the measured failure, not guessed: the three
          # #421 runs concluded in 33-36s. A cycle that is still running here is
          # genuinely working and this step must NOT wait for it.
          for _ in $(seq 1 18); do
            sleep 5
            read -r status conclusion <<<"$(gh run view "$run_id" --repo "$GH_REPO" \
              --json status,conclusion --jq '"\(.status) \(.conclusion // "")"' 2>/dev/null || echo "unknown ")"
            if [ "$status" = "completed" ]; then
              echo "::error::agent-work run $run_id concluded '$conclusion' within 90s of dispatch at #$issue -- it did not run a cycle. See #421."
              exit 1
            fi
          done

          echo "::notice::agent-work run $run_id is running a cycle at #$issue"
          echo "DISPATCHED=$issue" >> "$GITHUB_ENV"
          echo "DISPATCHED_RUN=$run_id" >> "$GITHUB_ENV"

      # Say what happened either way. A loop that reports nothing when it found
      # nothing cannot be told from one that failed to run — which is the defect
      # this entire loop exists to catch, so it must not commit it.
      - name: Report
        if: always()
        env:
          # Same reason as the detect step: a privileged trigger makes every
          # `${{ }}` in a run block an injection point, so all four values this
          # block needs arrive through the environment and are expanded quoted.
          STALLED: ${{ steps.detect.outputs.stalled }}
          ACTED_OK: ${{ steps.acted.outputs.ok }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          {
            echo "### Steward"
            if [ "${STALLED:-}" = "true" ]; then
              echo "Detector reported a stall; the steward was woken. Its diagnosis is on the issues and PRs it names."
              if [ "${ACTED_OK:-}" = "false" ]; then
                echo ""
                echo "**The steward produced no action, so chief was woken.**"
                if [ -n "${DISPATCHED:-}" ]; then
                  # "carried out" is now only ever printed for a run this job
                  # watched start AND saw still running 90s later. See #421 for
                  # what this sentence used to mean.
                  echo "chief ruled a dispatch and it was carried out: \`agent-work\` at #${DISPATCHED} ([run ${DISPATCHED_RUN:-?}](${SERVER_URL}/${REPO_SLUG}/actions/runs/${DISPATCHED_RUN:-}))."
                else
                  echo "chief recorded no dispatch — either it ruled the stalls un-dispatchable, or the guard refused. Its ruling is a comment on the PRs named above."
                fi
              fi
            else
              echo "**Nothing was stuck.** The detector checked drafts never readied,"
              echo "mergeable-but-open PRs, PRs with no check runs, missing QA verdicts"
              echo "and dead trigger legs, and found none. No agent was invoked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
