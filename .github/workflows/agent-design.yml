# The Design team's loop: is the site worth staying on once someone arrives.
#
# Marketing is scored on arrivals, Design on what happens next. It audits the
# live site rather than the tree, because a template that renders correctly in
# the repo and wrongly in production is exactly the failure #253 and #254 are.
#
# Files proposals as issues. It never edits a template — that is
# frontend-engineer's job, through the normal delivery loop and its gates.
name: Agent design

on:
  schedule:
    - cron: "0 20 * * 4"   # Thursdays, 01:30 IST
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to audit (default: home, kundli, matching, learn)"
        required: false

concurrency:
  group: agent-design
  cancel-in-progress: false

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read      # proposes; never edits
      issues: write
      # Required by claude-code-action for its GitHub App auth. Without it the
      # step fails three times with "Could not fetch an OIDC token" before the
      # agent runs at all — which killed the first agent-prioritise dispatch.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-groups

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Act as the Design team lead for shubhagya.com. Audit the LIVE site,
            not the templates — #253 served a stale stylesheet to returning
            visitors for six weeks and nothing in the tree showed it.

            Pages: ${{ github.event.inputs.pages || 'https://shubhagya.com/, /kundli, /matching, /numerology, /learn' }}

            Run these skills rather than re-deriving their work:
              ui-auditor            visual regression, contrast, spacing, polish
              mobile-flow-auditor   375x667 first — most arrivals are mobile
              ui-designer           proactive upgrades, with references

            Before proposing anything, check the page actually works. A 503 from
            #266's Groq ceiling is an Engineering bug, not a design problem, and
            filing it as the latter sends it to the wrong team.

            Compare against rival astrology sites by WebFetch and say what they
            do better, with URLs. A claim about a competitor that cannot be
            fetched is not evidence.

            File one issue per finding, tagged `ui` plus `skill:ui-fixer` for
            fixes or `design-proposal` for anything needing a human eye. Each
            must carry: the page, what is wrong, the cheapest change that would
            test it — NOT a redesign — and the metric that would show it worked.

            Do not propose redesigning a page that already ranks without a CTR
            or funnel number to beat. #244 is flagged highest-silent-breakage-
            risk in the redesign epic for exactly that instinct.

            WRITE YOUR REPORT TO /tmp/report.md. Not optional — in automation
            mode nothing you say otherwise reaches a human, and a run that
            produced findings nobody can read is indistinguishable from one that
            did nothing.

            Markdown, one section per page audited: what you saw, what you
            filed, and what you considered and rejected.
          claude_args: |
            # Write was missing here too, and Bash was enumerated. The discover
            # loop ran that way and spent $1.21 across 51 turns with 12 denials,
            # filing nothing and writing nothing. The guardrail is the job's
            # contents:read permission, not the tool list.
            --max-turns 80
            --effort high
            --allowedTools "Read,Write,Glob,Grep,TodoWrite,Skill,WebFetch,WebSearch,Bash"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gcloud:*),Bash(gh secret:*),Bash(gh repo:*)"

      - name: Publish the report
        if: always()
        run: |
          if [ -s /tmp/report.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/report.md
          else
            echo "### No report written — treat this run as having produced nothing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect for persistence
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -f /tmp/report.md /tmp/out/report.md 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-report
          path: /tmp/out
          if-no-files-found: ignore

  persist:
    needs: design
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # contents       the branch push
      # pull-requests  `gh pr create` and `gh pr merge --auto`
      # actions        `gh workflow run` -- #322: a PR opened with GITHUB_TOKEN
      #                emits no `pull_request` event, so pr-gates and
      #                verify-build have to be dispatched or the required
      #                checks never report and the PR never merges
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: design-report
          path: /tmp/out
        continue-on-error: true
      - name: Commit the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s /tmp/out/report.md ] || { echo "nothing to persist"; exit 0; }
          mkdir -p measurements/design
          stamp=$(date -u +%Y-%m-%d)
          cp /tmp/out/report.md "measurements/design/$stamp.md"
          cp /tmp/out/report.md measurements/design/latest.md
          # THROUGH A PULL REQUEST, not `git push origin HEAD:main` (#393).
          # `main` requires one, so the old direct push was rejected with
          # GH006. This loop is weekly, so its breakage was still latent when
          # the fix landed -- `agent-measure` is the one that surfaced it, by
          # failing ~40 times in six days.
          bash scripts/publish_measurements.sh \
            --path measurements/design --title "design report"
