# A PR whose gates just went green, and which no QA round has ruled on, gets a
# cycle NOW instead of in four hours.
#
# WHY THIS EXISTS
# ---------------
# Nothing in this system treats "the gates passed" as a reason to run QA. QA
# lives inside `/agent-cycle`, and a cycle starts only two ways: the twice-daily
# `agent-work` cron, or a steward dispatch. The steward cannot see a PR until
# `detect_stalls.py`'s 4h threshold has elapsed, and it dispatches once per run
# against 2-4 runs a day.
#
# Measured 2026-10-25 on PR #536. A cycle shipped 16 files, ran QA round 1,
# fixed its findings in `f91a2bc`, and stopped -- correctly, because a fix must
# be verified by a NEW round and it had no budget for one. Both gates were green
# at 16:35Z. The PR was 47 minutes old, so the detector could not see it; once it
# could, it would queue behind #524 and #530 at one dispatch per run. A finished,
# green, unverified PR therefore waited most of a day for the round that would
# have taken fifteen minutes.
#
# WHY THIS IS NOT WIRED INTO THE STEWARD
# --------------------------------------
# `agent-steward.yml` records the reason verbatim: it is "NOT wired to
# `pr-gates`, which completes on every push to every PR and would queue steward
# runs behind the `agent-steward` concurrency group all day."
#
# That objection is about the AGENT, not the trigger. A steward run costs a
# Claude invocation; the decision here costs a few API reads and no model at
# all. So this is deterministic -- every condition below is a fact some API
# states, none is a judgment -- and it spends a cycle only when they all hold.
# The expensive thing stays rare; the cheap check gets to be frequent.
#
# WHAT IT WILL NOT DO
# -------------------
#   * It does not rule on a `qa-fail` PR. That one needs a FIX, not a round, and
#     `steward.md`'s routing table already owns it (`qa-fail-unaddressed`,
#     `qa-fail-refixed`, `draft-held-by-qa-fail` -- three kinds with different
#     actions, which is a judgment and belongs with the agent that holds it).
#   * It does not apply, remove or read a verdict as permission. It cannot label
#     at all: `pull-requests: read`. Only `scripts/qa_verdict.sh` writes those.
#   * It does not dispatch twice for the same head. See the loop guard below.
name: QA on green

on:
  workflow_run:
    # "PR gates" is pr-gates.yml's `name:`, not its filename. Getting this wrong
    # is why `agent-steward.yml`'s own `workflow_run` leg could never fire
    # (#421's class, three times in this repo) -- `verify_workflows.py` now
    # checks that this string matches a workflow some file declares.
    # verify-build since #912: its red runs are handled by the `red` job below;
    # the green path (`consider`) still answers to PR gates alone.
    workflows: ["PR gates", "verify-build"]
    types: [completed]

# One at a time. Two pushes in quick succession fire two of these, and the
# second would read the state the first is still acting on.
concurrency:
  group: qa-on-green
  cancel-in-progress: false

permissions:
  contents: read
  # `write` is needed for ONE thing: the dispatch comment, which is the loop
  # guard's only memory. It is NOT a licence to label. This workflow contains no
  # `gh pr edit`, no `--add-label` and no `--remove-label`, and
  # tests/test_qa_on_green.py fails the build if one appears -- because a
  # dispatcher that could label could hand itself `qa-pass` and make the merge
  # gate decorative. `scripts/qa_verdict.sh` is the only writer of a verdict.
  pull-requests: write
  issues: read
  actions: write          # dispatch agent-work, via scripts/dispatch_cycle.sh
  checks: read

jobs:
  consider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # EVERY value arrives as an env var and is expanded quoted. This is a
      # `workflow_run` workflow, which runs with the base repo's permissions
      # against a head this repo did not necessarily write, so a `${{ }}` in a
      # `run:` block is a script-injection sink. `verify_workflows.py` fails the
      # build on one, and #358 is the time it mattered.
      - name: Is this a PR a cycle should finish?
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GATES_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GATES_WORKFLOW: ${{ github.event.workflow_run.name }}
          # Same list, same meaning as agent-merge.yml and the steward: who
          # WROTE the PR decides whether it is ours, never what the branch is
          # called. #531 and #534 removed six copies of the branch-name rule;
          # this is a seventh place that must not reintroduce it.
          # github-actions[bot] and shubhagya-publisher[bot] added 2026-11-02
          # (#669): identities only this repo's own workflows can act as; see
          # agent-merge.yml for the reasoning.
          AGENT_AUTHORS: claude[bot],github-actions[bot],shubhagya-publisher[bot],${{ github.repository_owner }}
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # Measurement PRs are the publisher's and self-merge via
          # `allow_auto_merge`; they never want a QA round. Now that the
          # publisher is in AGENT_AUTHORS, this is what keeps ~8 a day from
          # each spending a ~50-minute cycle. Excluded by the branch the
          # publisher script ALWAYS uses, not by author -- the rescue net in
          # agent-work.yml also opens PRs as the publisher, and those do.
          case "$HEAD_BRANCH" in
            measurements/*)
              say "\`$HEAD_BRANCH\` is a measurement PR — it self-merges, no QA round."
              exit 0 ;;
          esac

          # The green path answers to PR gates alone; verify-build joined the trigger
          # for the red-gates steps below (#912).
          if [ "$GATES_WORKFLOW" != "PR gates" ]; then
            say "\`$GATES_WORKFLOW\` completed — the green path answers to PR gates only."
            exit 0
          fi

          if [ "$GATES_CONCLUSION" != "success" ]; then
            say "\`PR gates\` concluded \`$GATES_CONCLUSION\` on \`$HEAD_BRANCH\` — a red gate is information, not a stall."
            exit 0
          fi

          pr=$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,author,isDraft,labels,headRefOid,files \
                 --limit 1 2>/dev/null)
          [ -z "$pr" ] || [ "$pr" = "[]" ] && { say "No open PR on \`$HEAD_BRANCH\`."; exit 0; }

          num=$(jq -r '.[0].number' <<<"$pr")
          author=$(jq -r '.[0].author.login' <<<"$pr")
          head=$(jq -r '.[0].headRefOid' <<<"$pr")
          labels=$(jq -r '[.[0].labels[].name] | join(",")' <<<"$pr")

          # `gh pr view --json author` renders the app as `app/claude`; the REST
          # API and AGENT_AUTHORS say `claude[bot]`. Normalise, or the gate
          # refuses every PR the agent wrote.
          case "$author" in
            app/*) author="${author#app/}[bot]" ;;
          esac

          # Quoted, so `[` and `]` in `claude[bot]` are literal and not a glob
          # character class. Unquoted this matches NOTHING and fails closed --
          # measured, and pinned by tests/test_agent_merge_fork_guard.py.
          case ",$AGENT_AUTHORS," in
            *",$author,"*) ;;
            *) say "PR #$num authored by \`$author\`, not in AGENT_AUTHORS — not this loop's."; exit 0 ;;
          esac

          # The gates that just passed may not be the gates on the CURRENT head:
          # a push during the run moves it, and acting on a stale green is how a
          # verdict gets bound to code nobody verified.
          if [ "$head" != "$HEAD_SHA" ]; then
            say "PR #$num has moved to \`${head:0:7}\` since \`${HEAD_SHA:0:7}\` was gated — leaving it to the next run."
            exit 0
          fi

          # A `qa-pass` FOR AN EARLIER COMMIT IS NOT A VERDICT ON THIS ONE
          # (2026-11-05). `agent-merge` now merges only on a `QA: PASS` comment
          # naming the head, so a passed PR that gets `main` merged in (or any
          # push) needs a round on the new head -- and until this, this step
          # read the stale label as "agent-merge owns it" and exited, leaving the
          # PR refused by one workflow and ignored by the other. Same comment
          # test as agent-merge; anything unreadable reads as stale, which only
          # costs a round.
          stale_pass=false
          case ",$labels," in
            *",qa-pass,"*)
              owner="${GH_REPO%%/*}"
              bound=$(gh api "repos/$GH_REPO/issues/$num/comments?per_page=100" --paginate \
                  --jq ".[] | select(.user.login == \"claude[bot]\" or .user.login == \"$owner\")
                            | select(.body | startswith(\"QA: PASS\"))
                            | select(.body | split(\"\\n\")[0] | contains(\"$head\")) | .id" \
                  2>/dev/null | grep -c . || true)
              case "$bound" in ''|*[!0-9]*) bound=0 ;; esac
              if [ "$bound" -gt 0 ]; then
                say "PR #$num already carries \`qa-pass\` for \`${head:0:7}\` — \`agent-merge\` owns it from here."; exit 0
              fi
              stale_pass=true ;;
          esac
          # A `qa-fail` PR WHOSE FIX HAS LANDED GETS ITS ROUND NOW (2026-11-02,
          # owner's request). Until then this step left every `qa-fail` PR
          # alone ("that needs a FIX, not a round"), which was right before the
          # fix and wrong after it: the round that clears the label then waited
          # for the steward (twice a day) or a human. Measured that day: #649,
          # #636 and #675 each sat hours with the fix pushed, green gates and no
          # round, and the owner started three of them by hand.
          #
          # A fix is a NON-MERGE commit after the commit the FAIL was bound to --
          # the same test `detect_stalls.py` uses for `qa-fail-refixed`. Merging
          # `main` in fixes nothing a round failed, so it earns nothing here.
          # The verdict is read from `scripts/qa_verdict.sh`'s own comment, and
          # only from `claude[bot]`, and only as a 40-hex SHA: an outsider
          # pasting "QA: FAIL — verified at ..." cannot aim a round. Anything
          # unreadable leaves the PR alone, which is today's behaviour.
          refix=false
          case ",$labels," in
            *",qa-fail,"*)
              failed_at=$(gh api "repos/$GH_REPO/issues/$num/comments?per_page=100" --paginate \
                  --jq '.[] | select(.user.login == "claude[bot]") | .body | select(startswith("QA: FAIL")) | split("\n")[0]' \
                  2>/dev/null | tail -1 | grep -oE '[0-9a-f]{40}' | head -1 || true)
              if [ -z "$failed_at" ]; then
                say "PR #$num carries \`qa-fail\` and its FAIL verdict could not be read — leaving it."; exit 0
              fi
              if [ "$failed_at" = "$head" ]; then
                say "PR #$num carries \`qa-fail\` bound to this very head \`${head:0:7}\` — it needs a FIX first."; exit 0
              fi
              fixes=$(gh api "repos/$GH_REPO/compare/$failed_at...$head" \
                        --jq '[.commits[] | select((.parents | length) == 1)] | length' 2>/dev/null || echo unreadable)
              case "$fixes" in
                ''|*[!0-9]*)
                  say "PR #$num carries \`qa-fail\` and the commits since \`${failed_at:0:7}\` could not be compared — leaving it."; exit 0 ;;
              esac
              if [ "$fixes" -eq 0 ]; then
                say "PR #$num carries \`qa-fail\` at \`${failed_at:0:7}\`; only merges have landed since — a merge is not a fix. Leaving it."; exit 0
              fi
              refix=true ;;
          esac

          # A HELD PR WHOSE FAIL HAS A FIX GETS ITS ROUND TOO (2026-11-07). The
          # hold is chief's to clear, and chief clears only on a PASS for the
          # head -- so declining every held PR declined exactly the re-check a
          # held PR needs. Every workflow PR is held by design, and the App token
          # cannot push to one, so those are the PRs whose fixes come from a
          # session and then waited on nobody: #747 had its fix and a green
          # `gates` at 18:18Z and this step printed "someone has been told".
          # The round is judge-only and writes a verdict, never a clearance, so
          # chief still decides the hold. Without a fix since the FAIL, a held
          # PR is still left alone, as before.
          case ",$labels," in
            *",needs-human-review,"*)
              if [ "$refix" != true ]; then
                say "PR #$num carries \`needs-human-review\` — someone has been told."; exit 0
              fi
              say "PR #$num is held (\`needs-human-review\`), but a fix landed after its QA FAIL — a judge-only round re-checks it; chief still decides the hold." ;;
          esac

          # A JUDGING ROUND IS STILL POSSIBLE ON A BRANCH NOBODY CAN PUSH (#610).
          #
          # A cycle cannot push to a branch whose diff touches
          # `.github/workflows/`: the Claude App's token is refused the
          # `workflows` permission and the push itself is rejected (#442/#315).
          # Until 2026-11-01 this step read that as "a human has to" and exited:
          #
          #   say "... the App token cannot push that branch. A human has to."
          #   exit 0
          #
          # WHICH WITHHELD THE ONE LABEL THAT MATTERS. `agent-merge`'s `QA
          # verdict` step merges nothing without `qa-pass`, so exiting here did
          # not route a workflow PR to a human — it made the PR unmergeable by
          # anything, including a human running the sweep, until someone labelled
          # it by hand. Measured on PR #631: gates green since 2026-10-31T20:27,
          # no labels, no comments, `agent-merge` printing "no qa-pass label yet"
          # on every sweep.
          #
          # The refusal is on the PUSH and on nothing else:
          #   * a QA round READS the diff and writes a label
          #   * `qa_verdict.sh` writes that label with `github.token`
          #   * `agent-merge` merges with `github.token` too
          # None of those three is the App token. So the round runs; what it may
          # not do is push a fix, and `.claude/commands/agent-cycle.md` Step 2.5
          # carries that rule where the agent will actually read it. On a defect
          # the round writes `qa-fail` and puts the patch in a comment for chief
          # or a human session to apply.
          #
          # This does NOT let the loop merge its own gates unattended. Such a PR
          # still carries `needs-human-review` from `agent-merge`'s boundary
          # step, which only chief can clear, and only with
          # `verify_no_relaxation.py` green — the gate that is red by
          # construction on a widened permission or a weakened check.
          judge_only=false
          if jq -e '.[0].files[] | select(.path | startswith(".github/workflows/"))' <<<"$pr" >/dev/null 2>&1; then
            judge_only=true
          fi

          # WHAT THE DISPATCH AIMS AT, and since 2026-11-01 it is two things.
          #
          # `issue/`, `partial/` and `fix/` carry an owning issue by
          # construction (agent-cycle.md Step 4), and that is the richer aim:
          # the cycle reads the issue, adopts the branch at Step 2.5, and can
          # finish work that is not built yet. `measurements/` carries no
          # number, and the obvious widening `^[a-z]+/(\d+)` would read run id
          # 40140256532 as an issue ~8 times a day -- so the sed stays narrow.
          # BSD sed: `-E`, and `#` as the delimiter because `|` is the
          # alternation operator.
          #
          # WITH NO NUMBER, AIM AT THE PR ITSELF. What is wanted here is a QA
          # ROUND, and a round needs a PR; an issue is a convenience, not a
          # requirement. `qa_verdict.sh` has always agreed -- it turns the same
          # non-match into `ISSUE=none` and records the verdict anyway.
          #
          # Until 2026-11-01 this branch exited 0 on "a dispatch needs one to
          # aim at", and measured that morning it was holding FOUR of the five
          # green PRs then open, with zero dispatches and zero comments between
          # them: #639 `feat/ops-watcher-detector`, #647
          # `fix/mutation-row-floor-total`, #649 and #650. Green, unlabelled and
          # unmergeable for as long as they stayed open, because `agent-merge`
          # merges on `qa-pass` and `scripts/qa_verdict.sh` is its only writer.
          #
          # THE AIM IS NEVER SCRAPED FROM THE PR BODY, measured on those same
          # PRs. #639 carries no issue reference of any kind, so a body fallback
          # does literally nothing for it. #647's body yields `638` and `640`,
          # and both are PULL REQUESTS -- #638 merged, #640 closed. `gh issue
          # view` answers for a PR number, so a body-scraped aim would sail
          # through an openness check and point a ~50-minute cycle at a number
          # lifted from prose. tests/test_qa_on_green.py pins this shut.
          issue=$(printf '%s' "$HEAD_BRANCH" | sed -nE 's#^(issue|partial|fix)/([0-9]+).*#\2#p')
          # A re-fixed `qa-fail` PR wants a ROUND ON THE FIX, not a cycle that
          # may rebuild: it is aimed at the PR whatever the branch is called.
          if [ -n "$issue" ] && [ "$refix" != true ]; then
            target="issue=$issue"
            aim="issue #$issue"
          else
            target="pr=$num"
            aim="PR #$num itself — \`$HEAD_BRANCH\` names no owning issue, so the round judges the diff"
          fi
          if [ "$refix" = true ]; then
            aim="PR #$num itself — \`qa-fail\` at \`${failed_at:0:7}\` and $fixes fix commit(s) since, so the round judges the fix"
          fi
          # A stale pass wants a ROUND ON THIS HEAD, not a cycle that may
          # rebuild -- aimed at the PR whatever the branch is called, like a refix.
          if [ "$stale_pass" = true ]; then
            target="pr=${num}"
            aim="PR #$num itself — its \`qa-pass\` names an earlier commit, so the round judges \`${head:0:7}\`"
          fi

          # THE LOOP GUARD, and it is the reason this workflow is safe to run on
          # every green. A cycle that runs a round, pushes a fix and ends without
          # a verdict leaves exactly the state this workflow fires on -- so
          # without this it would dispatch at its own output, forever, at ~50
          # Actions minutes a turn. One dispatch per HEAD: a new commit is new
          # information and earns another; the same commit never does.
          if gh pr view "$num" --repo "$GH_REPO" --json comments \
               --jq '.comments[].body' 2>/dev/null \
               | grep -qF "qa-on-green: dispatched at $head"; then
            say "PR #$num already had a cycle dispatched at \`${head:0:7}\` — not dispatching again for the same commit."
            exit 0
          fi

          {
            echo "pr=$num"
            echo "issue=$issue"
            # `kind=digits`, nothing else. The later steps derive their own
            # wording from this rather than receiving prose through
            # GITHUB_OUTPUT, where a free-text value is a sink.
            echo "target=$target"
            echo "head=$head"
            echo "judge_only=$judge_only"
            echo "refix=$refix"
            echo "go=true"
          } >> "$GITHUB_OUTPUT"
          if [ "$judge_only" = true ]; then
            say "PR #$num (aimed at $aim) at \`${head:0:7}\`: gates green, no verdict — dispatching a JUDGE-ONLY round (the branch touches \`.github/workflows/\`, so the round may label it but not push to it)."
          else
            say "PR #$num (aimed at $aim) at \`${head:0:7}\`: gates green, no verdict — dispatching a cycle."
          fi

      # Say it on the PR BEFORE dispatching, not after. The comment is the loop
      # guard's only memory, and a dispatch that happened without one would be
      # invisible to the next run -- which would dispatch again.
      - name: Record the dispatch on the PR
        if: steps.pick.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pick.outputs.pr }}
          PR_HEAD: ${{ steps.pick.outputs.head }}
          TARGET: ${{ steps.pick.outputs.target }}
          JUDGE_ONLY: ${{ steps.pick.outputs.judge_only }}
          REFIX: ${{ steps.pick.outputs.refix }}
        run: |
          set -uo pipefail
          # The aim is re-derived from the `kind=digits` output rather than
          # passed as prose, so nothing free-text crosses a step boundary.
          case "$TARGET" in
            issue=*)
              aim="#${TARGET#issue=}" ;;
            *)
              aim="this PR itself, because its branch names no owning issue. The round judges the diff and records its verdict with \`--issue none\`, which \`qa_verdict.sh\` has always accepted." ;;
          esac
          if [ "$REFIX" = true ]; then
            aim="this PR itself, to judge the fix pushed since its \`qa-fail\` verdict (a round on the fix, not a cycle that may rebuild)."
          fi
          # The judge-only paragraph is a REMINDER, not the rule. The rule lives
          # in `.claude/commands/agent-cycle.md` Step 2.5, because a comment on a
          # PR is data the agent reads and a rule it must obey cannot be sourced
          # from the artefact under review. If the two ever disagree,
          # agent-cycle.md wins.
          if [ "$JUDGE_ONLY" = true ]; then
            scope="**This is a JUDGE-ONLY round.** The diff touches \`.github/workflows/\`, and the App token the cycle runs under is refused the \`workflows\` permission, so no commit can be pushed to this branch. Run the QA round, write the verdict, and stop. On a defect, write \`qa-fail\` and put the patch in a comment — do not attempt to apply it. See \`agent-cycle.md\` Step 2.5."
          else
            scope="\`/agent-cycle\` Step 2.5 adopts this branch and PR rather than starting over."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body \
            "qa-on-green: dispatched at $PR_HEAD

          Both gates are green on this head and no QA round has ruled on it, so a cycle is being dispatched at $aim to run one (or queued behind the running cycle, if there is one -- \`scripts/cycle_queue.py\`). $scope

          This is mechanical, not a judgment: no model ran, and nothing here applied, removed or read a verdict label. Only \`scripts/qa_verdict.sh\` writes those. One dispatch per commit — a new push earns another, this one does not."

      # Same carrier as the steward's and chief's, deliberately. This repo's
      # most reliable defect is a copied file diverging (`id-token: write` was
      # missing from four loops each copied from a fifth), and a dispatcher whose
      # instances drift is that bug with a worse blast radius. The script
      # re-checks that the issue is open, QUEUES the ruling if a cycle is in
      # flight (on this PR, via QUEUE_ON -- see scripts/cycle_queue.py), and
      # verifies the run it created survived 90s -- `gh workflow run` exits 0 on
      # a run that then dies in 1.5 seconds, which is how #421 hid for three days.
      - name: Carry out the dispatch
        if: steps.pick.outputs.go == 'true'
        env:
          LOOP_PAUSED: ${{ vars.LOOP_PAUSED }}   # #903: paused queues, never dispatches
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.pick.outputs.target }}
          # Where a QUEUED entry is written if a cycle is already running. This
          # workflow may comment on PRs and not on issues, so an `issue=<n>`
          # ruling is queued on the PR it came from. See scripts/cycle_queue.py.
          QUEUE_ON: ${{ steps.pick.outputs.pr }}
        run: |
          set -uo pipefail
          # `issue=<n>` or `pr=<n>`. The carrier parses the form strictly and
          # checks the right API for each -- `gh issue view` for an issue,
          # `gh pr view --json state` for a PR -- so this step hands it the
          # ruling verbatim and makes no claim about which one it is.
          printf '%s\n' "$TARGET" > /tmp/qa-on-green-dispatch.txt
          bash scripts/dispatch_cycle.sh /tmp/qa-on-green-dispatch.txt qa-on-green

      # RED GATES (#912). Measured 2026-11-12: five PRs sat 9-20h red and nothing
      # acted -- three on a runner DNS blip (apt could not resolve
      # security.ubuntu.com, so no test ever ran), two on real failures a cycle
      # could fix. `consider` exits on red by design; detect_stalls.py has no
      # red-gates kind; an empty commit to re-trigger CI is forbidden. So:
      # scripts/red_gates.py decides rerun (flake, first attempt only) / fix (one
      # build cycle per head, never a workflows diff: `issue=<n>` on a branch
      # naming its issue, `fix_pr=<pr>` on any other -- a session's PR, since
      # 2026-11-13, at most 3 per PR) / notify (one comment per head) / none.
      # Deterministic: no Claude here.

      - id: decide
        name: What should happen to this red PR?
        if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          AGENT_AUTHORS: claude[bot],github-actions[bot],shubhagya-publisher[bot],${{ github.repository_owner }}
        run: |
          set -o pipefail      # QA on #913: without it, tee hid red_gates.py's exit 2
          python3 scripts/red_gates.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Re-run the jobs the runner failed
        if: steps.decide.outputs.action == 'rerun'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GH_REPO"

      # Marker FIRST, then the dispatch: the same loop guard as the green path.
      - name: Record the fix dispatch on the PR
        if: steps.decide.outputs.action == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
          JOBS: ${{ steps.decide.outputs.jobs }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment "$PR" --repo "$GH_REPO" --body "qa-on-green: fix dispatched at $HEAD_SHA

          \`$JOBS\` failed on this head and the failure is in the code, not the runner, so one build cycle is being dispatched to fix it (#912). One per head: a new push earns another, this one does not."

      - name: Dispatch the fix cycle
        if: steps.decide.outputs.action == 'fix'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # `issue=<n>` or `fix_pr=<pr>`, as red_gates.py decided; the carrier
          # parses it strictly and refuses anything else.
          RULING: ${{ steps.decide.outputs.target }}
          QUEUE_ON: ${{ steps.decide.outputs.pr }}
          LOOP_PAUSED: ${{ vars.LOOP_PAUSED }}   # #903: a red-gates fix is queued too while paused
        run: |
          printf '%s\n' "$RULING" > /tmp/red-gates-dispatch.txt
          bash scripts/dispatch_cycle.sh /tmp/red-gates-dispatch.txt qa-on-green

      - name: Say what failed, once per head
        if: steps.decide.outputs.action == 'notify'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
          JOBS: ${{ steps.decide.outputs.jobs }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment "$PR" --repo "$GH_REPO" --body "qa-on-green: red gates noted at $HEAD_SHA

          \`$JOBS\` failed on this head, and no cycle will fix it: either the diff touches .github/workflows/, which the cycle token cannot push, or this PR has already had its 3 automatic fixes. A session has to push the fix (#912)."
