# Marketing's loop: what should we build next, and why that.
#
# Weekly rather than nightly because its inputs move slowly — GSC positions,
# rival pages, the questions people ask on Reddit. Running it daily would file
# the same issues against the same numbers.
#
# workflow_dispatch is the point: there is no reason to wait for a cron to ask
# "what are competitors doing that we are not".
name: Agent discover

on:
  schedule:
    - cron: "0 20 * * 1"   # Mondays, 01:30 IST — ahead of the week's cycles
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus (e.g. 'competitors for kundli matching')"
        required: false

concurrency:
  group: agent-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read      # files issues; writes no code
      # `gh run list` / `gh run download` read ANOTHER workflow's runs, which
      # needs this scope. An omitted scope is `none`, never inherited, so
      # without it the step gets
      #     HTTP 403: Resource not accessible by integration
      # and since that step is continue-on-error it fails SILENTLY.
      #
      # Measured in the 2026-10-09 nightly (run 37876433396 at 02:50:34): the
      # delivery cycle has NEVER received the analyst's measurement. The
      # scoring arm of the loop — the one ARCHITECTURE.md calls load-bearing,
      # "without it the others ship forever and never learn" — has been
      # feeding nothing into delivery since it was wired up.
      #
      # Found by scripts/verify_workflows.py on its first run, not by a human.
      actions: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-groups

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/89117619584/locations/global/workloadIdentityPools/github/providers/astro-ai
          service_account: agent-analytics@bhagya-500701.iam.gserviceaccount.com

      # Discovery starts from measurement, not from opinion.
      - name: Pull the numbers
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          uv run python scripts/fetch_gsc.py --days 28 --band > /tmp/gsc-band.json
          uv run python scripts/fetch_ga4.py --days 28 > /tmp/ga4.json


      # Plan from the analyst's latest run rather than re-deriving it. Falls
      # through quietly when no measurement exists yet — a first run must not be
      # blocked by the absence of a prior one.
      - name: Fetch the latest measurement
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow agent-measure.yml --status success \
                 --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then
            gh run download "$id" -n measurement --dir /tmp/measure \
              && echo "measurement from run $id" \
              && ls -la /tmp/measure
          else
            echo "no prior measurement — proceeding without one"
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /discover ${{ github.event.inputs.focus }}

            The numbers are already fetched — read these first, before any opinion:
              /tmp/gsc-band.json   queries at positions 6-20, ranked by opportunity
              /tmp/ga4.json        landing pages, sessions, bounce, pages/session

            /tmp/measure/report.md, if present, is the analyst's most recent
            analysis — what moved, what did not, and which theses were scored.
            Read it before forming a plan. Do not re-derive its conclusions, and
            do not contradict a measured finding without saying why.

            Follow .claude/commands/discover.md exactly. In particular: the
            analyst's data first, then rivals by WebFetch, then social by
            WebSearch, then the corpus. File an issue ONLY if it carries a
            complete Evidence Block. An issue missing a field is not filed.

            WRITE YOUR REPORT TO /tmp/report.md. This is not optional. In
            automation mode nothing you say reaches a human — the run log
            carries the prompt and the cost, not your findings. A previous run
            spent $1.21 across 51 turns and left no trace of what it concluded.

            Markdown. What you found, what you filed and why, what you decided
            NOT to file and why — that last part is as useful as the rest,
            because it stops the same idea being re-raised next week.
          claude_args: |
            # Write was missing and Bash was enumerated, which cost a real run:
            # 51 turns, $1.21, 12 denials, no issues filed and no report — the
            # agent could not write a file even if told to. The guardrail is the
            # job's contents:read permission, not the tool list.
            --max-turns 80
            --effort high
            --allowedTools "Agent,Read,Write,Glob,Grep,TodoWrite,Skill,WebFetch,WebSearch,Bash"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gcloud:*),Bash(gh secret:*),Bash(gh repo:*)"

      - name: Publish the report
        if: always()
        run: |
          if [ -s /tmp/report.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/report.md
          else
            echo "### No report written — treat this run as having produced nothing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          # A RUN THAT PRODUCED NOTHING IS A FAILURE, NOT A SUCCESS.
          # It used to echo this line and exit 0. Measured on agent-prioritise:
          # three runs (2026-10-08, 10-11, 10-18) concluded `success` in 74-109
          # seconds having written no report at all, so `measurements/prioritise/`
          # has nothing newer than 10-08 and BACKLOG.md nothing newer than
          # 2026-08-27 -- its header still reads "36 open issues at scan time"
          # against ~60 now. Nobody looked, because nothing was red.
          # This is CLAUDE.md's named signature failure: "A green run that did
          # exactly nothing." The `if: always()` above stays, so the summary is
          # still written and the artifact still uploads; only the verdict changes.
            exit 1
          fi

      - name: Collect for persistence
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -f /tmp/report.md /tmp/out/report.md 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-report
          path: /tmp/out
          if-no-files-found: ignore

  # Separate job, no agent in it — the discover job stays contents:read so the
  # agent has no write credential at all. measurements/** is on the Cloud Build
  # trigger's ignoredFiles, so this commit does not deploy the site.
  persist:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # contents       the branch push
      # pull-requests  `gh pr create` and `gh pr merge --auto`
      # actions        `gh workflow run` -- #322: a PR opened with GITHUB_TOKEN
      #                emits no `pull_request` event, so pr-gates and
      #                verify-build have to be dispatched or the required
      #                checks never report and the PR never merges
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: discover-report
          path: /tmp/out
        continue-on-error: true
      # #393: the PR opened below must NOT be authored by `github-actions[bot]`.
      # Since 2026-06-11 GitHub holds the `pull_request` runs of a PR that bot
      # opens in `action_required`, and while one held suite sits on the head
      # SHA it reports NO status rollup for the PR AT ALL -- measured on #477
      # and #478, where `gates` and `build-gates` were green on the SHA, the
      # rollup was null for nine minutes, and auto-merge never fired. There is
      # no setting that disables it; the fork-PR approval policy was tested at
      # its loosest value and made no difference. A GitHub App token is
      # GitHub's own documented remedy, and this repo already demonstrates it:
      # `claude[bot]`'s PRs have never been held.
      #
      # `continue-on-error` plus the `||` below is what keeps a missing or
      # expired key from being WORSE than the bot: the publish still happens on
      # `github.token`, the checks are held, and someone approves them by hand
      # -- exactly today's behaviour, rather than a failed step and a
      # dashboard that silently stops moving.
      - name: Mint a publisher token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

      - name: Commit the report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s /tmp/out/report.md ] || { echo "nothing to persist"; exit 0; }
          mkdir -p measurements/discover
          stamp=$(date -u +%Y-%m-%d)
          cp /tmp/out/report.md "measurements/discover/$stamp.md"
          cp /tmp/out/report.md measurements/discover/latest.md
          # THROUGH A PULL REQUEST, not `git push origin HEAD:main` (#393).
          # `main` requires one, so the old direct push was rejected with
          # GH006. This loop is weekly, so its breakage was still latent when
          # the fix landed -- `agent-measure` is the one that surfaced it, by
          # failing ~40 times in six days.
          bash scripts/publish_measurements.sh \
            --path measurements/discover --title "discover report"
