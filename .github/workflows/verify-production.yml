# Assert that the live site matches what we believe we shipped.
#
# WHY THIS EXISTS
# Every `scripts/verify_*.py` gate in this repo checks the tree. None of them
# checks production. Agents working this repo often cannot reach
# shubhagya.com at all (sandbox network policy — it varies by environment and
# has changed mid-task), so "verified" has meant "verified against
# origin/main" and the last mile has been done by hand, or not at all. This closes that gap: it runs on GitHub's runners, which have
# open network, and it fails loudly.
#
# WHAT A GREEN RUN MEANS — read this before adding a check
# It depends on which tier the "Wait for the deploy" step reports, and the
# step prints which one ran. There are two, and the gap between them is the
# whole point:
#
#   EXACT (only once BUILD_SHA is set on the Cloud Build trigger)
#     /health returns a build_sha, we poll until it equals this commit, and a
#     green run genuinely means THIS COMMIT is the revision serving.
#
#   REVISION-CHANGED (what runs today — build_sha is null)
#     /health returns K_REVISION, which Cloud Run injects on every deploy. We
#     record it before the deploy lands and poll until it CHANGES. That proves
#     *a* new revision is serving, not that it is this commit's — a concurrent
#     push, a rollback or a console-side redeploy would satisfy it too.
#
# To upgrade to EXACT, the repo owner adds to the GCP-side Cloud Build trigger:
#     --set-env-vars=BUILD_SHA=$COMMIT_SHA
# Nothing in this repo can do it; the trigger is configured GCP-side and is not
# in the tree. No code change is needed here when it happens — the step picks
# the tier per poll from whether build_sha is null, so it upgrades itself.
#
# K_REVISION itself needs nothing: Cloud Run injects it into every container
# automatically. /health lives in src/astro_ai/routes/health.py.
#
# The path is /health, not /healthz: Google infrastructure intercepts
# /healthz in front of Cloud Run, so it never reaches the app and this gate
# could never pass. That is what failed run 32957675512. See the comment
# above the route in health.py for the measurement before changing it back.
#
# Under EITHER tier the wait FAILS on timeout. It must never fall through to
# the assertions having given up — a gate that tests the old revision and
# passes is a gate that cannot fail, which is the failure mode this workflow
# was written to remove. The three assertion steps do not retry: they read one
# fetch of each page, so they are a snapshot of whatever the wait admitted.
# The sweep retries a URL once, and only on a non-200 — see the comment there.
#
# Every curl carries --fail (or an explicit %{http_code} check) and -L. Without
# them an HTTP error leaves a 0-byte file, and a 0-byte file silently satisfies
# every "must be absent" assertion while failing every "must be present" one.
# That defect was live in this file: /learn/diwali-muhurat-2026 without its
# trailing slash 307s to 0 bytes.
#
# WHAT IS CHECKED
# A smoke sweep over every URL in the production /sitemap.xml (~200), asserting
# each returns 200, plus three narrow assertions (#172, #193, #227) on three
# pages. The sweep is the breadth check and the assertions are the depth ones:
# before the sweep existed a deploy could have 500'd the homepage and 75 of the
# 76 /learn articles with this workflow still green.
#
# The daily `schedule` run deliberately does NOT wait for a deploy — nothing
# was pushed, so no revision would ever change and it would time out every
# night. It waits only for the site to answer, and its green means "production
# satisfies these invariants right now", whoever deployed last. That is the
# right meaning for a drift check.

name: verify-production

on:
  push:
    branches: [main]
    # ONLY verify when the commit could have changed the deployed app.
    #
    # Measured 2026-10-08: of the last 25 commits on `main`, **zero** touched
    # anything that ships. Every one was `.github/`, `.claude/`, `scripts/`,
    # `measurements/` or a root `*.md` — agent plumbing — and every one still
    # paid a ~5 min deploy wait plus a ~10 min sweep. 12 runs, 227 Actions
    # minutes in one day, verifying a site that provably could not have moved.
    #
    # The ignore list is derived from the Dockerfile, not guessed. It copies
    # exactly four things:
    #     COPY pyproject.toml uv.lock README.md ./
    #     COPY src ./src
    # so `src/**`, `pyproject.toml`, `uv.lock` and `Dockerfile` are the whole
    # set that can reach production. Nothing below is in the image.
    #
    # IGNORE-LIST, NOT AN ALLOW-LIST, DELIBERATELY. A new top-level directory
    # must default to *verifying*; listing `paths:` instead would mean every
    # future app path is silently exempt until someone remembers to add it.
    # The failure direction matters more than the brevity.
    #
    # `*.md` NOT `**.md` — and this one is load-bearing. In GitHub path
    # filters `*` does not cross a `/`, so `*.md` matches root-level files
    # only. `**.md` would also match `src/astro_ai/knowledge/*.md`, which is
    # the classical-source corpus the app READS AT RUNTIME to ground its
    # astrological claims. A corpus edit absolutely changes what users see, so
    # it must keep triggering a verification.
    paths-ignore:
      - '.github/**'
      - '.claude/**'
      - 'scripts/**'
      - 'measurements/**'
      - 'evals/**'
      - '*.md'
  schedule:
    # WEEKLY, not daily — Mondays. The drift check answers "does production
    # still satisfy these invariants", and production drifts from causes
    # outside this repo (a Cloud Run change, an expired key, a dependency on
    # a date). Those are slow. A daily run cost ~19 min x 30 = ~570 min/month
    # against a 2,000-minute allowance — a quarter of the budget to re-prove
    # the same thing. Weekly is ~80 min/month for the same signal, a week
    # later in the worst case.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# One verification at a time. Runs 37768903779 (11:15) and 37769391086 (11:20)
# overlapped, as did three other pairs the same day — a merge burst meant two
# jobs each waiting ~5 min for a deploy and each sweeping 213 URLs, for one
# commit's worth of information.
#
# `cancel-in-progress: false` — QUEUE, never cancel. `close-on-evidence.yml`
# fires on this workflow concluding success and reads `workflow_run.head_sha`
# to close the issue for THAT exact commit. Cancelling a superseded run would
# silently drop that commit's auto-close, which is the one mechanism closing
# issues without the user's attention.
concurrency:
  group: verify-production
  cancel-in-progress: false

permissions:
  contents: read
  # To dispatch close-on-evidence from the final step. See it for why that
  # dispatch is the thing that completes the autonomous chain.
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 12 min deploy wait + 10 min sweep cap + assertions
    env:
      SITE: https://shubhagya.com
    steps:
      # ---- deploy gate ----------------------------------------------------
      # push / workflow_dispatch only. See the header for what each tier proves.
      - name: Wait for the deploy
        if: github.event_name != 'schedule'
        run: |
          set -uo pipefail

          # Baseline BEFORE the new revision can land. A 404 here is expected
          # and informative on the first push that ships /health: the old
          # revision has no such route, so "absent" is a value that any real
          # revision differs from.
          # `|| true` rather than `|| echo 000`: curl already emits its own
          # `000` via -w on a connection failure, and echoing again produced
          # "HTTP 000000" in the log.
          probe() {
            local c
            c=$(curl -sS --max-time 20 -o /tmp/health.json \
                     -w '%{http_code}' "$SITE/health" 2>/dev/null) || true
            echo "${c:-000}"
          }
          # Only ever trust /tmp/health.json behind a 200 AND a successful
          # parse. `jq -e` fails on null/false, so a 200 carrying a proxy error
          # page yields empty here instead of the string "unknown" — which
          # would have differed from the baseline and falsely reported a deploy.
          read_rev() { jq -er '.revision' /tmp/health.json 2>/dev/null || echo ""; }

          code=$(probe)
          BASE_REV=""
          if [ "$code" = "200" ]; then BASE_REV=$(read_rev); fi
          [ -n "$BASE_REV" ] || BASE_REV="(absent: HTTP $code)"
          echo "baseline revision: $BASE_REV"
          echo "expecting commit:  $GITHUB_SHA"
          LAST_TIER=unknown

          # 48 tries x 15s = 12 min, inside the 20 min job timeout with room
          # for the assertions.
          for i in $(seq 1 48); do
            code=$(probe)
            if [ "$code" != "200" ]; then
              echo "try $i: /health HTTP $code"; sleep 15; continue
            fi
            rev=$(read_rev)
            if [ -z "$rev" ]; then
              echo "try $i: /health returned 200 but no parseable .revision"; sleep 15; continue
            fi
            sha=$(jq -r '.build_sha // empty' /tmp/health.json 2>/dev/null || echo "")

            if [ -n "$sha" ]; then
              LAST_TIER=exact
              # EXACT tier. Compare 7-char prefixes: Cloud Build's $COMMIT_SHA
              # is full-length, but $SHORT_SHA is an equally likely thing for a
              # trigger author to have used, and git's own abbreviation is 7.
              if [ "${sha:0:7}" = "${GITHUB_SHA:0:7}" ]; then
                echo "DEPLOY GATE: exact — build_sha ${sha:0:7} matches this commit (revision $rev), after ${i} tries"
                echo "DEPLOY_GATE=exact" >> "$GITHUB_ENV"
                echo "DEPLOY_REV=$rev"   >> "$GITHUB_ENV"
                exit 0
              fi
              echo "try $i: serving build_sha ${sha:0:7}, want ${GITHUB_SHA:0:7} (revision $rev)"
            else
              LAST_TIER=revision-changed
              # REVISION-CHANGED tier.
              if [ "$rev" != "$BASE_REV" ]; then
                echo "DEPLOY GATE: revision-changed — $BASE_REV -> $rev, after ${i} tries"
                echo "::notice::Deploy gate ran in REVISION-CHANGED mode: a new revision ($rev) is serving, but this is NOT proof that commit ${GITHUB_SHA:0:7} is the one serving. To upgrade to exact proof, add --set-env-vars=BUILD_SHA=\$COMMIT_SHA to the Cloud Build trigger (GCP-side); no change to this repo is needed."
                echo "DEPLOY_GATE=revision-changed" >> "$GITHUB_ENV"
                echo "DEPLOY_REV=$rev"              >> "$GITHUB_ENV"
                exit 0
              fi
              echo "try $i: still revision $rev (unchanged from baseline)"
            fi
            sleep 15
          done

          echo "DEPLOY_GATE=timeout" >> "$GITHUB_ENV"
          # Report the reason for the tier that was actually polling. A timeout
          # message naming the wrong cause sends the next reader to the wrong
          # place, which is the whole defect class this file keeps tripping on.
          case "$LAST_TIER" in
            exact)
              echo "::error::/health never reported build_sha ${GITHUB_SHA:0:7} within ~12 min (last seen: ${sha:0:7} on revision $rev). The deploy either failed, or the Cloud Build trigger is passing a different SHA. Failing rather than asserting against whatever is serving." ;;
            revision-changed)
              echo "::error::Revision never changed from $BASE_REV within ~12 min. Failing rather than asserting against the pre-deploy revision — a check that passes on the old code proves nothing. NOTE this tier has a known false failure: if the deploy completed before this job captured its baseline, the baseline WAS the new revision and nothing will ever change. Setting BUILD_SHA on the trigger removes that ambiguity." ;;
            *)
              echo "::error::$SITE/health never returned a parseable 200 within ~12 min (baseline $BASE_REV). Production may be down; not asserting." ;;
          esac
          exit 1

      # ---- reachability only, for the nightly drift run --------------------
      - name: Wait for the site to answer (scheduled drift run)
        if: github.event_name == 'schedule'
        run: |
          echo "DEPLOY_GATE=not-a-deploy" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/" || true)
            if [ "$code" = "200" ]; then echo "site up after ${i} tries"; exit 0; fi
            echo "try $i: HTTP $code"; sleep 20
          done
          echo "::error::$SITE never returned 200 in ~10 min"; exit 1

      # ---- smoke sweep ----------------------------------------------------
      # The three assertion steps below check three pages. Nothing checked that
      # the other ~197 render at all, so a deploy could 500 the homepage and 75
      # of the 76 /learn articles and this workflow would still go green.
      #
      # /sitemap.xml is the URL source because the app GENERATES it, so it
      # cannot drift from the routes the way a hardcoded list here would. It
      # deliberately omits the chart-specific pages that need a cookie
      # (/today, /kundli, /monthly, /yearly, /dasha) and /admin/usage — see
      # routes/seo.py. So this sweeps what is publicly reachable, which is
      # exactly the set a crawler sees.
      #
      # continue-on-error, with the real failure deferred to "Smoke sweep gate"
      # after the assertions: if the sweep fails we still want #172/#193/#227
      # in the log, because "everything 500s" and "the Lo Shu attribution came
      # back" want different responses and one must not hide the other.
      - name: Smoke sweep — every URL in the production sitemap returns 200
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          code=$(curl -sSL --max-time 30 -o /tmp/sitemap.xml -w '%{http_code}' "$SITE/sitemap.xml") || code=000
          if [ "$code" != "200" ]; then
            echo "SMOKE_STATUS=sitemap-http-$code" >> "$GITHUB_ENV"
            echo "::error::/sitemap.xml returned HTTP $code — cannot sweep"; exit 1
          fi
          sed -n 's:.*<loc>\([^<]*\)</loc>.*:\1:p' /tmp/sitemap.xml | sort -u > /tmp/urls.txt
          n=$(wc -l < /tmp/urls.txt)
          echo "sitemap URLs: $n"

          # A FLOOR, not an expectation. Measured 200 on 2026-08-26. If a bug
          # makes the sitemap emit 3 URLs, a sweep over 3 URLs passes and
          # reports nothing wrong — that is the vacuous pass this guards. The
          # number should only ever move UP as content pages are added; raise
          # it deliberately, never lower it to make a red run green.
          if [ "$n" -lt 150 ]; then
            echo "SMOKE_STATUS=too-few-urls-$n" >> "$GITHUB_ENV"
            echo "::error::sitemap listed only $n URLs (floor 150) — the sweep would be vacuous"; exit 1
          fi

          cat > /tmp/probe.sh <<'PROBE'
          #!/bin/bash
          # -L: several routes 307 to a trailing-slash canonical form, and a
          # redirect to a working page is not a smoke failure. The recorded
          # code is the FINAL one. No --fail here on purpose — this probe must
          # REPORT the status, not abort on it.
          url="$1"
          try() { curl -sL -o /dev/null --max-time 30 --max-redirs 5 \
                       -w '%{http_code} %{time_total}' "$url" 2>/dev/null; }
          # Keep curl's own -w output on failure. An earlier version replaced it
          # wholesale with "000 0", which threw away the elapsed time and made a
          # 25s TIMEOUT indistinguishable from an instant connection refusal —
          # 25 URLs were reported as broken when they were merely slow.
          out=$(try); [ -n "$out" ] || out="000 0"
          # One retry, and only on a non-200. Cloud Run cold starts on the free
          # tier are real: measured 2026-08-26, one page took 28.9s cold and
          # 1.0s warm. A single retry removes that flake without masking a page
          # that is genuinely broken, which would fail twice.
          case "$out" in
            200\ *) ;;
            *) out=$(try); [ -n "$out" ] || out="000 0" ;;
          esac
          printf '%s %s\n' "$out" "$url"
          PROBE
          chmod +x /tmp/probe.sh

          # -P 6: bounded concurrency. This is the user's production site on
          # Cloud Run, where cold starts are real; 200 parallel requests would
          # be a load test, not a smoke test.
          # Capped at 10 min so a hanging site fails the step rather than
          # burning the whole job budget and being killed with no report.
          # Measured 2026-08-26 over the real 200-URL sitemap: warm pages
          # answer in ~1-1.6s, so the sweep runs well inside this; the cap is
          # for the pathological case, not the normal one.
          # THE LLM-BACKED PAGES ARE EXCLUDED. A verification must not spend
          # the product's runtime budget — user's instruction 2026-10-08:
          # "I don't think we should waste llm calls on verifying as currently
          # I am using free llm api keys."
          #
          # The /rashifal/{rashi} pages — 12 English + 12 Hindi since #124 —
          # GENERATE a reading on a cache miss, and nothing pre-warms that
          # namespace (warm-rashifal writes only the combined key). So every
          # sweep of a new day paid for 24 real generations.
          #
          # The arithmetic, kept so it can be re-derived rather than trusted
          # (measured 2026-10-06 with tiktoken o200k_base):
          #
          #   3,330 input tokens per cold generation x 24 pages = ~80,000
          #   ceiling = 8,000 TPM PER MODEL x 2 models (groq120,groq20) = 16,000
          #
          # 80k tokens per sweep, and the sweep ran on EVERY push to main —
          # 12 times on 2026-10-08 alone, so ~960k tokens of the free tier
          # spent proving pages render. It never failed loudly when it
          # breached TPM: the chain falls through groq120 -> groq20 -> openai,
          # and openai is the PAID leg, so the symptom was a bill and a
          # rate-limit line rather than an error. That silent-exhaustion shape
          # is what caused the 21-day rashifal email outage.
          #
          # Pacing at -P 2 fixed the token RATE but not the token SPEND, and
          # it made the sweep serial-slow: 24 pages at -P 2 with a 28.9s cold
          # start is the long pole that pushed the whole step past the 600s
          # cap. Every run between 06:56 and 11:20 on 2026-10-08 died at
          # exactly 600s with `exit code 124` — 13 consecutive red runs that
          # were the sweep timing out, not the site being broken.
          #
          # And a timing-out sweep is worse than a slow one, because the gate
          # below exits 1 and SKIPS every remaining assertion — including the
          # #216/#218 rule-source check, the hardest surface on this site to
          # reach. The expensive step was masking the valuable ones.
          #
          # WHAT COVERS THEM INSTEAD: the weekly drift run probes ONE rashifal
          # page, rotating by ISO week, so the route shape is still exercised
          # at 1/24th the tokens. See the step after this one.
          grep -vE '/rashifal/[a-z]+/?$' /tmp/urls.txt > /tmp/urls-cheap.txt || true
          n_cheap=$(wc -l < /tmp/urls-cheap.txt)
          n_llm=$(( n - n_cheap ))
          echo "sweeping $n_cheap URLs at -P 6; skipping $n_llm LLM-backed (token budget)"

          # 600s is now a pathological-case cap rather than the normal path.
          # 189 URLs at -P 6 is ~32 batches: ~41s warm (~1.3s/page, measured
          # 2026-08-26). The removed LLM phase was what consumed the budget.
          timeout 600 xargs -a /tmp/urls-cheap.txt -P 6 -I{} /tmp/probe.sh {} \
            > /tmp/sweep.tsv
          swept_rc=$?
          swept=$(wc -l < /tmp/sweep.tsv)
          if [ "$swept_rc" -eq 124 ]; then
            echo "SMOKE_STATUS=timeout-after-$swept-of-$n_cheap" >> "$GITHUB_ENV"
            echo "::error::sweep exceeded 10 min after $swept/$n_cheap URLs — failing, not skipping"; exit 1
          fi

          # Collect EVERY failure, not just the first: one 500 and forty 500s
          # are different problems and the list is the diagnosis.
          awk '$1 != "200"' /tmp/sweep.tsv > /tmp/cand.tsv || true
          cand=$(wc -l < /tmp/cand.tsv)

          # CONFIRMATION PASS — serial, and with a longer budget.
          #
          # The parallel sweep cannot tell "this page is broken" from "this
          # page was queued behind 199 others on a free-tier instance". Run 2
          # (32965254213) reported 11 of 200 URLs as failures; every one was
          # `000` at exactly 30.00s, i.e. the --max-time ceiling, never a 4xx
          # or 5xx. Re-probed serially straight afterwards, all 11 returned
          # 200 in ~1.0-1.7s, and all 11 also passed at -P 6 when swept ALONE.
          # So the trigger is the cumulative load of the full 200-URL sweep
          # against maxScale 5, not any property of those URLs.
          #
          # The in-probe retry does not catch this: it fires immediately and
          # still under the same concurrent load, so a contention window loses
          # both attempts. Only dropping the concurrency can separate the two,
          # which is what this does.
          #
          # This CANNOT mask a genuinely broken page: a 404, a 500 or a real
          # hang fails serially too, with 60s to prove it. What it removes is
          # exactly one false signal — "slow because we caused the load".
          #
          # SETTLE FIRST — added 2026-09-04, and it is the whole point.
          # "Serial" was not enough on its own, because the recheck started the
          # instant the sweep ended, while the queue it built was still
          # draining. Run 23 (33864837062) is the proof, in its own log: the
          # FIRST recheck, /rashifal/gemini, took 38.7s and still returned 200;
          # the last, /terms, took 19.6s; and in between /sade-sati-check hit
          # the 60s ceiling and was reported as the one confirmed failure. It
          # answers 200 in 1.04-1.31s, five times running, measured immediately
          # afterwards. Run 19 (33421037393) failed identically —
          # `1-bad-of-200` — on ece5466, a commit that touched nothing but
          # og:image, so this is the workflow measuring its own load, on every
          # push, and not any commit's defect.
          #
          # A settle CANNOT hide a broken page. A 404 or a 500 answers in
          # milliseconds and answers the same after any wait; a genuine hang
          # burns 60s here and 60s again in the second pass below, 30s apart.
          # What the wait removes is the one thing a wait can remove: queueing
          # we caused ourselves.
          : > /tmp/bad.tsv
          if [ "$cand" -gt 0 ]; then
            echo "letting the instance drain for 45s before re-probing (see comment)"
            sleep 45
            echo "re-probing $cand candidate(s) serially at --max-time 60"
            : > /tmp/still.tsv
            while read -r _code _secs url; do
              [ -n "${url:-}" ] || continue
              out=$(curl -sL -o /dev/null --max-time 60 --max-redirs 5 \
                         -w '%{http_code} %{time_total}' "$url" 2>/dev/null) || out=""
              [ -n "$out" ] || out="000 0"
              echo "  recheck: $out $url"
              case "$out" in
                200\ *) ;;
                *) printf '%s\n' "$url" >> /tmp/still.tsv ;;
              esac
            done < /tmp/cand.tsv

            # Second and FINAL pass, 30s later, for whatever is still not 200.
            # Two serial failures 30s apart on a drained instance is a broken
            # page, and it is reported as one.
            if [ -s /tmp/still.tsv ]; then
              echo "$(wc -l < /tmp/still.tsv) still failing — final serial pass after 30s"
              sleep 30
              while read -r url; do
                [ -n "${url:-}" ] || continue
                out=$(curl -sL -o /dev/null --max-time 60 --max-redirs 5 \
                           -w '%{http_code} %{time_total}' "$url" 2>/dev/null) || out=""
                [ -n "$out" ] || out="000 0"
                echo "  final: $out $url"
                case "$out" in
                  200\ *) ;;
                  *) printf '%s %s\n' "$out" "$url" >> /tmp/bad.tsv ;;
                esac
              done < /tmp/still.tsv
            fi
          fi
          bad=$(wc -l < /tmp/bad.tsv)
          cleared=$(( cand - bad ))

          echo "swept $swept/$n_cheap URLs (+$n_llm LLM-backed skipped) · sweep non-200: $cand · confirmed: $bad · cleared on recheck: $cleared"
          if [ "$cleared" -gt 0 ]; then
            echo "::warning::$cleared URL(s) failed the concurrent sweep but returned 200 serially — free-tier contention, not a broken page"
          fi
          echo "SMOKE_STATUS=$bad-bad-of-$swept" >> "$GITHUB_ENV"

          # Slowest handful — NOT a gate, a free rolling record. #144 was a
          # ~13s homepage; noticing the next one early costs nothing here.
          sort -k2 -gr /tmp/sweep.tsv > /tmp/slow.tsv
          {
            echo "### Smoke sweep"
            echo ""
            echo "Swept **$swept / $n_cheap** sitemap URLs · confirmed non-200: **$bad**"
              echo ""
              echo "_${n_llm} LLM-backed \`/rashifal/{rashi}\` page(s) deliberately NOT swept —"
              echo "each generates a reading on a cache miss at ~3,330 input tokens and the"
              echo "site runs on Groq's free tier. The weekly drift run probes one, rotating._"
            if [ "$cleared" -gt 0 ]; then
              echo ""
              echo "_${cleared} URL(s) failed the concurrent sweep and returned 200 on a serial"
              echo "recheck — free-tier contention from the sweep itself, not a broken page._"
            fi
            echo ""
            if [ "$bad" -gt 0 ]; then
              echo "| code | secs | url |"; echo "|---|---|---|"
              head -40 /tmp/bad.tsv | awk '{printf "| %s | %s | %s |\n", $1, $2, $3}'
              echo ""
            fi
            echo "<details><summary>Slowest 8</summary>"; echo ""
            echo "| secs | code | url |"; echo "|---|---|---|"
            head -8 /tmp/slow.tsv | awk '{printf "| %s | %s | %s |\n", $2, $1, $3}'
            echo ""; echo "</details>"; echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad sitemap URL(s) did not return 200, confirmed serially — see the step summary"
            sed 's/^/  /' /tmp/bad.tsv
            exit 1
          fi
          echo "all $swept sitemap URLs returned 200"

      # Every curl here carries --fail -L. Without --fail an HTTP error writes a
      # 0-byte file, and a 0-byte file satisfies every "must be absent" grep
      # below while failing every "must be present" one. That is not
      # hypothetical: /learn/diwali-muhurat-2026 (no trailing slash) 307s, so
      # this step was silently handing the #193 checks an empty page.
      # Measured 2026-08-26: no slash -> HTTP 307, 0 bytes; with slash and -L ->
      # HTTP 200, 124231 bytes.
      # The ONE LLM-backed probe this workflow is willing to pay for, and only
      # on the weekly drift run.
      #
      # The sweep above skips all 24 /rashifal/{rashi} pages because each one
      # GENERATES a reading on a cache miss (~3,330 input tokens) and the site
      # runs on Groq's free tier. Skipping them entirely would leave the whole
      # route shape unverified, and that route is how the daily rashifal
      # reaches users — the surface of the 21-day silent outage.
      #
      # So: one page, rotated by ISO week, 1/24th the token cost, and never on
      # a push. 12 rashis x 2 languages means the full set is covered in 24
      # weeks; any single break shows up within one week of its own slot, and
      # a break affecting ALL rashis (the realistic failure, since they share
      # one code path and one prompt) shows up on the next run whichever slot
      # it picks.
      #
      # continue-on-error: this is coverage, not a release gate. A free-tier
      # rate limit is not a defect in the commit, and failing the job for one
      # would make the gate noisier than the thing it watches.
      - name: One LLM-backed rashifal page (weekly run only)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          set -uo pipefail
          rashis="aries taurus gemini cancer leo virgo libra scorpio sagittarius capricorn aquarius pisces"
          week=$(date -u +%V)            # 01-53, so the slot advances weekly
          i=$(( (10#$week - 1) % 12 ))
          rashi=$(echo $rashis | cut -d' ' -f$(( i + 1 )))
          # Alternate language every 12 weeks so Hindi gets covered too (#124).
          if [ $(( (10#$week - 1) / 12 % 2 )) -eq 1 ]; then
            url="$SITE/hi/rashifal/$rashi"
          else
            url="$SITE/rashifal/$rashi"
          fi
          # 90s, not the sweep's 30s: a cold generation is a real LLM call.
          # Measured 2026-08-26, one page took 28.9s cold.
          # No heredoc: a heredoc body must sit at column 0, which terminates
          # the YAML block scalar this step lives in. Same split-on-space
          # idiom as /tmp/probe.sh above.
          out=$(curl -sL -o /tmp/rashifal.html --max-time 90 --max-redirs 5 \
                     -w '%{http_code} %{time_total}' "$url" 2>/dev/null) || out=""
          [ -n "$out" ] || out="000 0"
          code=${out%% *}
          secs=${out##* }
          bytes=$(wc -c < /tmp/rashifal.html 2>/dev/null || echo 0)

          # A 200 IS NOT ENOUGH, and neither is page size.
          #
          # The failure this route actually had was a 200 carrying no reading:
          # the envelope stripper cleaned a truncated <think> block to zero
          # visible characters, so the page rendered empty and reported
          # success. A whole-document byte floor cannot see that — the page is
          # ~126,000 bytes and the chrome, nav, footer and JSON-LD survive an
          # empty reading intact. Measured on /rashifal/aries 2026-10-08:
          # 125,952 bytes total, of which the reading is ~1,230 characters.
          #
          # So measure THE PROSE CONTAINER, which is what users came for.
          # `.speakable-body` is the div holding `{{ reading_body }}` in
          # rashifal_single.html, and it is already load-bearing — the Article
          # JSON-LD's SpeakableSpecification targets it.
          #
          # NOTE the pattern is `<div class="speakable-body` and not the bare
          # class name: the string appears TWICE on the page, once inside the
          # JSON-LD speakable spec. Matching the bare name finds the JSON-LD
          # first and measures structured data instead of the reading — which
          # would have passed on a page with no reading at all.
          prose=$(awk '/<div class="speakable-body/{f=1} f{buf=buf $0 " "} f&&/<\/div>/{print length(buf); exit}' \
                    /tmp/rashifal.html)
          prose=${prose:-0}
          echo "week $week -> $url  HTTP $code  ${secs}s  ${bytes} bytes  prose ${prose} chars"

          if [ "$code" != "200" ]; then
            echo "::warning::$url returned HTTP $code — rashifal route may be degraded"
            exit 1
          fi
          # 400, against a measured ~1,280 for a real reading and ~105 for an
          # empty one (the class attribute is inside the match window). The
          # gap is wide on purpose: this should fire on a missing reading, not
          # on a short one.
          if [ "$prose" -lt 400 ]; then
            echo "::warning::$url returned 200 but its reading is only ${prose} chars — an empty-prose render, which is exactly how the 21-day rashifal outage looked from outside"
            exit 1
          fi
          echo "rashifal route healthy: $rashi, ${prose} chars of reading"

      - name: Fetch the pages once, so every check reads the same bytes
        run: |
          set -euo pipefail
          # POST, not GET: the Lo Shu grid renders only in a submitted result.
          # Measured 2026-08-26 on GET /numerology, grid markers ("Number Grid",
          # "Arrow of") = 0; on this POST = 3. A fixed birth date keeps the
          # rendered output stable run to run.
          curl -sSL --fail --max-time 45 -X POST "$SITE/numerology" \
               -d 'name=CI Check' -d 'birth_date=1988-05-14'          -o /tmp/numerology.html
          curl -sSL --fail --max-time 30 "$SITE/learn/diwali-muhurat-2026/" -o /tmp/diwali.html
          curl -sSL --fail --max-time 30 "$SITE/panchang"             -o /tmp/panchang.html
          wc -c /tmp/numerology.html /tmp/diwali.html /tmp/panchang.html

      # ---- #172 -----------------------------------------------------------
      # The Lo Shu grid has no source in data/. Cheiro is legitimate elsewhere
      # on this page (the Chaldean letter table) — only ATTRIBUTION OF THE GRID
      # to him is the defect, so the check is deliberately narrow.
      #
      # It is narrow in a way the first version was not. That version matched
      # mere proximity (cheiro within 80 chars of "lo shu"), which hits the
      # legitimate list-form sentence "the Chaldean (Cheiro) system plus the
      # Chinese Lo Shu grid" — measured 2026-08-26 as 2 hits on a CORRECT
      # production page, i.e. it would have failed the build on good content.
      # This version requires a possessive or an attributive preposition.
      # Measured on the same page: 0.
      - name: "#172 the Lo Shu grid is not attributed to Cheiro"
        run: |
          set -uo pipefail
          # Vacuity guard FIRST, before asserting anything about the content.
          # The previous version's guard grepped for 'Lo Shu' and passed on 13
          # mentions in the tool's own description while the grid itself was
          # never rendered — the exact vacuous pass this file's header warns
          # about, committed into this file.
          m=$(grep -oiE 'Number Grid|Arrow of' /tmp/numerology.html | wc -l)
          echo "rendered-grid markers: $m (want >0)"
          [ "$m" -gt 0 ] \
            || { echo "::error::the Lo Shu grid did not render — every check below would be vacuous"; exit 1; }

          n=$(grep -ciE "cheiro'?s [^.]{0,30}(lo shu|grid)|(lo shu|grid)[^.]{0,30}(per|from|according to) cheiro" /tmp/numerology.html || true)
          echo "grid-attributed-to-Cheiro: $n (want 0)"
          [ "$n" -eq 0 ] || { echo "::error::#172 regressed — the grid is being attributed to Cheiro"; exit 1; }

          # Positive guard: the correction #172 shipped was a disclosure
          # sentence. If the whole section is dropped, the check above passes
          # on absence; this makes that a failure.
          d=$(grep -ci 'not to Vedic Jyotish' /tmp/numerology.html || true)
          echo "disclosure sentence: $d (want >0)"
          [ "$d" -gt 0 ] || { echo "::error::#172 disclosure sentence is gone"; exit 1; }

      # ---- #193 -----------------------------------------------------------
      # Eight date-shaped strings became bare ordinals so Gate 4 can defend the
      # rest. Nov 8 and Nov 10 must SURVIVE — they are what the gate corroborates
      # against, and deleting them would silently gut it.
      # Measured against production 2026-08-26 with the trailing slash:
      #   Nov 7 = 0, Nov 9 = 0, the 7th = 5, Nov 8 = 7, Nov 10 = 2.
      - name: "#193 diwali prose uses ordinals, keeps its verified dates"
        run: |
          # NOT `set -e` with pipefail. `grep -o` exits 1 when it finds nothing,
          # and finding nothing is the PASSING state for n7/n9 — so under
          # `set -euo pipefail` this step aborted at the first assignment,
          # before printing a single line, precisely when the content was
          # correct. Verified 2026-08-26 against the live page: exit 1, no
          # output. That is the mirror image of the vacuous pass above, and
          # just as useless. The `|| true` on each pipeline keeps a zero count
          # a zero count; the assertion below is what decides pass or fail.
          set -uo pipefail
          n7=$(grep -o 'Nov 7'  /tmp/diwali.html | wc -l || true)
          n9=$(grep -o 'Nov 9'  /tmp/diwali.html | wc -l || true)
          o7=$(grep -o 'the 7th' /tmp/diwali.html | wc -l || true)
          n8=$(grep -o 'Nov 8'  /tmp/diwali.html | wc -l || true)
          n10=$(grep -o 'Nov 10' /tmp/diwali.html | wc -l || true)
          echo "Nov 7=$n7 (0)  Nov 9=$n9 (0)  the 7th=$o7 (>0)  Nov 8=$n8 (>0)  Nov 10=$n10 (>0)"
          [ "$n7" -eq 0 ] && [ "$n9" -eq 0 ] && [ "$o7" -gt 0 ] \
            && [ "$n8" -gt 0 ] && [ "$n10" -gt 0 ] \
            || { echo "::error::#193 regressed"; exit 1; }

      # ---- #227 -----------------------------------------------------------
      # Open defect, asserted as a WATCH so it is visible rather than forgotten.
      # /panchang renders reversed windows for polar cities. This does not fail
      # the build — it annotates. Turn it into a failure when #227 is fixed.
      - name: "#227 watch — polar city still renders reversed windows"
        continue-on-error: true
        run: |
          # Without the status check a failed fetch leaves an empty file, the
          # grep misses, and the step cheerfully reports the defect FIXED.
          code=$(curl -sSL --max-time 30 "$SITE/panchang/2026-05-17?city=Tromso" \
                      -o /tmp/polar.html -w '%{http_code}') || code=000
          if [ "$code" != "200" ]; then
            echo "::warning::could not fetch the polar page (HTTP $code) — #227 not evaluated"
            exit 0
          fi
          if grep -qE '0[01]:[0-9]{2} — 00:0[0-9]' /tmp/polar.html; then
            echo "::warning::#227 still reproduces on production (expected until fixed)"
          else
            echo "::notice::#227 no longer reproduces — close it and make this step fail-on-regression"
          fi

      # Deferred failure from the sweep above. Placed after the assertions so
      # their output is in the log either way; this is what actually reds the
      # job, since the sweep itself is continue-on-error.
      - name: Smoke sweep gate
        if: steps.smoke.outcome != 'success'
        run: |
          echo "::error::Smoke sweep failed (${SMOKE_STATUS:-no status recorded}) — see the 'Smoke sweep' step and the summary."
          exit 1

      # The rule/yoga source labels (#216, #218) are the hardest surface on
      # this site to reach, and three of my attempts to check them produced a
      # VACUOUS PASS before this step existed:
      #   * POST /kundli            -> 405; the error page scores 0 "BPHS"
      #   * POST /manglik-check     -> 200 but renders NO source label at all
      #                                for a chart with no cancellations, so
      #                                0 "BPHS" again, and again meaningless
      #   * POST /reading with -X   -> 405; -X forces the method through the
      #                                303, so it POSTs to a GET-only /kundli
      # The labels only appear behind POST /reading -> 303 -> GET /kundli,
      # which needs a COOKIE JAR (the chart lives in the session) and needs
      # curl to be allowed to switch to GET on the 303 (so --data, never -X).
      # Every one of those wrong attempts looked like a pass. Hence the
      # vacuity guard first: no labels rendered is a FAILURE here, not a pass.
      - name: "#216/#218 rule sources cite a book the repo holds"
        run: |
          set -uo pipefail
          # Three tries, 20s apart. /kundli computes a chart AND generates the
          # reading, so it is the heaviest route on the site and it runs right
          # after a 200-URL sweep. Measured 2026-08-30: three serial attempts
          # gave 503, 503, 200 — the successful one took 15.2s, the failures
          # 6.2s each.
          code=000
          for try in 1 2 3; do
            JAR=$(mktemp)
            code=$(curl -sSL --max-time 150 -c "$JAR" -b "$JAR" \
                     --data 'name=CI Check' --data 'birth_date=1957-09-07' \
                     --data 'birth_time=01:05' --data 'birth_place=Mumbai' \
                     "$SITE/reading" -o /tmp/kundli.html -w '%{http_code}') || code=000
            rm -f "$JAR"
            echo "try $try: HTTP $code, $(wc -c < /tmp/kundli.html) bytes"
            [ "$code" = "200" ] && break
            sleep 20
          done

          # OVER QUOTA IS NOT A CITATION REGRESSION. `_render_natal_for` returns
          # 503 with "High demand right now" when the LLM chain raises
          # AllProvidersExhausted — i.e. the Groq free tier is spent. That says
          # nothing about whether a label cites a book we hold, so failing #216
          # on it would attribute a capacity problem to the wrong defect and
          # train readers to ignore this step. Warn and skip, the way the #227
          # watch step does. The 503 rate itself is tracked separately.
          if [ "$code" != "200" ]; then
            if grep -qi 'High demand right now' /tmp/kundli.html; then
              echo "::warning::natal reading is over quota (503, AllProvidersExhausted) after 3 tries — #216/#218 NOT EVALUATED this run. This is a capacity finding, not a citation regression."
              exit 0
            fi
            echo "::error::could not reach the natal reading (HTTP $code) and it is not the over-quota page"
            exit 1
          fi

          # VACUITY GUARD FIRST. A page with no yoga at all makes every
          # absence below true for the wrong reason.
          n=$(grep -c 'yoga-source' /tmp/kundli.html || true)
          echo "yoga source labels rendered: $n (want >0)"
          [ "$n" -gt 0 ] || { echo "::error::no yoga source label rendered — every check below would be vacuous"; exit 1; }

          # The books the repo does NOT hold, asserted against the LABELS only.
          # Not the whole page: the Manglik panel carries an honest prose line
          # naming Jataka Parijata and Phaladeepika as the texts Rao's rule-set
          # compiles from, which is a disclosed gap (#216), not a false claim.
          labels=$(grep -oE 'yoga-source[^>]*>Source: [^<]{0,120}' /tmp/kundli.html || true)
          for book in "Brihat Parashara" "BPHS" "Phaladeepika" "Jataka Parijata"; do
            hits=$(printf '%s' "$labels" | grep -ci "$book" || true)
            echo "  label cites $book: $hits (want 0)"
            [ "$hits" -eq 0 ] || { echo "::error::#216 regressed — a yoga source label cites $book, which is not in data/"; exit 1; }
          done

          # Positive: the labels name the book we DO hold, with a section.
          rao=$(printf '%s' "$labels" | grep -cE 'Rao, Vedic Astrology: An Integrated Approach §[0-9]' || true)
          echo "  labels citing Rao with a section: $rao (want >0)"
          [ "$rao" -gt 0 ] || { echo "::error::#218 regressed — no label cites Rao with a section"; exit 1; }

      # CLOSE THE LOOP. This step is the last mile of the whole system.
      #
      # close-on-evidence.yml listens for this workflow's `workflow_run`
      # completion — but GitHub does not emit that event when the run was
      # started with GITHUB_TOKEN, which is exactly how `agent-merge` starts it
      # after an autonomous merge. Measured 2026-10-09, same commit both ways:
      #
      #   dispatched by agent-merge (GITHUB_TOKEN)  37887912818  success  -> nothing
      #   dispatched by a user token               37890955328  success  -> fired
      #
      # So the verification happened and nothing consumed it. #268 and #304 both
      # had to be closed by hand, having satisfied every condition.
      #
      # A `workflow_dispatch` IS exempt from the guard — that is why agent-merge
      # can start this run at all — so dispatching the next workflow from here
      # works where reacting to it does not.
      #
      # ONLY on `workflow_dispatch`. A `push`-triggered run emits its
      # `workflow_run` normally, and dispatching as well would run
      # close-on-evidence twice on the same commit. It is idempotent (it skips
      # any issue not OPEN), but two runs per commit is noise that hides signal.
      # `schedule` is excluded for the same reason it is excluded in
      # close-on-evidence itself: a drift run says production satisfies the
      # invariants now, not that a particular commit shipped.
      #
      # success() so a red verification closes nothing, which is the point.
      - name: Hand the verdict to close-on-evidence
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh workflow run close-on-evidence.yml --repo "$GH_REPO" \
               --ref main -f sha="$GITHUB_SHA"; then
            echo "::notice::dispatched close-on-evidence for ${GITHUB_SHA:0:7}"
          else
            echo "::warning::could not dispatch close-on-evidence for ${GITHUB_SHA:0:7}. Production IS verified; nothing will close the issue. Run it by hand: gh workflow run close-on-evidence.yml --ref main -f sha=$GITHUB_SHA"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production verification"
            echo ""
            echo "Site: \`$SITE\` · commit \`${GITHUB_SHA:0:7}\` · event \`${GITHUB_EVENT_NAME}\`"
            echo ""
            case "${DEPLOY_GATE:-unknown}" in
              exact)
                echo "**Deploy gate: exact.** \`/health\` reported \`build_sha\` matching"
                echo "\`${GITHUB_SHA:0:7}\` on revision \`${DEPLOY_REV:-?}\`, so a green run below means"
                echo "**this commit is the revision serving**." ;;
              revision-changed)
                echo "**Deploy gate: revision-changed (weaker).** A new Cloud Run revision"
                echo "(\`${DEPLOY_REV:-?}\`) is serving, but \`build_sha\` is null, so this run"
                echo "**cannot prove that revision is this commit's** — only that *a* deploy landed."
                echo ""
                echo "Upgrade to exact proof by adding \`--set-env-vars=BUILD_SHA=\$COMMIT_SHA\` to the"
                echo "GCP-side Cloud Build trigger. No change to this repo is required." ;;
              not-a-deploy)
                echo "**Deploy gate: skipped** — scheduled drift run, nothing was deployed."
                echo "Green means production satisfies these invariants **now**, whoever deployed last." ;;
              timeout)
                echo "**Deploy gate: TIMED OUT.** No new revision appeared, so the assertions were"
                echo "not run against a confirmed deploy. Treat this run as inconclusive, not green." ;;
              *)
                echo "**Deploy gate: did not report** (the wait step failed before recording a tier)." ;;
            esac
            echo ""
            echo "Smoke sweep: \`${SMOKE_STATUS:-did not report}\` · assertion steps read a"
            echo "single fetch of each page — see the workflow header."
          } >> "$GITHUB_STEP_SUMMARY"
