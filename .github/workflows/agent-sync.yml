# The syncup: the only place the loops see each other.
#
# Eight teams run on separate schedules and share nothing. Analytics scores a
# page while Growth files an issue to rewrite it; Research proves a rule
# unsourced while Engineering ships a feature built on it. Nothing in the
# architecture notices. This does.
#
# It must end in decisions, escalations or closures. A sync that produces a
# summary is a meeting, and GROWTH_LOG.md stopping after four cycles with nobody
# noticing for ten weeks is what that costs.
name: Agent sync

on:
  schedule:
    - cron: "0 18 * * 5"   # Fridays, 23:30 IST — after the week's loops have run
  workflow_dispatch:

concurrency:
  group: agent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read       # reads each loop's run history
      # Required by claude-code-action for its GitHub App auth. Without it the
      # step fails three times with "Could not fetch an OIDC token" before the
      # agent runs at all — which killed the first agent-prioritise dispatch.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-groups

      # What each loop actually did this week, as evidence rather than memory.
      - name: Gather the week
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "## Loop runs, last 7 days"
            gh run list --limit 60 --json workflowName,conclusion,createdAt \
              --jq '.[] | select(.workflowName|startswith("Agent")) | "\(.createdAt[0:10])  \(.workflowName)  \(.conclusion)"'
            echo
            echo "## Merged this week"
            git log origin/main --oneline --since="7 days ago"
            echo
            echo "## Issues touched"
            gh issue list --state all --limit 100 --json number,title,updatedAt,labels \
              --jq '.[] | select(.updatedAt > (now - 604800 | todate)) | "#\(.number) \(.title[0:60])"'
          } > /tmp/week.txt
          cat /tmp/week.txt

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /sync

            /tmp/week.txt holds this week's loop runs, merges and touched
            issues. Read .claude/commands/sync.md and follow it exactly.

            Read from the issue trail, not from memory. AGENT_STATUS.md is
            gitignored and BACKLOG.md has run six weeks stale — neither is
            evidence. `gh issue view N --comments` is.

            You are looking for four things, in descending cost:
              a contradiction   Research says a rule is unsourced while Growth
                                promotes the feature built on it → escalate
              duplicated work   two issues, one root cause, two loops → merge
              a broken chain    blocked on something nobody is doing; blocked at
                                two consecutive syncs is a planning defect
              a thesis that missed   shipped, scored, moved nothing — say whether
                                the IDEA was wrong or the EXECUTION was, because
                                those have opposite remedies

            Most escalations are already answered by the standing rulings in
            .claude/agents/chief.md — the objective, the canonical lineage
            table, authenticity-versus-traffic. Check those and quote the clause
            before escalating; escalating something already ruled on burns one of
            the three this cycle allows.

            WRITE THE SYNC RECORD TO /tmp/report.md, in the SYNC_LOG.md block
            format from sync.md: decisions, escalated, missed, blocked-twice,
            carried. Short and comparable week to week — a log that reads like
            minutes will not be read by the next sync, which is its only reader.

            **Audit the week's closures.** Since 2026-10-08 two things close
            issues without a human: close-on-evidence.yml, and project-manager
            in /prioritise. Nobody checks them, so you do:

              gh issue list --state closed --limit 40 --json number,title,closedAt,comments

            For each closed in the last 7 days, confirm its closing comment
            carries real evidence — a command and its output, or the three facts
            close-on-evidence requires. A closure whose comment says "fixed" and
            nothing else is exactly the #143 failure returning, and it is cheap
            to undo: say so in the sync record and reopen it.

            End in decisions, escalations or proposed closures. You do not close
            issues yourself — /prioritise does that. Nobody pushes.
          claude_args: |
            --max-turns 60
            --effort high
            --allowedTools "Read,Write,Glob,Grep,TodoWrite,Bash"
            --disallowedTools "Bash(rm:*),Bash(sudo:*),Bash(gcloud:*),Bash(gh secret:*),Bash(gh repo:*),Bash(gh issue close:*)"

      - name: Publish the sync record
        if: always()
        run: |
          if [ -s /tmp/report.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/report.md
          else
            echo "### No sync record written — treat this run as having produced nothing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect for persistence
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -f /tmp/report.md /tmp/out/report.md 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: /tmp/out
          if-no-files-found: ignore

  persist:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sync-report
          path: /tmp/out
        continue-on-error: true
      - name: Commit the report
        run: |
          [ -s /tmp/out/report.md ] || { echo "nothing to persist"; exit 0; }
          mkdir -p measurements/sync
          stamp=$(date -u +%Y-%m-%d)
          cp /tmp/out/report.md "measurements/sync/$stamp.md"
          cp /tmp/out/report.md measurements/sync/latest.md
          git config user.name  "shubhagya-agent"
          git config user.email "agent@users.noreply.github.com"
          git add measurements/sync/
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "sync report $stamp

          measurements/** is on the Cloud Build trigger's ignoredFiles, so this
          does not deploy."
          git push origin HEAD:main
