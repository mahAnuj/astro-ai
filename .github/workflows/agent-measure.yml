# The analyst's daily run. Reads GA4 and Search Console, scores what shipped,
# and writes findings onto the issues that claimed them.
#
# This is the loop that closes the circuit. Without it the other teams ship
# forever and never learn whether any of it worked — and this backlog is
# already full of work whose effect was never established.
#
# Runs before the delivery cycle so project-manager ranks against today's
# numbers rather than yesterday's.
name: Agent measure

on:
  schedule:
    - cron: "0 21 * * *"   # 02:30 IST — two hours ahead of agent-work
    # COLLECTORS WHEN A CYCLE FINISHES, NOT ON A CLOCK (2026-11-09).
    #
    # Until this date seven collector slots sat here: 02:00 (so a cycle's own
    # outcome landed the same day, measured 2026-10-14) and every three hours
    # from 05:00 (#353, the team panel's only freshness lever). Measured
    # 2026-11-05..09, GitHub's cron throttling delivered about FOUR runs a day
    # at irregular times -- the 21:00 analyst slot itself started 00:09-01:20Z.
    # And what the collectors describe (loop outcomes, agent health, the Claude
    # quota `chain_cycle.py` gates on) changes when a CYCLE finishes, not on
    # the hour. So they now run on `agent-work` completing, debounced by
    # `scripts/measure_due.py` (not within 60 min of the last measurement, and
    # not while the previous measurement PR is still open -- #800/#805 stacked
    # that way). Both reasons the old slots existed are served better: a
    # cycle's outcome lands minutes after it, and the panel is fresh whenever
    # the loop is moving.
    #
    # ONE clock slot stays, collectors only, as the backstop for a day on which
    # no cycle runs: without it an idle loop would leave claude_usage.json to
    # go stale past chain_cycle's 36h limit and agents.json past the
    # detector's 32h. Off the hour, because :00 slots are the most throttled.
    - cron: "23 9 * * *"
  workflow_run:
    workflows: ["Agent work"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: agent-measure
  # NOT cancellable since 2026-11-09. With a run on every cycle completion, a
  # collectors-only run arriving during the analyst's ~6 minutes would have
  # CANCELLED the analyst. Queued instead: GitHub keeps one pending run per
  # group, and a later pending one replaces it, which is the right coalescing.
  cancel-in-progress: false

jobs:
  measure:
    # Skipped on the 02:00 collectors-only slot. `commit` is `if: always()` and
    # so still runs — that is what makes the second slot cost one cheap job
    # rather than a second analyst invocation against the 5 h rolling cap.
    #
    # An ALLOW-LIST, not a deny-list. It was `!= '0 2 * * *'` while there was
    # one collectors-only slot; with seven, a deny-list is a line that has to be
    # edited every time a slot is added and whose failure mode is silent --
    # a forgotten entry runs the analyst six extra times a day against the
    # Claude 5 h rolling cap this repo has already exhausted once, and both runs
    # go green. Stated the other way round, anything unlisted fails safe.
    #
    # A `workflow_dispatch` carries no `github.event.schedule` at all, so the
    # empty comparison is what lets a manual run do the full measurement. That
    # is the intent: a human asking for a measurement wants the analyst, not
    # just a recount.
    #
    # `workflow_dispatch` BY NAME since 2026-11-09. The old condition was
    # `github.event.schedule == ''`, which a `workflow_run` event also matches
    # -- so adding the cycle-completion trigger without this change would have
    # run the analyst after EVERY cycle, up to ~20 times a day.
    # LOOP PAUSE (#903): set the repository variable LOOP_PAUSED=true to skip
    # every Claude-spending loop job; delete it (or set anything else) to resume.
    if: vars.LOOP_PAUSED != 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read       # read-only: the analyst never edits code
      issues: write        # it writes findings and scores onto issues
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # enable-cache MUST be an explicit false. The action defaults to `auto`,
      # which turns caching on for hosted runners, so merely deleting
      # `enable-cache: true` left it on — and its POST step kept exiting 2 while
      # pruning, failing a job whose every real step had passed. agent-merge
      # gates on this workflow concluding success, so that flake would block
      # every agent PR after the work was already done.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv sync --all-groups

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/89117619584/locations/global/workloadIdentityPools/github/providers/astro-ai
          service_account: agent-analytics@bhagya-500701.iam.gserviceaccount.com

      # Fetch first, as data, so the agent reads numbers rather than calling an
      # API mid-reasoning — and so a 403 fails here with a clear message instead
      # of halfway through a cycle.
      # The app's own LLM usage: cache hits and tokens per route, from the GCS usage
      # doc. HERE because this is the only job with GCS credentials; written
      # straight into /tmp/measure so the commit job's `cp /tmp/measure/*.json`
      # carries it to measurements/llm-usage.json with the GSC/GA4 files. The
      # detector raises cache-low / token-ceiling from it (owner, 2026-11-06:
      # "monitor the cache usage and see if it can increase the caching").
      # continue-on-error: a GCS read failure must never cost the analyst's run.
      - name: Snapshot the app's LLM usage
        continue-on-error: true
        env:
          BHAGYA_STORAGE_BUCKET: shubhagya-cache-us
        run: |
          mkdir -p /tmp/measure
          uv run python scripts/collect_llm_usage.py --out /tmp/measure/llm-usage.json \
            || echo "::warning::LLM usage not snapshotted; measurements/llm-usage.json is the previous one"

      - name: Pull the numbers
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          uv run python scripts/fetch_gsc.py --days 28 --band > /tmp/gsc-band.json
          uv run python scripts/fetch_gsc.py --days 28        > /tmp/gsc-all.json
          uv run python scripts/fetch_ga4.py --days 28        > /tmp/ga4.json
          # The series and the two trend reports (#344). Each is one more API
          # call against the same token; none of them changes the three files
          # above, which the analyst's prompt already reads by name.
          #
          # These exist because "daily users" and "trending pages" were believed
          # to need a history store. They do not: GSC keeps 16 months and GA4
          # returns a `date` dimension on request, so the series was always
          # one query away. Measured 2026-10-14: 97 days of GA4 back to
          # 2026-06-28, which is when the property started collecting.
          uv run python scripts/fetch_ga4.py --days 28 --daily        > /tmp/ga4-daily.json
          # GA4 event counts, including `cta_click` (#782; the flag is #785).
          # NON-FATAL, unlike the lines above: it has never run against the
          # live property, and the split it asks for needs custom dimensions the
          # owner has to register. A failure leaves the file absent with a
          # warning, which the analyst is told to read as "not measured", rather
          # than failing the whole measurement run.
          uv run python scripts/fetch_ga4.py --days 28 --events > /tmp/ga4-events.json \
            || { echo "::warning::GA4 event export failed; /tmp/ga4-events.json is absent this run (#782)"; rm -f /tmp/ga4-events.json; }
          uv run python scripts/fetch_gsc.py --days 28 --by date      > /tmp/gsc-daily.json
          uv run python scripts/fetch_gsc.py --days 28 --trend --by page  > /tmp/gsc-trend-page.json
          uv run python scripts/fetch_gsc.py --days 28 --trend --by query > /tmp/gsc-trend-query.json
          {
            echo "### Window"
            jq -r '.window | "\(.[0]) to \(.[1])"' /tmp/ga4.json
            echo "- band queries (6-20): $(jq '.rows | length' /tmp/gsc-band.json)"
            echo "- landing pages: $(jq '.rows | length' /tmp/ga4.json)"
            echo "- daily series: $(jq '.days_with_traffic' /tmp/ga4-daily.json) of $(jq '.days' /tmp/ga4-daily.json) days with traffic"
            echo "- biggest page move: $(jq -r '.rows[0] | "\(.page) \(.impressions_prev) -> \(.impressions)"' /tmp/gsc-trend-page.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Act as the `analyst` agent. Follow .claude/agents/analyst.md exactly.

            The data is already fetched — read these, do not re-call the APIs:
              /tmp/gsc-band.json         the 6-20 position band, ranked by opportunity
              /tmp/gsc-all.json          all queries in the window
              /tmp/ga4.json              landing pages, sessions, bounce, pages/session
              /tmp/gsc-daily.json        site-level clicks/impressions per day
              /tmp/ga4-daily.json        site-level sessions per day
              /tmp/gsc-trend-page.json   per-page change, this window vs the previous one
              /tmp/gsc-trend-query.json  per-query change, this window vs the previous one
              /tmp/ga4-events.json       GA4 event counts incl. cta_click (#782); may be absent
            All eight are written by the fetch step above (the events file only when its
            export succeeded; absent means not measured, never zero). Until 2026-11-06 this list
            named only the first three, and runs reported decay as "not determinable"
            while the trend files sat unread on disk.

            Do, in order:
            1. Report the band against OBJECTIVE.md. Name the window on every number.
            2. Score issues closed in the last 45 days that carried a `thesis:` and a
               `metric:`. Report the misses exactly as prominently as the hits — a
               ship that moved nothing is the most useful finding you produce.

               SCORE ONCE, WHEN THE WINDOW IS CLEAN — never re-post (2026-11-06).
               The fetch reads ONE trailing 28-day window ending 3 days ago and cannot
               split a page at its deploy date (#490). So a window that still contains
               the deploy mixes before and after, and is not a score. Until then, #311,
               #276 and #329 each collected 20+ near-identical "MISS so far" /
               "INCONCLUSIVE" comments, one a night, and #311 would have left the
               28-day list days before its clean window existed.
               - A window is CLEAN when its start (today - 31 days) is on or after the
                 deploy date (the merge to main). Before that, post ONE comment on the
                 issue, "pending — scoreable from <deploy + 31 days>", if no such note
                 is there yet, and otherwise post nothing.
               - Once clean: post predicted, actual, verdict ONCE. On later runs post
                 again only if the verdict changes or the number moves past what the
                 metric calls material. An unchanged verdict goes in /tmp/report.md,
                 not on the issue.
               - If the metric's sample floor cannot be reached at current traffic
                 (for example, it needs at least 10 sessions and the page gets 3 in 28
                 days), post ONCE "unscoreable at this traffic: <n> vs <floor>", and
                 stop scoring that issue.
               Read your own earlier comments on an issue before you write anything on
               it.
            3. Name your confounds before any delta: concurrent ships (git log
               origin/main --since), seasonality, and whether the page was even
               working — #253 served a stale stylesheet for weeks and #266 fails
               intermittently under the Groq TPM ceiling. Traffic to a broken page is
               not engagement.
            4. File issues only for findings that need action, with an Evidence Block.

            5. WRITE YOUR FULL REPORT TO /tmp/report.md. This is not optional.
               In automation mode nothing you say reaches a human — the run log
               carries the prompt and the cost, not your reasoning. A report that
               exists only in your context did not happen, and an unattended loop
               whose output nobody can read is indistinguishable from one that
               did nothing.

               Markdown, with a table per section and the window on every number.

            You are read-only on code. Never report a number you did not read from
            those files this run. Say what you could not determine.
          # WITHOUT THIS THE AGENT CAN DO NOTHING. In automation mode a
          # plain-text prompt grants no tools at all. The first real run proved
          # it: 7 turns, permission_denials_count 4, unable to read the JSON it
          # had just been handed or to run `gh` — and the step still concluded
          # success. A loop that looks like it ran is the worst failure shape
          # available to an unattended system.
          #
          # Scoped to the analyst's remit: read files, query git and gh, comment
          # and file issues. No Write, no Edit — read-only on code by definition.
          claude_args: |
            --max-turns 60
            --effort high
            # Bash is granted broadly and Write is allowed for the report. The
            # guardrail is the JOB's `contents: read` permission, not the tool
            # list: the analyst cannot push, cannot open a PR, and cannot reach
            # main whatever it runs. Enumerating shell verbs instead produced 12
            # denials on the previous run — it was blocked on things like `ls`
            # and `date` — and a half-blocked agent burns turns discovering what
            # it may not do.
            --allowedTools "Read,Write,Glob,Grep,TodoWrite,Bash"

      # Without this the work is invisible. The run log holds the prompt and the
      # cost, never the findings.
      - name: Publish the report
        if: always()
        run: |
          # tee, not plain redirect. A job summary is readable in the browser
          # and NOWHERE else — the REST API does not expose it — so a redirect
          # leaves the run uncheckable from a script, which is how this loop is
          # actually monitored.
          if [ -s /tmp/report.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/report.md
          else
            MSG="### No report written
          The analyst produced no /tmp/report.md. Treat this run as having produced nothing, whatever its exit status."
            echo "$MSG" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Persisted so the other loops plan from this analysis instead of
      # re-deriving it. NOT committed to the repo: data/ is gitignored, and more
      # importantly a push to main triggers a Cloud Build deploy of the live
      # site — a nightly measurement must not redeploy production. The analyst
      # is contents:read for the same reason.
      - name: Persist the measurement
        if: always()
        run: |
          mkdir -p /tmp/measure
          cp -f /tmp/report.md /tmp/measure/report.md 2>/dev/null || true
          cp -f /tmp/gsc-band.json /tmp/gsc-all.json /tmp/ga4.json \
                /tmp/gsc-daily.json /tmp/ga4-daily.json \
                /tmp/gsc-trend-page.json /tmp/gsc-trend-query.json /tmp/measure/ 2>/dev/null || true
          cp -f /tmp/ga4-events.json /tmp/measure/ 2>/dev/null || true
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/measure/generated-at.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement
          path: /tmp/measure
          retention-days: 90

  # A SEPARATE JOB, with no agent in it. The analyst stays contents:read, so no
  # agent in this system can write to the repository — only this shell step can,
  # and only under measurements/.
  #
  # Pushing here does not deploy: the Cloud Build trigger
  # rmgpgab-bhagya-asia-south1-mahAnuj-astro-ai--mapzk carries
  # ignoredFiles: measurements/**, so a push touching only that path builds
  # nothing. A mixed push still deploys, which is correct.
  commit:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the branch push
      # #393: the report now lands on `main` through a PULL REQUEST, because
      # `main` requires one. `pull-requests: write` opens it and enables
      # auto-merge; `actions: write` dispatches pr-gates and verify-build,
      # which is what makes the two required checks report at all -- a PR
      # opened with GITHUB_TOKEN emits no `pull_request` event (#322).
      pull-requests: write
      actions: write
      # The next step reads other workflows' runs and their job logs
      # (`actions/...`) and looks pull requests up (`pulls/...`) with `gh api`
      # INSIDE a script, which scripts/verify_workflows.py cannot see. The
      # endpoint -> scope table is in that script's header; a test pins this
      # block against it. An omitted scope is `none`, so leaving either out
      # reads as a 403 and the step would write nothing, quietly.
      issues: read           # `gh issue list` in the backlog collector below
    steps:
      - uses: actions/checkout@v4
      # Is a refresh due? Always for a scheduled or dispatched run; for a
      # `workflow_run` (a cycle finished), not within 60 min of the last
      # measurement and not while the previous measurement PR is open
      # (scripts/measure_due.py, 2026-11-09). A step in THIS job, not a job of
      # its own: a new job inherits the workflow's permissions, which
      # verify_workflow_permissions.py rightly refuses to judge. Every later
      # step is gated on it.
      - name: Is a refresh due
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/measure_due.py
      - uses: actions/download-artifact@v4
        if: steps.due.outputs.due == 'true'
        with:
          name: measurement
          path: /tmp/measure
        continue-on-error: true

      # #338: what the delivery loop produced and what the team costs, as data
      # the /admin/ops page can fetch. Deterministic Python, zero LLM calls.
      #
      # BEFORE the report check below, on purpose: that check exits 0 when the
      # analyst wrote no report, and a collector placed after it would be
      # skipped on exactly the days the loop is least healthy. And
      # continue-on-error, so a GitHub API hiccup can never stop the analyst's
      # own report being committed. A failure leaves the previous file standing
      # (the script writes nothing when its document does not validate).
      - name: Collect loop measurements
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_loop_measurements.py --out measurements \
            || echo "::warning::loop measurements not refreshed; measurements/loop.json is the previous one"

      # #335: the open backlog, with a derived area/type/priority, so the ops
      # page can render it without calling the GitHub API per request — Cloud
      # Run's egress IP is shared and an unauthenticated call would start
      # failing at 60/hour for reasons invisible to the owner.
      - name: Collect the issue backlog
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_issue_backlog.py --repo "$GH_REPO" --out measurements/issues.json \
            || echo "::warning::backlog not refreshed; measurements/issues.json is the previous one"

      # #345: is each loop alive, is it producing, and which agent is failing.
      # Runs AFTER the loop collector because it reads measurements/loop.json
      # for the delivery yield rather than recomputing it — two files
      # disagreeing about how many cycles shipped is worse than one file saying
      # nothing. continue-on-error for the same reason as the others.
      - name: Collect agent performance
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_agent_performance.py --repo "$GH_REPO" --out measurements/agents.json \
            || echo "::warning::agent performance not refreshed; measurements/agents.json is the previous one"

      # 2026-11-03 (owner): how close the loop runs to its ONE Claude Max
      # subscription. Read from the `rate_limit_info` blocks claude-code-action
      # already logs, both windows: measured that day, five-hour ~4% but
      # SEVEN-DAY 69%, so the weekly window is the one that binds. Whether more
      # parallel cycles are affordable is decided from this file. Needs
      # `actions: read` for job logs, which this job's `actions: write` covers.
      # continue-on-error like its siblings; it writes nothing it cannot parse.
      - name: Collect Claude usage
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_claude_usage.py --repo "$GH_REPO" --out measurements/claude_usage.json \
            || echo "::warning::Claude usage not refreshed; measurements/claude_usage.json is the previous one"

      # 2026-11-09: which tests fail on the open PRs' gates. One test red on two
      # PRs with unrelated diffs is a defect on `main`; the detector raises
      # `main-red-suspected` from this file and the lessons step below carries
      # it. #797 left seven PRs red on one test overnight and nothing linked
      # them. Actions API and the open-PR list only -- scopes this job holds.
      # BEFORE "Collect lessons", which runs the detector over these files.
      - name: Collect gate failures
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_gate_failures.py --repo "$GH_REPO" --out measurements/gate_failures.json \
            || echo "::warning::gate failures not refreshed; measurements/gate_failures.json is the previous one"

      # The lessons ledger (owner, 2026-11-06: agents should "learn what they did
      # but not helped" and "learn from other competitors"): our QA FAILs by theme,
      # reverts, failed production checks, the analyst's verdicts, competitor
      # patterns, current ops findings. AFTER the other collectors, because it
      # runs the ops detector over the files they just wrote. No LLM.
      - name: Collect lessons
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/collect_lessons.py --repo "$GH_REPO" --out-dir measurements \
            || echo "::warning::lessons not refreshed; measurements/lessons.md is the previous one"

      # #393: the PR opened below must NOT be authored by `github-actions[bot]`.
      # Since 2026-06-11 GitHub holds the `pull_request` runs of a PR that bot
      # opens in `action_required`, and while one held suite sits on the head
      # SHA it reports NO status rollup for the PR AT ALL -- measured on #477
      # and #478, where `gates` and `build-gates` were green on the SHA, the
      # rollup was null for nine minutes, and auto-merge never fired. There is
      # no setting that disables it; the fork-PR approval policy was tested at
      # its loosest value and made no difference. A GitHub App token is
      # GitHub's own documented remedy, and this repo already demonstrates it:
      # `claude[bot]`'s PRs have never been held.
      #
      # `continue-on-error` plus the `||` below is what keeps a missing or
      # expired key from being WORSE than the bot: the publish still happens on
      # `github.token`, the checks are held, and someone approves them by hand
      # -- exactly today's behaviour, rather than a failed step and a
      # dashboard that silently stops moving.
      - name: Mint a publisher token
        if: steps.due.outputs.due == 'true'
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}

      - name: Commit the measurement
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p measurements
          stamp=$(date -u +%Y-%m-%d)
          # Only the analyst's own files are conditional on a report existing.
          # The loop and cost files above are committed either way.
          if [ -s /tmp/measure/report.md ]; then
            cp /tmp/measure/report.md "measurements/$stamp.md"
            cp /tmp/measure/report.md measurements/latest.md
            cp -f /tmp/measure/*.json measurements/ 2>/dev/null || true
          else
            echo "no report to persist"
          fi

          # THROUGH A PULL REQUEST (#393). This step ran
          # `git pull --rebase origin main && git push origin HEAD:main` until
          # 2026-10-21 and had been rejected on EVERY scheduled run since
          # 2026-10-15 -- `GH006: Protected branch update failed ... Changes
          # must be made through a pull request ... 2 of 2 required status
          # checks are expected`. ~40 runs, all red, while /admin/ops went on
          # presenting 2026-10-14's numbers as today's. The loop whose job is
          # to report what is broken was the thing that was broken, and a file
          # that cannot be written does not announce itself -- it just stops
          # moving (#345 found the same circularity from the other end).
          #
          # The rebase is gone with the push. It existed because the analyst
          # job takes minutes to hours while `main` moves underneath, and a
          # plain push of a stale checkout is a non-fast-forward. A pull
          # request has no such problem: GitHub merges it against `main` as it
          # is at merge time, not as it was at checkout.
          bash scripts/publish_measurements.sh \
            --path measurements --title "measurement"
