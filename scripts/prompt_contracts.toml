[prompts."rashifal_single.txt"]
include = ["plain-words-core"]
headings = ["{Rashi English} / {Rashi Sanskrit}"]

[[prompts."rashifal_single.txt".rules]]
id = "heading-line-first-no-preamble"
why = "llm._generate_rashifal_single builds this heading from _RASHI_ANCHORS; the card renderer expects it first."
all = ['Start with EXACTLY this line, no preamble']

[[prompts."rashifal_single.txt".rules]]
id = "one-rashi-only"
why = "Twelve independent calls; one that writes two readings poisons its own card."
all = ['Do NOT output any other rashi.s reading']

[[prompts."rashifal_single.txt".rules]]
id = "four-paragraphs-no-markup-in-the-body"
why = "Body shape."
all = ['4 short flowing paragraphs', 'no sub-headings, no bullets, no labels']

[[prompts."rashifal_single.txt".rules]]
id = "length-is-capped"
why = "Prompt still states a word range."
all = ['\d+-\d+ words of substantive content']

[[prompts."rashifal_single.txt".rules]]
id = "no-clock-times"
why = "ARCHITECTURE.md voice rules: one national text, local sunrise; a clock time is wrong for nearly every reader (measured 79-minute spread)."
all = ['DO NOT state any clock time', 'Never a clock time']

[[prompts."rashifal_single.txt".rules]]
id = "windows-are-named-from-the-user-message"
why = "Windows come from the supplied Panchang. Deliberately NOT anchored on what each window is for (doctrine; astro-auditor F8)."
all = ['use the named windows given in your user message']

[[prompts."rashifal_single.txt".rules]]
id = "no-markdown"
why = "reading_body renders raw under whitespace-pre-line; also enforced by a stripper in llm.py."
all = ['DO NOT use markdown']

[[prompts."rashifal_single.txt".rules]]
id = "no-planets-named"
why = "Plain-words rule."
same_line = ['DO NOT name specific planets', '\bSun\b', '\bMoon\b', '\bJupiter\b', '\bSaturn\b', '\bMercury\b', '\bMars\b', '\bVenus\b', '\bRahu\b', '\bKetu\b']

[[prompts."rashifal_single.txt".rules]]
id = "weekday-lord-by-quality-never-by-name"
why = "The day-varying signal that makes the twelve differ; naming the planet breaks the plain-words rule."
all = ['use the qualities, never the planet name']

[[prompts."rashifal_single.txt".rules]]
id = "no-houses-transits-or-technical-terms"
why = "Plain-words rule."
all = ['DO NOT reference houses, transits']

[[prompts."rashifal_single.txt".rules]]
id = "no-specific-event-predictions"
why = "Describe energies, not outcomes."
all = ['DO NOT predict specific events']

[[prompts."rashifal_single.txt".rules]]
id = "no-ai-no-hedge"
why = "Voice rule."
all = ['DO NOT mention\W{1,3}AI\W']

[[prompts."rashifal_single.txt".rules]]
id = "banned-opening-phrases-all-listed"
why = "The anti-convergence list: each entry is a real opening the page converged on. Dropping one re-admits it."
all = [
  'BANNED OPENING PHRASES',
  'Today, you may feel',
  'Today, you might feel',
  'As the day begins',
  'As today unfolds',
  'This is a day of',
  'Today brings',
  'You may feel a strong sense of',
  'You may find yourself',
]

[[prompts."rashifal_single.txt".rules]]
id = "banned-hedges-all-listed"
why = "Same, for the filler hedges."
all = [
  'BANNED HEDGES',
  'money matters need attention',
  'relationships bring both joy and challenges',
  'balance work and personal life',
  'focus on health today',
  'listen to your inner voice',
  'trust the process',
  'communication is highlighted',
  'important decisions await',
  'an old friend may reach out',
  'avoid unnecessary conflicts',
]

[[prompts."rashifal_single.txt".rules]]
id = "banned-filler-consider"
why = "Instruction-style filler."
all = ['consider taking up', 'consider planning', 'consider focusing', 'sentence starting with\W+consider']

[[prompts."rashifal_single.txt".rules]]
id = "never-predict-disaster-or-guaranteed-gains"
why = "Product safety (TONE block)."
all = ['NEVER predict disaster', 'NEVER promise guaranteed gains']

[[prompts."rashifal_single.txt".rules]]
id = "no-disclaimers"
why = "Voice rule."
all = ['No astrology disclaimers']

[[prompts."rashifal_single.txt".rules]]
id = "opening-style-hint-is-honoured"
why = "Coupled to llm.py: the per-rashi OPENING STYLE HINT is emitted in the user message."
all = ['opened per the OPENING STYLE HINT']
