# --- /ask --------------------------------------------------------------------

[prompts."ask.txt"]

[[prompts."ask.txt".rules]]
id = "answer-first"
why = "The most important rule in the file; without it every answer opens with throat-clearing."
all = ['FIRST sentence MUST directly answer']

[[prompts."ask.txt".rules]]
id = "answer-in-the-language-asked"
why = "Coupled to the language suffix appended at the END of this prompt (llm._LANG_SUFFIX): the sentence saying that suffix wins is what makes the two agree."
all = ['SAME language and script', 'explicit language instruction appears at the END of this prompt']

[[prompts."ask.txt".rules]]
id = "no-planets-named"
why = "Plain-words rule shared with the natal reading."
same_line = ['DO NOT name specific planets', '\bJupiter\b', '\bSaturn\b', '\bRahu\b', '\bMars\b', '\bSun\b', '\bMoon\b']

[[prompts."ask.txt".rules]]
id = "no-signs-or-house-numbers"
why = "Same rule, the other two thirds of it."
all = ['DO NOT name specific signs', 'DO NOT reference natal house numbers']

[[prompts."ask.txt".rules]]
id = "no-jargon"
why = "A Sanskrit or regional name smuggles the jargon back in."
same_line = ['DO NOT use jargon', 'Lagna lord', 'conjunction', 'aspect', 'Navamsa', 'Karaka']

[[prompts."ask.txt".rules]]
id = "no-classical-text-names"
why = "ARCHITECTURE.md voice rules: ask.txt bans book-and-chapter citations outright."
same_line = ['DO NOT cite classical texts by name', 'Phaladeepika', 'BPHS', 'Mansagari']

[[prompts."ask.txt".rules]]
id = "no-death-illness-or-exact-dates"
why = "Product safety."
all = ['DO NOT predict death, terminal illness']

[[prompts."ask.txt".rules]]
id = "no-promised-outcomes"
why = "Preserves the seeker's agency."
all = ['DO NOT promise outcomes']

[[prompts."ask.txt".rules]]
id = "astrology-cannot-name-countries-or-partners"
why = "States the limit so the model says it when asked where or whom."
all = ['CANNOT pinpoint specific countries']

[[prompts."ask.txt".rules]]
id = "length-is-capped"
why = "Prompt still states a word range and a hard ceiling (the seeker should read it in 30 seconds)."
all = ['\d+-\d+ words total', 'never beyond']

[[prompts."ask.txt".rules]]
id = "no-headings-no-bullets"
why = "The answer renders as plain paragraphs."
all = ['NO headings, NO bullet lists']

[[prompts."ask.txt".rules]]
id = "no-platitudes-no-recap"
why = "The CLOSING block: end on the last useful sentence."
all = ['NO platitudes', 'NO meta-questions', 'NO recap of the question']

[[prompts."ask.txt".rules]]
id = "cross-link-only-from-the-listed-slugs"
why = "A model told to link a guide will invent slugs unless told it may not."
all = ['Use ONLY these exact article slugs', 'do not invent slugs', 'Only ONE link per answer']

