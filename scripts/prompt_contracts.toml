# PROMPT CONTRACTS -- what each prompts/*.txt must still STATE. (#362 Part A1)
#
# Read by scripts/verify_prompt_contracts.py. One table row per prompt file;
# a prompt with no row is a FAILURE, not a skip. A row is DATA: adding a
# twelfth prompt is adding a [prompts."x.txt"] block here and nothing else.
#
# WHAT THIS ASSERTS: that a prompt still SAYS its own rule. It never asserts
# that the rule is astrologically correct -- nothing here adds a doctrine, and
# every pattern is read back from text already in the file.
#
# HOW A RULE MATCHES (all case-insensitive; TOML literal '...' strings, so
# backslashes are NOT doubled and a regex may not contain a single quote --
# write \W or . for an apostrophe):
#   all       every regex must match somewhere in the file
#   same_line one single line must match every regex (list-shaped rules: the
#             nine planet names, the avoid-list -- losing ONE entry is the loss
#             a file-wide search cannot see)
#   forbid    NO regex may match (a sibling prompt's framing leaking in)
#   PIN: a rule with all/same_line must have one pattern that lands on exactly
#   ONE line, so deleting that instruction cannot be masked by the same words
#   surviving elsewhere (verify_natal_prompt's sade-sati anchors had this flaw).
#
# Do NOT anchor, and do not add an anchor for: the Uttam/Madhyam/Avara bands, the
# "below 18" threshold, "Rahu Kaal for holding off", the seven tithi characters,
# an absolute "Nadi has no cancelling conditions", or any /learn/ slug. Each is on
# astro-auditor's "Do not gate on these" list (#362 comment, 2026-10-17) or
# is a fact that belongs to another gate.
#
# Size is NOT here: scripts/verify_token_budget.py owns every ceiling. "Length"
# below means the prompt still STATES a word-count range, not which numbers.

# ---------------------------------------------------------------- shared groups

[groups.overlay]
why = "The three /ask overlays are appended to ask.txt (deps.py ASK_OVERLAY_PATHS)."

[[groups.overlay.rules]]
id = "overlay-adds-to-the-base-rules"
why = "Without it the model may read the overlay as REPLACING ask.txt's voice, honesty and cross-link rules."
all = ['\bOVERLAY\b', 'everything above still applies', 'nothing here relaxes']

[groups.matching-overlay]
why = "ask_matching.txt and ask_matching_third_party.txt carry one shared safety block; it must not drift between them (tests/test_nadi_position_coherence.py already caught that once)."

[[groups.matching-overlay.rules]]
id = "quote-the-computed-block-never-derive"
why = "A number that differs from the page the seeker just left reads as a broken product."
all = ['quote the total and the individual koota scores']

[[groups.matching-overlay.rules]]
id = "never-recalculate-a-koota"
why = "The engine owns every figure; a recalculated koota or re-added total contradicts the page."
all = ['never\s+recalculate\s+a\s+koota', 're-add the total']

[[groups.matching-overlay.rules]]
id = "no-score-for-a-koota-not-in-the-block"
why = "An unsupplied koota given a score is an invented figure."
all = ['koota is not in the block,? say nothing about its score']

[[groups.matching-overlay.rules]]
id = "cancelled-dosha-still-scores-zero"
why = "The counter-intuitive rule the model most wants to correct. A cancellation removes the DOSHA; it never restores the koota points (matching.py: points table only)."
all = ['cancelled\s+dosha\s+still\s+scores\s+zero', 'never\s+restores\s+the\s+koota.s\s+points']

[[groups.matching-overlay.rules]]
id = "do-not-correct-a-score-upward"
why = "Names the trap itself: writing that a score should be higher because a dosha was cancelled."
all = ['should\W{1,3}be higher because a dosha was cancelled']

[[groups.matching-overlay.rules]]
id = "reduced-nadi-dosha-still-scores-zero"
why = "A slight (alpa) Nadi dosha is a gradation of the dosha, not of the points."
all = ['reduced\s+Nadi\s+dosha\s+is\s+still\s+a\s+zero-scoring\s+Nadi']

[[groups.matching-overlay.rules]]
id = "no-invented-nadi-condition"
why = "Asserts only that the PROHIBITION survives. The Nadi position itself (exemptions clause) is pinned by tests/test_nadi_position_coherence.py and is deliberately not restated here."
all = ['never\s+invent\s+any\s+other\s+Nadi\s+condition']

[[groups.matching-overlay.rules]]
id = "unevaluated-parihara-is-said-not-assessed"
why = "matching.py _PARIHARA_UNEVALUATED: reporting an unevaluated remedy as absent is a false negative."
all = ['not evaluated\W{1,4}\s*say it was not assessed', 'do not report it as absent']

[[groups.matching-overlay.rules]]
id = "a-total-is-not-a-verdict"
why = "Stops the model turning a summary of eight tests into a decision about two people."
all = ['not a verdict on whether two people should be together', 'a high score is not a guarantee']

[[groups.matching-overlay.rules]]
id = "no-instruction-to-marry-or-not"
why = "Product safety: the reading never decides for the family."
all = ['do not tell anyone to marry', 'call it off', 'leave the decision theirs']

[[groups.matching-overlay.rules]]
id = "no-fatalism"
why = "Product safety: nothing and no one is called cursed, doomed or beyond help."
all = ['never describe\b.{0,40}\bcursed\b', '\bdoomed\b']

[[groups.matching-overlay.rules]]
id = "say-traditions-differ"
why = "Matching conventions are regionally scoped; the model must say so rather than imply one universal rule."
all = ['traditions differ']

[groups.plain-words-core]
why = "The Indian-reader plain-words avoid-list, shared by five prompts. natal.txt has the longer list in verify_natal_prompt.BANNED_WORDS."

[[groups.plain-words-core.rules]]
id = "plain-words-avoid-list-keeps-its-core"
why = "Dropping one entry from the list is exactly the loss a file-wide search misses."
same_line = ['SIMPLE WORDS', 'introspection', 'endeavour', 'manifest', 'navigate']

