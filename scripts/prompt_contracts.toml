[[prompts."ask_matching.txt".rules]]
id = "third-party-framing-must-not-leak"
why = "Mirror of first-party-framing-must-not-leak: telling a seeker who IS in the match that it is not theirs."
forbid = ['\bNOT one of the matched pair', 'address the seeker as though the score', 'third person about the couple']

[prompts."ask_numerology.txt"]
include = ["overlay"]

[[prompts."ask_numerology.txt".rules]]
