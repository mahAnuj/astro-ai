[[prompts."ask_numerology.txt".rules]]
id = "no-source-names"
why = "Voice rule: provenance belongs in the structured panels, not the conversation."
all = ['do not name numerology books, authors, or systems by name']

[[prompts."ask_numerology.txt".rules]]
