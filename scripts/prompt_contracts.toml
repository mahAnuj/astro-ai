[[prompts."ask_numerology.txt".rules]]
id = "two-systems-not-one"
why = "Stops the model presenting a number as chart-derived, or one system as confirming the other."
all = ['two systems, not one', 'never claim one causes or confirms']

[[prompts."ask_numerology.txt".rules]]
