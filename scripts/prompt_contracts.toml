why = "Sets the ordering of authority between the two systems."
all = ['chart is the primary reading']

[[prompts."ask_numerology.txt".rules]]
id = "quote-the-numbers-never-derive"
why = "A number the model derives independently contradicts the page (the reduction rules are specific)."
all = ['never compute a number yourself', 'never re-reduce a number']

[[prompts."ask_numerology.txt".rules]]
id = "an-absent-number-is-intentional"
why = "Name-derived numbers are deliberately omitted when a name cannot be scored; pointing it out or asking for another spelling breaks that."
