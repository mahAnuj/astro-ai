{#- Daily Rashifal email — sent at 7 AM IST to opted-in subscribers.

    Email-safe constraints (Gmail/Outlook/Apple Mail all reliable):
      - Tables for layout (NOT flex/grid)
      - Inline styles only (NO <style> blocks)
      - Web-safe fonts with system fallback
      - 600px max width — de-facto standard
      - No external CSS, no JS

    PALETTE (#239). Recoloured to the redesign tokens, which live in
    tailwind.config.js under theme.extend.colors.bhagya. The hexes are
    repeated literally here because they have to be — email clients strip
    <style>, so there is no stylesheet to reach them, and Tailwind never
    sees this file. That means the tokens and these literals can drift; if
    you change one, change the other. Roles used, and where:

      night   #140F1C  header band
      gold    #C8A44D  the logo's centre dot — gold is permitted ON NIGHT
                       ONLY (2.20:1 on cream), and the header is the only
                       night surface in the email
      cream   #FAF6EF  page + card fills + footer  (was #faf7f2)
      cream-2 #F1E7D8  header tagline, and the "did you know" panel
                       (was #f0e7fb, a near-duplicate of astro-50)
      sindoor #9E2B25  eyebrows, rashi glyphs, links, the panchang rule
      saffron #E4913C  the CTA fill, with ink #17131A text on it

    The amber family (#fef3c7 / #92400e / #fde68a) on the shlok and
    festival panels is deliberately untouched: it already reads warm
    against the new cream, and it is not one of the redesign tokens.

    Measured, since nothing checks inline email hexes automatically —
    scripts/verify_contrast.py reads Tailwind utilities out of the built
    CSS and cannot see this file:

      cream-2 on night     15.39:1     gold dot on night     7.96:1
      sindoor on cream      6.90:1     sindoor on white      7.43:1
      ink on saffron        7.35:1     white on night       18.84:1

    Note white on saffron is 2.50:1, which is why the CTA carries ink
    text rather than the white it used to have on purple.

    Sections (in render order):
      1. Branded night header band (logo + tagline)
      2. Date + Panchang strip (sunrise / Rahu Kaal / Abhijit / day colour) — ONLY if
         we have Panchang for the subscriber's city
      3. Festival callout — ONLY if today is a named festival or tithi-based observance
      4. All 12 rashi predictions
      5. Shlok of the day (graha-of-weekday from shloks.py)
      6. Did you know — Vedic-astrology trivia
      7. CTA back to the site
      8. Footer with unsubscribe (CAN-SPAM compliance)

    Template variables:
      lang             — 'en' | 'hi'
      today_iso        — '2026-06-27'
      today_pretty     — 'Saturday, 27 June 2026'
      panchang         — DailyPanchang | None  (None → skip Panchang strip)
      rashifal_sections — list of (glyph, title, teaser, body) tuples
      chandra_bala     — {rashi slug: (house, verdict)} from
                         muhurat.chandra_bala_by_rashi(); {} → skip the line
      shlok            — dict from shloks.shlok_for_date()
      festivals        — list of dicts from festivals.festivals_for_date(); [] if none
      trivia           — dict from trivia.trivia_for_date()
      site_url         — 'https://shubhagya.com'
      unsubscribe_url  — per-recipient HMAC-signed link
-#}
{# Tithi observance helper — show if tithi matches an observance entry. #}
{% set tithi_obs = none %}
{% if panchang %}
  {# Panchang doesn't yet expose tithi number; placeholder for when it does. #}
{% endif %}
<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if lang == 'hi' %}आज का राशिफल — Shubh Bhagya{% else %}Today's Rashifal — Shubh Bhagya{% endif %}</title>
</head>
<body style="margin:0;padding:0;background:#FAF6EF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;color:#1c1917;">
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#FAF6EF;">
  <tr>
    <td align="center" style="padding:20px 12px;">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e7e5e4;">

        {#- BRANDED HEADER BAND ─ night background, larger logo + tagline -#}
        <tr>
          <td style="background:#140F1C;padding:22px 28px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td style="vertical-align:middle;padding-right:12px;">
                  <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="display:block;">
                    <g fill="none" stroke="#ffffff" stroke-width="6">
                      <polygon points="50,5 95,50 50,95 5,50"/>
                      <line x1="50" y1="5" x2="50" y2="95"/>
                      <line x1="5" y1="50" x2="95" y2="50"/>
                      <polygon points="72.5,27.5 72.5,72.5 27.5,72.5 27.5,27.5"/>
                    </g>
                    <circle cx="50" cy="50" r="8" fill="#C8A44D"/>
                  </svg>
                </td>
                <td style="vertical-align:middle;">
                  <div style="font-size:24px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;line-height:1.1;">Shubh Bhagya</div>
                  <div style="font-size:12px;color:#F1E7D8;margin-top:2px;letter-spacing:0.5px;">
                    {% if lang == 'hi' %}आपका दैनिक वैदिक पञ्चांग{% else %}Your daily Vedic almanac{% endif %}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        {#- DATE + greeting -#}
        <tr>
          <td style="padding:22px 28px 4px 28px;">
            <div style="font-size:11px;color:#9E2B25;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;">
              {{ today_pretty }}
            </div>
            <h1 style="margin:8px 0 0 0;font-size:22px;font-weight:700;color:#1c1917;">
              {% if lang == 'hi' %}आज का राशिफल{% else %}Today's Rashifal{% endif %}
            </h1>
            <p style="margin:6px 0 0 0;font-size:13px;color:#57534e;line-height:1.5;">
              {% if rashifal_sections | length > 1 %}
                {% if lang == 'hi' %}सभी 12 राशियों का संक्षिप्त राशिफल। पूरी भविष्यवाणी पढ़ने के लिए लिंक पर क्लिक करें।{% else %}A quick preview for all 12 rashis. Tap any card to read the full prediction on Shubh Bhagya.{% endif %}
              {% else %}
                {% if lang == 'hi' %}आपकी जन्म राशि के लिए आज का पूरा राशिफल।{% else %}Today's full reading for your Janma Rashi.{% endif %}
              {% endif %}
            </p>
          </td>
        </tr>

        {#- PANCHANG STRIP — only renders if subscriber gave a city. -#}
        {% if panchang %}
        <tr>
          <td style="padding:18px 28px 0 28px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#FAF6EF;border-left:3px solid #9E2B25;border-radius:4px;">
              <tr>
                <td style="padding:12px 14px;">
                  <div style="font-size:11px;color:#9E2B25;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">
                    {% if lang == 'hi' %}आज का पंचांग{% else %}Today's Panchang{% endif %}
                  </div>
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td style="font-size:12px;color:#44403c;padding:2px 0;line-height:1.5;">
                        <strong>{% if lang == 'hi' %}सूर्योदय{% else %}Sunrise{% endif %}</strong>
                        {{ panchang.sunrise.strftime('%I:%M %p' if panchang.daylight_ordinary else '%d %b, %I:%M %p').lstrip('0') }}
                        &nbsp;·&nbsp;
                        <strong>{% if lang == 'hi' %}सूर्यास्त{% else %}Sunset{% endif %}</strong>
                        {{ panchang.sunset.strftime('%I:%M %p' if panchang.daylight_ordinary else '%d %b, %I:%M %p').lstrip('0') }}
                      </td>
                    </tr>
                    {#- Rahu Kaal and Abhijit are fixed fractions of the
                       sunrise-to-sunset period; `daylight_ordinary` is False
                       on a date that has no such period (chart.py, #227), and
                       the two rows below then carry an eighth and a fifteenth
                       of a span that does not exist.

                       This is the surface where that is worst. A subscriber
                       gave a city at signup and the blast computes panchang
                       per-city, so the wrong windows ARRIVE — not navigated
                       to, not refreshable, with no caveat anywhere near them.
                       And it is not a polar edge case: Reykjavik, a mainstream
                       capital south of the Arctic Circle, has 15 such dates in
                       2026 and none of them takes the loud degrade path.

                       ONE replacement row, not a disclosure card: there is no
                       room here for /panchang's explanation, and the failure
                       mode of a long apology in an email is that it is skipped.
                       Dropping the rows silently was rejected — the reader
                       would read the gap as "nothing to avoid today". The
                       sunrise/sunset row above keeps its times and gains their
                       DATES, which is what makes the two instants legible.
                       #228. -#}
                    {%- if panchang.daylight_ordinary %}
                    <tr>
                      <td style="font-size:12px;color:#44403c;padding:2px 0;line-height:1.5;">
                        <strong style="color:#b91c1c;">{% if lang == 'hi' %}राहु काल{% else %}Rahu Kaal{% endif %}</strong>
                        {{ panchang.rahu_kaal_start.strftime('%I:%M').lstrip('0') }}–{{ panchang.rahu_kaal_end.strftime('%I:%M %p').lstrip('0') }}
                        <span style="color:#b91c1c;font-size:11px;">({% if lang == 'hi' %}टालें{% else %}avoid{% endif %})</span>
                      </td>
                    </tr>
                    <tr>
                      <td style="font-size:12px;color:#44403c;padding:2px 0;line-height:1.5;">
                        <strong style="color:#15803d;">{% if lang == 'hi' %}अभिजित मुहूर्त{% else %}Abhijit Muhurta{% endif %}</strong>
                        {{ panchang.abhijit_start.strftime('%I:%M').lstrip('0') }}–{{ panchang.abhijit_end.strftime('%I:%M %p').lstrip('0') }}
                        <span style="color:#15803d;font-size:11px;">({% if lang == 'hi' %}शुभ{% else %}auspicious{% endif %})</span>
                      </td>
                    </tr>
                    {#- Day colour: the weekday-lord's colour, computed in
                       _WEEKDAY_LORDS and already shown on /today and /panchang.
                       It is here because the READING used to invent its own --
                       on 2026-10-24 the prose said "a small red stone" while
                       this value was "Blue or Black", so the product shipped two
                       different lucky colours on one day (#514). A field, not a
                       sentence: that is what stops it reading the same every
                       day, and the prompt no longer asks for one. -#}
                    {%- if panchang.day_color %}
                    <tr>
                      <td style="font-size:12px;color:#44403c;padding:2px 0;line-height:1.5;">
                        <strong style="color:#b45309;">{% if lang == 'hi' %}आज का रंग{% else %}Today's colour{% endif %}</strong>
                        {{ panchang.day_color }}
                        <span style="color:#78716c;font-size:11px;">({% if lang == 'hi' %}{{ panchang.day_lord }} का दिन{% else %}{{ panchang.day_lord }}'s day{% endif %})</span>
                      </td>
                    </tr>
                    {%- endif %}
                    {%- else %}
                    <tr>
                      <td style="font-size:12px;color:#44403c;padding:2px 0;line-height:1.5;">
                        <strong style="color:#b45309;">{% if lang == 'hi' %}सूर्योदय–सूर्यास्त अवधि नहीं।{% else %}No sunrise-to-sunset day.{% endif %}</strong>
                        {% if lang == 'hi' %}राहु काल और अभिजित मुहूर्त इसी अवधि के नियत भाग हैं, इसलिए आज इन्हें अनुमान से नहीं दिखाया गया।{% else %}Rahu Kaal and Abhijit Muhurta are each a fixed fraction of that period, so with none today they are left out rather than guessed.{% endif %}
                      </td>
                    </tr>
                    {%- endif %}
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endif %}

        {#- FESTIVAL CALLOUT — every named festival today, not just the first.
            `festivals` is a list; two can share a date (Makar Sankranti and
            Pongal on 2026-01-14) and a subscriber told only about one has been
            given wrong information about their own day. Empty list renders
            nothing. The header stays singular-block; only name+note repeat. -#}
        {% if festivals %}
        <tr>
          <td style="padding:14px 28px 0 28px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#fef3c7;border-left:3px solid #d97706;border-radius:4px;">
              <tr>
                <td style="padding:12px 14px;">
                  <div style="font-size:11px;color:#92400e;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">
                    🪔 {% if lang == 'hi' %}आज का पर्व{% else %}Today's Festival{% endif %}
                  </div>
                  {%- for festival in festivals %}
                  <div style="font-size:16px;font-weight:700;color:#1c1917;line-height:1.3;{% if not loop.first %}margin-top:10px;{% endif %}">
                    {{ festival['name_' + lang] if ('name_' + lang) in festival else festival['name_en'] }}
                  </div>
                  <div style="font-size:13px;color:#57534e;margin-top:4px;line-height:1.5;">
                    {{ festival['note_' + lang] if ('note_' + lang) in festival else festival['note_en'] }}
                  </div>
                  {%- endfor %}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endif %}

        {#- RASHIFAL CARDS — mode-aware rendering, no interactive accordion.
            Reason: <details>/<summary> is stripped by Gmail mobile and Outlook
            (the majority of Indian inboxes), rendering everything expanded by
            default. No cross-client HTML/CSS technique reliably solves this.

            Instead:
              - DIGEST mode (length > 1, default "all 12" subscriber): show
                only the 2-sentence teaser per rashi with a prominent
                "Read full reading →" deep link to /rashifal#<slug>.
              - SINGLE mode (length == 1, per-rashi subscriber): show the
                full body inline (teaser is redundant because the body
                already opens with those sentences). -#}
        {% set is_digest = rashifal_sections | length > 1 %}
        {% for glyph, title, teaser, body in rashifal_sections %}
        {% set rashi_slug = title.split('/')[0].strip().lower() %}
        <tr>
          <td style="padding:10px 28px 0 28px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#FAF6EF;border-radius:6px;">
              <tr>
                <td style="padding:14px 16px;">
                  {#- Header row: glyph + rashi name -#}
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                    <tr>
                      <td style="font-size:20px;color:#9E2B25;padding-right:8px;vertical-align:middle;width:28px;">{{ glyph }}</td>
                      <td style="font-size:15px;font-weight:600;color:#1c1917;vertical-align:middle;">{{ title }}</td>
                    </tr>
                  </table>

                  {#- Chandra Bala: today's Moon counted from THIS rashi (BPHS
                     houses 1,3,6,7,10,11 strong / 4,8,12 weak), computed in
                     muhurat.chandra_bala_by_rashi. The one field that varies on
                     both axes the prose failed on -- day to day, and across the
                     twelve on one day (#513, #514). Rendered only when the
                     verdict is non-empty: an unplaceable rashi shows nothing
                     rather than a guess. -#}
                  {%- set cb = (chandra_bala or {}).get(rashi_slug) %}
                  {%- if cb and cb[1] %}
                  {%- set cb_color = '#15803d' if cb[1] == 'strong' else ('#b45309' if cb[1] == 'weak' else '#78716c') %}
                  <div style="font-size:12px;color:#57534e;margin-top:6px;line-height:1.5;">
                    <strong style="color:{{ cb_color }};">{% if lang == 'hi' %}चंद्र बल{% else %}Chandra Bala{% endif %}</strong>
                    <span style="color:{{ cb_color }};">{% if lang == 'hi' %}{{ {'strong':'बलवान','neutral':'सामान्य','weak':'कमज़ोर'}[cb[1]] }}{% else %}{{ cb[1] }}{% endif %}</span>
                    <span style="color:#a8a29e;font-size:11px;">{% if lang == 'hi' %}(चंद्रमा {{ cb[0] }}वें भाव में){% else %}(Moon in house {{ cb[0] }} from this rashi){% endif %}</span>
                  </div>
                  {%- endif %}
                  {#- The day's verdict, same computation the reading was
                     written from (llm._gochara_block -> chart.gochara_for_rashi).
                     Raman's Gochara table, knowledge/vedic_reference.md §2A,
                     counted from this janma rashi. A count and a list, never a
                     summed score -- the classical table rates each graha
                     separately and gives no combined figure. -#}
                  {#- #523. The day's shape, scannable. Each figure counts
                     how many of that life area's KARAKAS transit favourably
                     from this rashi (knowledge/houses.md, Raman Ch. IV & VIII).
                     A count, never a score: Raman classifies each planet-house
                     pair and gives no aggregation rule, so four-and-a-half
                     stars would be an invented weighting wearing a citation.
                     Relationships is out of 2 because houses.md:217 gives the
                     7th karaka as "Venus (spouse for men), Jupiter (husband for
                     women)" and a Rashifal has no gender -- both are counted
                     rather than one silently chosen.
                     The same numbers go into the reading's own prompt, so the
                     prose cannot contradict the figures printed beside it. -#}
                  {%- set dd = (day_detail or {}).get(rashi_slug) %}
                  {%- if dd and dd.areas %}
                  <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:8px;">
                    <tr>
                      {%- for a in dd.areas %}
                      {%- set tone = '#15803d' if a.favourable == a.total else ('#b45309' if a.favourable == 0 else '#57534e') %}
                      <td style="padding:0 12px 0 0;font-size:12px;color:#78716c;line-height:1.5;white-space:nowrap;">
                        {% if lang == 'hi' %}{{ {'Work':'कार्य','Money':'धन','Relationships':'संबंध','Health':'स्वास्थ्य'}[a.area] }}{% else %}{{ a.area }}{% endif %}
                        <strong style="color:{{ tone }};">{{ a.favourable }}/{{ a.total }}</strong>
                      </td>
                      {%- endfor %}
                    </tr>
                  </table>
                  <div style="font-size:11px;color:#a8a29e;margin-top:4px;line-height:1.5;">
                    {% if lang == 'hi' %}प्रत्येक अंक बताता है कि उस क्षेत्र के कारक ग्रहों में से कितने आज आपकी राशि से शुभ गोचर में हैं। अंक जोड़े नहीं गए।{% else %}Each figure counts how many of that area's karaka grahas transit favourably from your rashi today. Not summed into a score.{% endif %}
                  </div>
                  {%- endif %}
                  {%- if dd and dd.remedy %}
                  <div style="font-size:12px;color:#57534e;margin-top:6px;line-height:1.5;">
                    <strong style="color:#b45309;">{% if lang == 'hi' %}आज का उपाय{% else %}Today's remedy{% endif %}</strong>
                    {{ dd.remedy.deed }}
                    <span style="color:#a8a29e;font-size:11px;">({% if lang == 'hi' %}{{ dd.remedy.planet_label }} {{ dd.remedy.house_ord }} भाव में{% else %}for {{ dd.remedy.planet }} in the {{ dd.remedy.house_ord }}{% endif %})</span>
                  </div>
                  {%- endif %}
                  {%- set gc = (gochara or {}).get(rashi_slug) %}
                  {%- if gc %}
                  {%- set g_color = '#15803d' if gc.favourable >= 6 else ('#b45309' if gc.favourable <= 1 else '#57534e') %}
                  <div style="font-size:12px;color:#57534e;margin-top:4px;line-height:1.5;">
                    <strong style="color:{{ g_color }};">{% if lang == 'hi' %}आज का गोचर{% else %}Today's Gochara{% endif %}</strong>
                    <span style="color:{{ g_color }};">{{ gc.favourable }}/{{ gc.total }}</span>
                    <span style="color:#a8a29e;font-size:11px;">{% if lang == 'hi' %}ग्रह अनुकूल{% else %}grahas transiting favourably{% endif %}</span>
                  </div>
                  {%- endif %}

                  {% if is_digest %}
                  {#- DIGEST: teaser-only + prominent deep link -#}
                  <div style="font-size:14px;color:#44403c;line-height:1.55;margin-top:8px;">
                    {{ teaser }}
                  </div>
                  <div style="margin-top:10px;">
                    <a href="{{ site_url }}/rashifal#{{ rashi_slug }}"
                       style="font-size:13px;color:#9E2B25;font-weight:600;text-decoration:none;">
                      {% if lang == 'hi' %}पूरा राशिफल पढ़ें{% else %}Read full reading{% endif %} &rarr;
                    </a>
                  </div>
                  {% else %}
                  {#- SINGLE rashi: full body inline (teaser is already its opening) -#}
                  {#- white-space:pre-line is load-bearing, not cosmetic: the generated
                      body carries ~6 newlines (3-4 paragraphs) and HTML collapses them,
                      so without this the single-rashi email is one unreadable wall of
                      text. The web card gets this from Tailwind's whitespace-pre-line;
                      email has no stylesheet, so it must be inline. -#}
                  <div style="font-size:14px;color:#44403c;line-height:1.55;margin-top:8px;white-space:pre-line;">
                    {{ body }}
                  </div>
                  <div style="margin-top:12px;">
                    <a href="{{ site_url }}/rashifal#{{ rashi_slug }}"
                       style="font-size:12px;color:#9E2B25;text-decoration:underline;">
                      {% if lang == 'hi' %}Shubh Bhagya पर देखें{% else %}Read on Shubh Bhagya{% endif %} &rarr;
                    </a>
                  </div>
                  {% endif %}
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endfor %}

        {#- SHLOK OF THE DAY — amber-accented, one per day of week (graha shlok).
            Amber, not the redesign's `gold` token: gold is night-only. -#}
        {% if shlok %}
        <tr>
          <td style="padding:24px 28px 0 28px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#fef3c7;border:1px solid #fde68a;border-radius:6px;">
              <tr>
                <td style="padding:16px 18px;">
                  <div style="font-size:11px;color:#92400e;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">
                    🕉 {% if lang == 'hi' %}आज का श्लोक · {{ shlok.graha_hi }}{% else %}Shlok of the Day · {{ shlok.graha_en }}{% endif %}
                  </div>
                  <div style="font-size:17px;color:#1c1917;font-style:italic;line-height:1.5;font-weight:600;">
                    {{ shlok.sanskrit }}
                  </div>
                  <div style="font-size:12px;color:#78716c;margin-top:4px;font-style:italic;">
                    {{ shlok.transliteration }}
                  </div>
                  <div style="font-size:13px;color:#57534e;margin-top:8px;line-height:1.55;">
                    — {{ shlok.meaning_hi if lang == 'hi' else shlok.meaning_en }}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endif %}

        {#- DID YOU KNOW — Vedic-astrology trivia, rotates daily. -#}
        {% if trivia %}
        <tr>
