{# Language selector — native HTML <select> that auto-submits on change.
   Caller provides `lang` (current language code). Scales to more languages
   later by adding <option> rows; no JS framework needed. #}
<form method="post" action="/lang" class="inline-flex items-center">
  <input type="hidden" name="next" value="{{ request.url.path }}">
  <select name="lang" onchange="this.form.submit()"
          class="bg-white border border-stone-300 rounded-md px-2 py-1 text-xs text-stone-700
                 hover:border-astro-400 focus:ring-2 focus:ring-astro-500 focus:border-astro-500
                 focus:outline-none cursor-pointer transition-colors"
          aria-label="Language">
    <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
    <option value="hi" {% if lang == 'hi' %}selected{% endif %}>हिन्दी (Hindi)</option>
  </select>
  <noscript><button type="submit" class="ml-1 text-xs text-stone-500 underline">Apply</button></noscript>
</form>
