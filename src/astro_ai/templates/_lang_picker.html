{# Language selector — native HTML <select> that auto-submits on change.
   Caller provides `lang` (current language code). Scales to more languages
   later by adding <option> rows; no JS framework needed. #}
<form method="post" action="/lang" class="inline-flex items-center">
  {# strip_hi_prefix, not request.url.path, and not english_url either (#124).
     On a /hi/ page, posting request.url.path back means /hi/rashifal — which
     forces Hindi — so choosing English wrote lang=en and re-rendered Hindi: a
     dead control that silently changed the reader's saved language.
     `POST /lang` sends them to the Hindi twin when they ask for Hindi, so this
     posts the ENGLISH path.

     english_url() is wrong here: it runs _normalise, which lowercases and
     strips the trailing slash, adding a second redirect hop to all 77 /learn/
     URLs. strip_hi_prefix removes the prefix and changes nothing else. #}
  <input type="hidden" name="next" value="{{ strip_hi_prefix(request.url.path) }}">
  {# #241: this control sits INSIDE the night nav bar, so it is styled
     light-on-dark rather than as a page-level input. The <option> rows are
     painted by the OS, not by us — every browser draws them on its own
     surface — so they are deliberately left alone and only the closed
     control is themed. #}
  <select name="lang" onchange="this.form.submit()"
          class="bg-transparent border border-bhagya-gold/40 rounded-md px-2 py-1 text-xs
                 text-bhagya-cream/[.78]
                 hover:border-bhagya-saffron focus:ring-2 focus:ring-bhagya-saffron
                 focus:border-bhagya-saffron
                 focus:outline-none cursor-pointer transition-colors"
          aria-label="Language">
    <option class="text-bhagya-ink" value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
    <option class="text-bhagya-ink" value="hi" {% if lang == 'hi' %}selected{% endif %}>हिन्दी (Hindi)</option>
  </select>
  <noscript><button type="submit" class="ml-1 text-xs text-bhagya-cream/[.62] underline">Apply</button></noscript>
</form>
