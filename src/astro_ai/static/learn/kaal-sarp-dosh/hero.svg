<?xml version="1.0" encoding="UTF-8"?>
<!-- Kaal Sarp: stylised serpent curve enclosing the planets in a bow.
     Suggests the "caught between Rahu and Ketu" geometry without literal
     snake imagery (kept symbolic and brand-consistent). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Kaal Sarp axis containing the planets">
  <defs>
    <radialGradient id="aura-ks" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#F1E7D8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F1E7D8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17131A"/>
      <stop offset="50%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <circle cx="160" cy="160" r="140" fill="url(#aura-ks)"/>

  <!-- Outer ring -->
  <circle cx="160" cy="160" r="115" fill="none" stroke="#9E2B25" stroke-width="1.5" opacity="0.3"/>

  <!-- The serpent body — a stylised arc forming the Kaal Sarp axis.
       Top half of a circle, with Rahu at one end and Ketu at the other. -->
  <path d="M 60 180 Q 160 50 260 180" fill="none" stroke="url(#serpent)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <!-- A second thinner echo line for depth -->
  <path d="M 65 178 Q 160 60 255 178" fill="none" stroke="#D98A45" stroke-width="2" opacity="0.4"/>

  <!-- Rahu head — dark globe at one end of the axis -->
  <circle cx="60" cy="180" r="22" fill="#1c1917"/>
  <circle cx="55" cy="175" r="3" fill="#ffd764"/>
  <circle cx="65" cy="178" r="2" fill="#ffd764" opacity="0.7"/>

  <!-- Ketu tail — lighter mauve oval -->
  <ellipse cx="260" cy="180" rx="18" ry="14" fill="#D98A45"/>

  <!-- Planets caught inside the bow (between Rahu and Ketu) -->
  <g>
    <!-- Sun -->
    <circle cx="100" cy="135" r="8" fill="#facc15"/>
    <!-- Moon -->
    <circle cx="135" cy="115" r="7" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <!-- Mars -->
    <circle cx="160" cy="105" r="7" fill="#dc2626"/>
    <!-- Mercury -->
    <circle cx="185" cy="115" r="6" fill="#84cc16"/>
    <!-- Jupiter -->
    <circle cx="215" cy="135" r="8" fill="#fbbf24"/>
    <!-- Venus -->
    <circle cx="135" cy="148" r="6" fill="#f9a8d4"/>
    <!-- Saturn -->
    <circle cx="185" cy="148" r="7" fill="#475569"/>
  </g>

  <!-- Devanagari label -->
  <text x="160" y="290" text-anchor="middle"
        font-family="'Noto Sans Devanagari', serif"
        font-size="20" fill="#9E2B25" font-weight="600">काल सर्प</text>
</svg>
