<?xml version="1.0" encoding="UTF-8"?>
<!-- Magha — the "mighty one". Symbol: royal throne. Deity: Pitris
     (ancestors). Ruled by Ketu. Rendered as a golden throne under a
     rising sun, with subtle ancestor-spirit motifs above. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Magha nakshatra symbol — royal throne with ancestor spirits">
  <defs>
    <radialGradient id="mgharadius" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5f5f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mghathrone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="mghagold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="180" rx="150" ry="130" fill="url(#mgharadius)"/>

  <!-- Rising sun behind throne -->
  <circle cx="160" cy="145" r="40" fill="url(#mghagold)" opacity="0.9"/>
  <circle cx="160" cy="145" r="40" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>

  <!-- Ancestor spirit motifs (three subtle circles floating above) -->
  <g fill="#7c3aed" opacity="0.35">
    <circle cx="105" cy="70" r="8"/>
    <circle cx="160" cy="55" r="10"/>
    <circle cx="215" cy="70" r="8"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.25">
    <path d="M 105 78 Q 105 90, 100 95"/>
    <path d="M 160 65 Q 160 80, 155 90"/>
    <path d="M 215 78 Q 215 90, 220 95"/>
  </g>

  <!-- Throne back (tall panel with pointed top) -->
  <path d="M 115 210
           L 115 145
           Q 115 130, 130 130
           L 190 130
           Q 205 130, 205 145
           L 205 210
           Z"
        fill="url(#mghathrone)"/>

  <!-- Throne back crown accent -->
  <polygon points="150,130 160,110 170,130" fill="url(#mghagold)"/>
  <circle cx="160" cy="112" r="4" fill="#fef9c3"/>

  <!-- Throne seat -->
  <rect x="105" y="210" width="110" height="20" fill="#4c1d95"/>

  <!-- Throne legs -->
  <rect x="115" y="230" width="15" height="35" fill="#4c1d95"/>
  <rect x="190" y="230" width="15" height="35" fill="#4c1d95"/>

  <!-- Gold-trim on seat -->
  <line x1="105" y1="212" x2="215" y2="212" stroke="url(#mghagold)" stroke-width="2"/>
  <line x1="105" y1="228" x2="215" y2="228" stroke="url(#mghagold)" stroke-width="2"/>

  <!-- Armrests -->
  <rect x="100" y="200" width="15" height="30" fill="#6b21a8" rx="3"/>
  <rect x="205" y="200" width="15" height="30" fill="#6b21a8" rx="3"/>

  <!-- Small "10" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#6b21a8" opacity="0.35">10</text>
</svg>
