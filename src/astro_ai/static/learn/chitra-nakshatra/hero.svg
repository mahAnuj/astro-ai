<?xml version="1.0" encoding="UTF-8"?>
<!-- Chitra — the "bright jewel / pearl". Symbol: pearl or bright gem.
     Deity: Vishvakarma (divine architect). Ruled by Mars. Rendered
     as a luminous multi-facet gem with radiating light. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Chitra nakshatra symbol — a luminous jewel of the divine architect">
  <defs>
    <radialGradient id="chitraaura" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gembottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CB5A2E"/>
      <stop offset="60%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="gemside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B03A22"/>
      <stop offset="100%" stop-color="#CB5A2E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <circle cx="160" cy="160" r="150" fill="url(#chitraaura)"/>

  <!-- Radiating light rays behind gem -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="160" y1="30" x2="160" y2="70"/>
    <line x1="60" y1="60" x2="90" y2="90"/>
    <line x1="260" y1="60" x2="230" y2="90"/>
    <line x1="30" y1="160" x2="70" y2="160"/>
    <line x1="290" y1="160" x2="250" y2="160"/>
    <line x1="60" y1="260" x2="90" y2="230"/>
    <line x1="260" y1="260" x2="230" y2="230"/>
    <line x1="160" y1="290" x2="160" y2="250"/>
  </g>

  <!-- Gem shape: crown-cut diamond -->
  <!-- Table (top facet) -->
  <polygon points="130,110 190,110 200,130 120,130" fill="url(#gemtop)"/>
  <!-- Upper facets -->
  <polygon points="100,130 160,90 220,130 200,130 190,110 130,110 120,130"
           fill="url(#gemtop)" stroke="#d97706" stroke-width="1" stroke-linejoin="round"/>
  <!-- Girdle -->
  <polygon points="100,130 220,130 200,145 120,145" fill="url(#gemside)"/>
  <!-- Pavilion (lower) -->
  <polygon points="120,145 200,145 160,235" fill="url(#gembottom)"/>
  <!-- Facet lines on pavilion -->
  <line x1="120" y1="145" x2="160" y2="235" stroke="#140F1C" stroke-width="0.75" opacity="0.5"/>
  <line x1="145" y1="145" x2="160" y2="235" stroke="#140F1C" stroke-width="0.75" opacity="0.5"/>
  <line x1="175" y1="145" x2="160" y2="235" stroke="#140F1C" stroke-width="0.75" opacity="0.5"/>
  <line x1="200" y1="145" x2="160" y2="235" stroke="#140F1C" stroke-width="0.75" opacity="0.5"/>

  <!-- Highlight on gem table -->
  <polygon points="138,115 175,115 168,125 145,125" fill="#fef9c3" opacity="0.7"/>

  <!-- Small starburst sparkle top-right of gem -->
  <g fill="#fef9c3" opacity="0.85">
    <circle cx="205" cy="105" r="3"/>
    <line x1="205" y1="98" x2="205" y2="112" stroke="#fef9c3" stroke-width="1.5"/>
    <line x1="198" y1="105" x2="212" y2="105" stroke="#fef9c3" stroke-width="1.5"/>
  </g>

  <!-- Small "14" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#9E2B25" opacity="0.35">14</text>
</svg>
