<?xml version="1.0" encoding="UTF-8"?>
<!-- Saturn (Shani): the planet with its iconic rings, deep dark body,
     and the classical Shani glyph as a gold accent. Slate-grey rings
     emphasise the slow / mature / structural character. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Saturn (Shani) with rings">
  <defs>
    <radialGradient id="aura-sh" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#cbd5e1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saturn-globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="rings" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Cool grey-blue cosmic aura — Saturn's vibe is sober, not warm -->
  <circle cx="160" cy="170" r="140" fill="url(#aura-sh)"/>

  <!-- Distant stars -->
  <g fill="#9E2B25" opacity="0.45">
    <circle cx="55"  cy="80"  r="1.5"/>
    <circle cx="265" cy="90"  r="2"/>
    <circle cx="50"  cy="220" r="1.5"/>
    <circle cx="275" cy="240" r="1.5"/>
    <circle cx="280" cy="160" r="1"/>
    <circle cx="40"  cy="150" r="1"/>
  </g>

  <!-- Saturn's rings — back half (visible above the planet) -->
  <ellipse cx="160" cy="170" rx="98" ry="22" fill="none" stroke="url(#rings)" stroke-width="6" transform="rotate(-15 160 170)" opacity="0.95"/>
  <ellipse cx="160" cy="170" rx="80" ry="18" fill="none" stroke="#94a3b8" stroke-width="2.5" transform="rotate(-15 160 170)" opacity="0.6"/>

  <!-- Saturn body -->
  <circle cx="160" cy="170" r="55" fill="url(#saturn-globe)"/>

  <!-- Subtle banding on the planet (gas-giant texture, suggested only) -->
  <g stroke="#3f3934" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M 115 160 Q 160 152 205 160"/>
    <path d="M 115 180 Q 160 188 205 180"/>
  </g>

  <!-- Front half of rings (over the planet) -->
  <path d="M 65 195 Q 160 230 255 195" fill="none" stroke="url(#rings)" stroke-width="6" transform="rotate(-15 160 170)" opacity="0.95"/>

  <!-- Classical Shani symbol — the scythe-like mark in gold -->
  <g transform="translate(196 122)" stroke="#ffd764" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="22"/>
    <path d="M 0 4 Q -10 4 -10 14"/>
    <line x1="-6" y1="0" x2="6" y2="0"/>
  </g>

  <!-- Devanagari label -->
  <text x="160" y="295" text-anchor="middle"
        font-family="'Noto Sans Devanagari', serif"
        font-size="20" fill="#9E2B25" font-weight="600">शनि</text>
</svg>
