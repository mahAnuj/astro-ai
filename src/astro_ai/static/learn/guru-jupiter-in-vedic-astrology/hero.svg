<?xml version="1.0" encoding="UTF-8"?>
<!-- Guru (Jupiter): golden-yellow planet body with soft rings suggesting
     expansion. Warm, benevolent palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Guru (Jupiter) — the great benefic">
  <defs>
    <radialGradient id="aura-jp" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jup-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="jup-bands" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-jp)"/>

  <g fill="#6b21a8" opacity="0.35">
    <circle cx="50"  cy="60"  r="1.5"/>
    <circle cx="270" cy="80"  r="2"/>
    <circle cx="60"  cy="255" r="1.5"/>
    <circle cx="280" cy="240" r="1.5"/>
  </g>

  <!-- Expansive outer ring — Jupiter's benevolence radiating -->
  <circle cx="160" cy="160" r="108" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 6"/>

  <!-- Jupiter body -->
  <circle cx="160" cy="160" r="82" fill="url(#jup-body)"/>

  <!-- Bands — Jupiter's iconic horizontal stripes -->
  <g opacity="0.55">
    <ellipse cx="160" cy="130" rx="80" ry="4" fill="url(#jup-bands)"/>
    <ellipse cx="160" cy="160" rx="82" ry="4" fill="url(#jup-bands)"/>
    <ellipse cx="160" cy="190" rx="78" ry="4" fill="url(#jup-bands)"/>
  </g>

  <!-- Jupiter glyph ♃ -->
  <text x="160" y="176" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="60" font-weight="700" fill="#78350f" opacity="0.85">♃</text>
</svg>
