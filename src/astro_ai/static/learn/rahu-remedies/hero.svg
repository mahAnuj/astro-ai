<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Rahu remedies — classical practices to soften Rahu">
  <defs>
    <radialGradient id="rr_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rr_head" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#rr_aura)"/>
  <g fill="#6b21a8" opacity="0.35">
    <circle cx="42" cy="45" r="1.5"/><circle cx="280" cy="55" r="2"/>
    <circle cx="275" cy="275" r="1.5"/><circle cx="50" cy="270" r="1.5"/>
  </g>
  <!-- Serpent's head — Rahu -->
  <ellipse cx="160" cy="150" rx="70" ry="55" fill="url(#rr_head)"/>
  <!-- Eyes -->
  <circle cx="140" cy="140" r="6" fill="#f59e0b"/>
  <circle cx="180" cy="140" r="6" fill="#f59e0b"/>
  <!-- Fangs suggestion -->
  <path d="M 145 165 L 148 175 L 150 165 M 170 165 L 172 175 L 175 165"
        stroke="#fef3c7" stroke-width="2" fill="none"/>
  <!-- Serpent body coiling below -->
  <path d="M 130 200 Q 100 240 130 260 Q 160 275 190 260 Q 220 240 190 200"
        stroke="url(#rr_head)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Remedy glyphs orbit — mantra + offering + charity -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="60" cy="90" r="10"/>
    <circle cx="260" cy="90" r="10"/>
    <circle cx="60" cy="230" r="10"/>
    <circle cx="260" cy="230" r="10"/>
  </g>
  <text x="60" y="94" font-family="Noto Sans Devanagari, serif" font-size="14" text-anchor="middle" fill="#78350f">ॐ</text>
  <text x="260" y="94" font-family="Noto Sans Devanagari, serif" font-size="14" text-anchor="middle" fill="#78350f">☾</text>
  <text x="60" y="234" font-family="Noto Sans Devanagari, serif" font-size="14" text-anchor="middle" fill="#78350f">✋</text>
  <text x="260" y="234" font-family="Noto Sans Devanagari, serif" font-size="14" text-anchor="middle" fill="#78350f">🌰</text>
</svg>
