<?xml version="1.0" encoding="UTF-8"?>
<!-- Sun Mahadasha: golden sunburst with a "6 YEARS" callout — this is the
     dasha guide so the year count is the hero data point. Warm palette
     matches the parent Surya article for series consistency. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Sun Mahadasha — the 6-year period">
  <defs>
    <radialGradient id="aura-sm" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fed7aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sm-body" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-sm)"/>

  <!-- Radiant burst — 8 rays -->
  <g stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="160" y1="20"  x2="160" y2="60"/>
    <line x1="160" y1="260" x2="160" y2="300"/>
    <line x1="20"  y1="160" x2="60"  y2="160"/>
    <line x1="260" y1="160" x2="300" y2="160"/>
    <line x1="60"  y1="60"  x2="90"  y2="90"/>
    <line x1="230" y1="230" x2="260" y2="260"/>
    <line x1="260" y1="60"  x2="230" y2="90"/>
    <line x1="90"  y1="230" x2="60"  y2="260"/>
  </g>

  <!-- Sun body with the "6" year count as centerpiece -->
  <circle cx="160" cy="160" r="82" fill="url(#sm-body)"/>
  <text x="160" y="162" text-anchor="middle" dominant-baseline="central"
        font-family="Crimson Pro, Georgia, serif" font-size="64" font-weight="700" fill="#7c2d12">6</text>
  <text x="160" y="205" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" letter-spacing="2">YEARS</text>
</svg>
