<?xml version="1.0" encoding="UTF-8"?>
<!-- 7th Lord Placement Guide — a highlighted 7th house with an arrow
     travelling around the 12 houses of the diamond, indicating that
     WHERE the 7th lord SITS is what shapes the marriage. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="7th lord placement across the 12 houses of a Kundli — the ruler of marriage tracked through each bhava">
  <defs>
    <radialGradient id="l7_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#F1E7D8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#CB5A2E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l7_diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CB5A2E"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="l7_arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="l7_hilite" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Aura -->
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#l7_aura)"/>

  <!-- Star field -->
  <g fill="#9E2B25" opacity="0.28">
    <circle cx="42" cy="45" r="1.5"/>
    <circle cx="280" cy="55" r="2"/>
    <circle cx="275" cy="275" r="1.5"/>
    <circle cx="50" cy="270" r="1.5"/>
  </g>

  <!-- Kundli diamond (North Indian style) with all 12 houses -->
  <g fill="none" stroke="url(#l7_diamond)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="55" y="55" width="210" height="210" rx="4"/>
    <polygon points="160,55 265,160 160,265 55,160"/>
    <line x1="55" y1="55" x2="265" y2="265"/>
    <line x1="265" y1="55" x2="55" y2="265"/>
  </g>

  <!-- 7th house — west face — highlighted as the origin -->
  <polygon points="55,160 160,55 55,55" fill="url(#l7_hilite)" opacity="0.5"/>
  <polygon points="55,160 160,265 55,265" fill="url(#l7_hilite)" opacity="0.5"/>
  <text x="86" y="165" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="22" font-weight="700" fill="#78350f">7L</text>

  <!-- House numbers 1-12 (compact) -->
  <g font-family="Inter, sans-serif" font-size="10" font-weight="600"
     text-anchor="middle" fill="#9E2B25" opacity="0.75">
    <text x="160" y="80">1</text>
    <text x="93" y="80">12</text>
    <text x="82" y="115">11</text>
    <text x="82" y="215">9</text>
    <text x="93" y="250">8</text>
    <text x="160" y="255">6</text>
    <text x="230" y="250">5</text>
    <text x="240" y="215">4</text>
    <text x="240" y="115">2</text>
    <text x="230" y="80">10</text>
    <text x="200" y="163">3</text>
  </g>

  <!-- Arrow arcing out of 7th into other houses — the "placement" concept -->
  <g fill="none" stroke="url(#l7_arrow)" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
    <path d="M 100 160 Q 160 100 220 130" stroke-dasharray="4,3"/>
  </g>
  <!-- Arrowhead -->
  <path d="M 220 130 L 213 122 M 220 130 L 213 138"
        stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Small "L" (Lord) glyph in 7th -->
  <circle cx="86" cy="145" r="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="86" y="149" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="12" font-weight="700" fill="#78350f">♀</text>

  <!-- Little heart on the destination house -->
  <g fill="#e11d48" opacity="0.65">
    <path d="M 220 140 c -3 -3, -8 0, -5 4 l 5 5 l 5 -5 c 3 -4, -2 -7, -5 -4 z"/>
  </g>
</svg>
