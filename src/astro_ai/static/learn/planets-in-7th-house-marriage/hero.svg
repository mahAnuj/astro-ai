<?xml version="1.0" encoding="UTF-8"?>
<!-- Planets in 7th House — a Kundli diamond with the 7th house
     (west/left face) highlighted; nine tiny planet glyphs orbit
     the highlighted face. Warm cream + astro-purple + gold. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Planets in the 7th house of a Kundli — nine grahas orbiting the house of marriage">
  <defs>
    <radialGradient id="p7_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p7_diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="p7_seventh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Aura -->
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#p7_aura)"/>

  <!-- Star field -->
  <g fill="#6b21a8" opacity="0.28">
    <circle cx="42" cy="45" r="1.5"/>
    <circle cx="280" cy="55" r="2"/>
    <circle cx="275" cy="275" r="1.5"/>
    <circle cx="50" cy="270" r="1.5"/>
    <circle cx="160" cy="35" r="1"/>
    <circle cx="35" cy="160" r="1"/>
  </g>

  <!-- Kundli diamond (North Indian style) -->
  <g fill="none" stroke="url(#p7_diamond)" stroke-width="2.5" stroke-linejoin="round">
    <!-- Outer square -->
    <rect x="55" y="70" width="210" height="210" rx="4"/>
    <!-- Diamond outline (rotated square inside) -->
    <polygon points="160,70 265,175 160,280 55,175"/>
    <!-- Diagonals through corners -->
    <line x1="55" y1="70" x2="265" y2="280"/>
    <line x1="265" y1="70" x2="55" y2="280"/>
  </g>

  <!-- 7th house — the WEST triangle (left face of diamond).
       In N-Indian chart, 7th is always the west/left triangle. -->
  <polygon points="55,175 160,70 55,70" fill="url(#p7_seventh)" opacity="0.28"/>
  <polygon points="55,175 160,280 55,280" fill="url(#p7_seventh)" opacity="0.28"/>
  <text x="86" y="180" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="26" font-weight="700" fill="#78350f">7</text>

  <!-- Nine planet glyphs orbiting the 7th (Sun, Moon, Mars, Mercury,
       Jupiter, Venus, Saturn, Rahu, Ketu). Arranged in an arc left of chart. -->
  <g font-family="Crimson Pro, Georgia, serif" font-size="16" font-weight="700"
     text-anchor="middle" fill="#4c1d95">
    <!-- Top-left arc -->
    <circle cx="24" cy="90"  r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="96">☉</text>
    <circle cx="14" cy="140" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="146">☽</text>
    <circle cx="14" cy="180" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="186">♂</text>
    <circle cx="24" cy="230" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="236">☿</text>

    <!-- Right-side arc (three more) -->
    <circle cx="296" cy="90"  r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="296" y="96">♃</text>
    <circle cx="306" cy="140" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="306" y="146">♀</text>
    <circle cx="306" cy="180" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="306" y="186">♄</text>
    <circle cx="296" cy="230" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="296" y="236" font-size="14">☊</text>

    <!-- Bottom-center Ketu -->
    <circle cx="160" cy="305" r="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="311" font-size="14">☋</text>
  </g>

  <!-- Small heart near 7th (marriage theme) -->
  <g fill="#e11d48" opacity="0.55">
    <path d="M 82 160 c -3 -3, -8 0, -5 4 l 5 5 l 5 -5 c 3 -4, -2 -7, -5 -4 z"/>
  </g>
</svg>
