<?xml version="1.0" encoding="UTF-8"?>
<!-- Ardra — the "moist / storm-drop" nakshatra. Symbol: teardrop or
     diamond. Deity: Rudra, the storm form of Shiva. Ruled by Rahu.
     Rendered as a stylised teardrop-in-storm with a distant lightning
     bolt behind, in dark stormy palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Ardra nakshatra symbol — teardrop with a lightning bolt in a storm sky">
  <defs>
    <radialGradient id="ardrasky" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6b21a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="ardradrop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ardrabolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Storm-sky backdrop -->
  <ellipse cx="160" cy="140" rx="150" ry="130" fill="url(#ardrasky)"/>

  <!-- Distant lightning bolt (subtle) -->
  <path d="M 220 55
           L 205 130
           L 225 130
           L 200 220"
        stroke="url(#ardrabolt)" stroke-width="6" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Faint cloud streaks -->
  <g stroke="#7c3aed" stroke-width="2" opacity="0.3" fill="none" stroke-linecap="round">
    <path d="M 60 75 Q 90 68, 130 75"/>
    <path d="M 190 60 Q 220 55, 260 62"/>
    <path d="M 40 105 Q 80 100, 115 108"/>
  </g>

  <!-- Central teardrop -->
  <path d="M 160 130
           C 175 155, 195 180, 195 210
           C 195 240, 175 260, 160 260
           C 145 260, 125 240, 125 210
           C 125 180, 145 155, 160 130 Z"
        fill="url(#ardradrop)"/>

  <!-- Teardrop highlight -->
  <ellipse cx="150" cy="200" rx="6" ry="18" fill="#fef9c3" opacity="0.65"/>

  <!-- Small "6" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#6b21a8" opacity="0.35">6</text>
</svg>
