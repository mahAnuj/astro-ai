<?xml version="1.0" encoding="UTF-8"?>
<!-- Surya (Sun): radiant golden body with classical sunray pattern and
     Sanskrit ॐ / Sun glyph at the center. Warm gold-orange palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Surya (Sun) — the soul of the chart">
  <defs>
    <radialGradient id="aura-su" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-body" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-su)"/>

  <!-- Stars -->
  <g fill="#9E2B25" opacity="0.35">
    <circle cx="45"  cy="60"  r="1.5"/>
    <circle cx="275" cy="80"  r="2"/>
    <circle cx="60"  cy="260" r="1.5"/>
    <circle cx="275" cy="245" r="1.5"/>
  </g>

  <!-- 12 sunrays (classical dwadashaditya) -->
  <g stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="160" y1="30"  x2="160" y2="65"/>
    <line x1="160" y1="255" x2="160" y2="290"/>
    <line x1="30"  y1="160" x2="65"  y2="160"/>
    <line x1="255" y1="160" x2="290" y2="160"/>
    <line x1="70"  y1="70"  x2="93"  y2="93"/>
    <line x1="227" y1="227" x2="250" y2="250"/>
    <line x1="250" y1="70"  x2="227" y2="93"/>
    <line x1="93"  y1="227" x2="70"  y2="250"/>
    <line x1="105" y1="45"  x2="115" y2="75"/>
    <line x1="205" y1="245" x2="215" y2="275"/>
    <line x1="215" y1="45"  x2="205" y2="75"/>
    <line x1="115" y1="245" x2="105" y2="275"/>
  </g>

  <!-- Sun body -->
  <circle cx="160" cy="160" r="72" fill="url(#sun-body)"/>
  <circle cx="160" cy="160" r="12" fill="#ffffff" opacity="0.85"/>

  <!-- Classical Sun glyph -->
  <text x="160" y="170" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="42" font-weight="700" fill="#7c2d12">☉</text>
</svg>
