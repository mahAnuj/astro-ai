<?xml version="1.0" encoding="UTF-8"?>
<!-- Ketu: smoky-grey body with a dissolving edge — the dragon's tail, the
     released Rahu counterpart. Softer, spiritual, receding. Golden glow
     suggests mokshic potential. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Ketu — the south lunar node, the shadow of release">
  <defs>
    <radialGradient id="aura-ke" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#f5f5f4" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#d6d3d1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ketu-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="55%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <radialGradient id="ketu-halo" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-ke)"/>

  <g fill="#9E2B25" opacity="0.45">
    <circle cx="45"  cy="60"  r="1.5"/>
    <circle cx="270" cy="80"  r="2"/>
    <circle cx="60"  cy="260" r="1.5"/>
    <circle cx="275" cy="245" r="1.5"/>
  </g>

  <!-- Golden mokshic halo (Ketu's spiritual signature) -->
  <circle cx="160" cy="160" r="105" fill="url(#ketu-halo)"/>

  <!-- Ketu body — softer edge, dissolving down-right -->
  <circle cx="160" cy="160" r="72" fill="url(#ketu-body)"/>

  <!-- Dissolving smoke trailing down-right — Ketu as receding energy -->
  <g fill="none" stroke="#a8a29e" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M 210 200 Q 235 220 245 245"/>
    <path d="M 225 175 Q 255 195 275 210"/>
    <path d="M 195 220 Q 210 250 225 275"/>
  </g>

  <!-- Ketu glyph ☋ -->
  <text x="160" y="172" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="60" font-weight="700" fill="#fef3c7" opacity="0.75">☋</text>
</svg>
