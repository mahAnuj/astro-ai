<?xml version="1.0" encoding="UTF-8"?>
<!-- Financial struggles — visual metaphor: an empty/leaking coin
     pouch, with a 2nd/11th house indicator kundali subtle. Warm
     purple/gold palette, thoughtful. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Financial struggles — a leaking coin pouch with chart signal">
  <defs>
    <radialGradient id="fs_aura" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fs_pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="fs_coin" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="180" rx="150" ry="130" fill="url(#fs_aura)"/>

  <!-- Small kundali in top-left with 2nd + 11th houses highlighted -->
  <g transform="translate(80, 55)">
    <rect x="-25" y="-22" width="50" height="42" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
    <polygon points="0,-22 25,0 0,22 -25,0" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.55"/>
    <!-- 2nd house — upper right area -->
    <circle cx="-11" cy="-12" r="5" fill="#fbbf24" opacity="0.75"/>
    <text x="-11" y="-9" text-anchor="middle" font-family="serif" font-size="6" fill="#78350f" font-weight="700">2</text>
    <!-- 11th house — upper left area -->
    <circle cx="11" cy="-12" r="5" fill="#fbbf24" opacity="0.75"/>
    <text x="11" y="-9" text-anchor="middle" font-family="serif" font-size="6" fill="#78350f" font-weight="700">11</text>
  </g>

  <!-- Coin pouch (drawstring bag) -->
  <g fill="url(#fs_pouch)">
    <!-- Pouch body -->
    <path d="M 110 175
             Q 105 175, 105 185
             Q 105 240, 130 250
             L 190 250
             Q 215 240, 215 185
             Q 215 175, 210 175
             L 195 175
             Q 190 165, 175 165
             L 145 165
             Q 130 165, 125 175 Z"/>
    <!-- Drawstring at top (loose/untied) -->
    <path d="M 130 173 Q 135 158, 145 165" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <path d="M 175 165 Q 185 158, 190 173" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <!-- Pouch pattern lines -->
    <line x1="130" y1="205" x2="190" y2="205" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
    <line x1="125" y1="220" x2="195" y2="220" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Small hole/tear in the pouch showing coins slipping out -->
  <ellipse cx="200" cy="230" rx="6" ry="4" fill="#4c1d95" opacity="0.9"/>

  <!-- Coins falling out through the hole (right side) -->
  <g fill="url(#fs_coin)">
    <circle cx="215" cy="245" r="7"/>
    <circle cx="228" cy="258" r="6"/>
    <circle cx="240" cy="272" r="5"/>
    <!-- Coin details -->
    <circle cx="215" cy="245" r="4" fill="none" stroke="#78350f" stroke-width="0.8"/>
    <circle cx="228" cy="258" r="3.5" fill="none" stroke="#78350f" stroke-width="0.8"/>
  </g>

  <!-- A few coins visible inside pouch through top -->
  <g fill="url(#fs_coin)" opacity="0.85">
    <circle cx="150" cy="175" r="5"/>
    <circle cx="170" cy="176" r="5"/>
  </g>

  <!-- Empty space suggestion — dotted line showing where coins used to be -->
  <g stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.35" stroke-dasharray="2,3">
    <circle cx="140" cy="200" r="5"/>
    <circle cx="155" cy="215" r="5"/>
    <circle cx="175" cy="210" r="5"/>
    <circle cx="185" cy="220" r="5"/>
  </g>

  <!-- Ground line -->
  <line x1="30" y1="285" x2="290" y2="285" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
</svg>
