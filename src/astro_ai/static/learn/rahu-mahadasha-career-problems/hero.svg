<?xml version="1.0" encoding="UTF-8"?>
<!-- Rahu Mahadasha career — visual metaphor: a serpentine spiral (Rahu is
     the north lunar node, classically depicted as a serpent) coiling upward
     through 18 golden markers (one per year of the Mahadasha), with a
     forked-path silhouette below suggesting the "which career?" question.
     Purple/gold on cream. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Rahu Mahadasha career — serpentine spiral through 18 year-markers over a forked path">
  <defs>
    <radialGradient id="rmc_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rmc_serp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CB5A2E"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="rmc_path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B03A22" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#140F1C" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="150" ry="140" fill="url(#rmc_aura)"/>

  <!-- Forked path at the base (career choice) -->
  <g fill="url(#rmc_path)">
    <!-- Left fork -->
    <path d="M 155 300 L 60 260 L 50 265 L 148 306 Z"/>
    <!-- Right fork -->
    <path d="M 165 300 L 270 258 L 278 264 L 172 306 Z"/>
    <!-- Trunk (converging) -->
    <path d="M 148 306 L 172 306 L 168 235 L 152 235 Z"/>
  </g>

  <!-- Serpentine spiral coiling up (Rahu — nagakundala pattern) -->
  <path d="M 160 240
           C 100 220, 100 190, 160 175
           C 220 160, 220 130, 160 115
           C 100 100, 100 75, 160 62"
        fill="none" stroke="url(#rmc_serp)" stroke-width="9" stroke-linecap="round"/>

  <!-- Serpent head at top -->
  <g transform="translate(160, 52)">
    <ellipse rx="14" ry="10" fill="url(#rmc_serp)"/>
    <!-- Eyes -->
    <circle cx="-5" cy="-2" r="1.8" fill="#fbbf24"/>
    <circle cx="5" cy="-2" r="1.8" fill="#fbbf24"/>
    <!-- Forked tongue -->
    <path d="M 0 8 L -3 15 M 0 8 L 3 15" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Hood suggestion -->
    <path d="M -14 -2 Q -20 -12, -14 -18 M 14 -2 Q 20 -12, 14 -18" stroke="url(#rmc_serp)" stroke-width="2" fill="none"/>
  </g>

  <!-- 18 golden year-markers along the spiral -->
  <g fill="#fbbf24">
    <!-- Cluster along the coils -->
    <circle cx="120" cy="230" r="2.5"/>
    <circle cx="110" cy="215" r="2.5"/>
    <circle cx="108" cy="195" r="2.5"/>
    <circle cx="120" cy="182" r="2.5"/>
    <circle cx="145" cy="175" r="2.5"/>
    <circle cx="180" cy="172" r="2.5"/>
    <circle cx="205" cy="163" r="2.5"/>
    <circle cx="215" cy="148" r="2.5"/>
    <circle cx="212" cy="132" r="2.5"/>
    <circle cx="200" cy="120" r="2.5"/>
    <circle cx="175" cy="113" r="2.5"/>
    <circle cx="140" cy="110" r="2.5"/>
    <circle cx="115" cy="100" r="2.5"/>
    <circle cx="105" cy="85" r="2.5"/>
    <circle cx="108" cy="70" r="2.5"/>
    <circle cx="125" cy="60" r="2.5"/>
    <circle cx="145" cy="55" r="2.5"/>
    <circle cx="160" cy="52" r="3" opacity="0.9"/>
  </g>

  <!-- Ambient sparks (Rahu — the shadow amplifier) -->
  <g fill="#fbbf24" opacity="0.55">
    <circle cx="60" cy="90" r="1.5"/>
    <circle cx="260" cy="95" r="1.6"/>
    <circle cx="55" cy="180" r="1.4"/>
    <circle cx="265" cy="185" r="1.6"/>
    <circle cx="50" cy="45" r="1.3"/>
    <circle cx="275" cy="50" r="1.4"/>
  </g>
</svg>
