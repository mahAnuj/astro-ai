<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Pitru Dosh remedies — classical rituals to clear ancestral karma">
  <defs>
    <radialGradient id="pr_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#pr_aura)"/>
  <!-- Diya (oil lamp) for ancestor offering -->
  <g transform="translate(160, 200)">
    <ellipse cx="0" cy="20" rx="60" ry="15" fill="#78350f" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="55" ry="12" fill="#b45309"/>
    <ellipse cx="0" cy="-5" rx="50" ry="8" fill="#f59e0b"/>
    <!-- Flame -->
    <path d="M 0 -20 Q -10 -35 -5 -55 Q 0 -70 5 -55 Q 10 -35 0 -20"
          fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- Water flowing (tarpan symbolism) -->
  <path d="M 80 80 Q 100 100 90 130 Q 80 160 100 180"
        fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M 240 80 Q 220 100 230 130 Q 240 160 220 180"
        fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Om -->
  <text x="160" y="90" font-family="Noto Sans Devanagari, serif" font-size="42" text-anchor="middle" fill="#78350f">ॐ</text>
</svg>
