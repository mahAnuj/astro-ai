<?xml version="1.0" encoding="UTF-8"?>
<!-- Career during Sade Sati — visual metaphor: Saturn slowly moving over the
     Moon (Janma Rashi) with a briefcase / desk silhouette underneath being
     re-shaped. Three orbital phase markers show Arambha, Madhya, Uttara.
     Purple/gold on cream, matching the site palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Career during Sade Sati — Saturn passing over the natal Moon in three phases with a briefcase reshaping below">
  <defs>
    <radialGradient id="cds_aura" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#c4b5fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cds_saturn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cds_ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="cds_moon" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="cds_case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="130" rx="160" ry="120" fill="url(#cds_aura)"/>

  <!-- Saturn's 7.5-year arc across the Moon's neighbourhood -->
  <path d="M 40 130 Q 160 40 280 130" fill="none" stroke="#6b21a8"
        stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Moon (Janma Rashi) at centre -->
  <g transform="translate(160, 130)">
    <circle r="26" fill="url(#cds_moon)" stroke="#f59e0b" stroke-width="1.2" opacity="0.95"/>
    <text y="5" text-anchor="middle" font-family="serif" font-size="11" fill="#78350f" font-weight="700">Moon</text>
  </g>

  <!-- Phase 1 marker (Arambha — 12th from Moon, on the left) -->
  <g transform="translate(70, 105)" opacity="0.85">
    <circle r="10" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.2"/>
    <text y="3.5" text-anchor="middle" font-family="serif" font-size="10" fill="#581c87" font-weight="700">1</text>
  </g>
  <!-- Phase 3 marker (Uttara — 2nd from Moon, on the right) -->
  <g transform="translate(250, 105)" opacity="0.85">
    <circle r="10" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.2"/>
    <text y="3.5" text-anchor="middle" font-family="serif" font-size="10" fill="#581c87" font-weight="700">3</text>
  </g>

  <!-- Saturn (Phase 2 — Madhya, right on Moon) — the peak position -->
  <g transform="translate(160, 60)">
    <ellipse cx="0" cy="0" rx="36" ry="8" fill="none" stroke="url(#cds_ring)" stroke-width="2.5" opacity="0.55"/>
    <circle r="17" fill="url(#cds_saturn)"/>
    <ellipse cx="-5" cy="-5" rx="5" ry="3" fill="#c084fc" opacity="0.5"/>
    <path d="M -36 2 A 36 8 0 0 0 36 2" fill="none" stroke="url(#cds_ring)" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- Briefcase silhouette below — the career being reshaped -->
  <g fill="url(#cds_case)" transform="translate(160, 230)">
    <!-- Handle -->
    <rect x="-14" y="-32" width="28" height="5" rx="2" fill="none" stroke="#4c1d95" stroke-width="2.5"/>
    <!-- Case body -->
    <rect x="-46" y="-24" width="92" height="58" rx="4"/>
    <!-- Latch -->
    <rect x="-3" y="-24" width="6" height="6" fill="#fbbf24"/>
    <!-- Seam line -->
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#fefbf3" stroke-width="1" opacity="0.55"/>
    <!-- Left corner scuff (weathering) -->
    <path d="M -46 20 L -38 26 L -46 32 Z" fill="#3b0764"/>
    <!-- Right corner scuff -->
    <path d="M 46 20 L 38 26 L 46 32 Z" fill="#3b0764"/>
  </g>

  <!-- Ground line + shadow -->
  <ellipse cx="160" cy="280" rx="80" ry="6" fill="#78716c" opacity="0.18"/>

  <!-- Gold accent dots (karma sparks) around Saturn -->
  <g fill="#fbbf24" opacity="0.75">
    <circle cx="95" cy="45" r="1.8"/>
    <circle cx="225" cy="42" r="2.1"/>
    <circle cx="75" cy="80" r="1.5"/>
    <circle cx="245" cy="78" r="1.6"/>
    <circle cx="115" cy="25" r="1.5"/>
    <circle cx="205" cy="22" r="1.6"/>
  </g>
</svg>
