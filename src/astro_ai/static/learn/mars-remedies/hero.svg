<?xml version="1.0" encoding="UTF-8"?>
<!-- Mars Remedies — Mangal as warrior/protector. Red-orange palette
     with Hanuman gada (mace) crossed with a red flower offering.
     Reverent-strong not aggressive. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Mars Remedies — Hanuman gada and red flower offering">
  <defs>
    <radialGradient id="mr_aura" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fca5a5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mr_planet" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="mr_gada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CB5A2E"/>
      <stop offset="60%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="mr_gada_head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="mr_flower" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <circle cx="160" cy="140" r="150" fill="url(#mr_aura)"/>

  <!-- Mars planet (small, top) -->
  <circle cx="160" cy="75" r="27" fill="url(#mr_planet)"/>
  <!-- Mars surface features (subtle crater dots) -->
  <circle cx="152" cy="68" r="3" fill="#7f1d1d" opacity="0.5"/>
  <circle cx="168" cy="72" r="2" fill="#7f1d1d" opacity="0.5"/>
  <circle cx="164" cy="83" r="2.5" fill="#7f1d1d" opacity="0.5"/>

  <!-- Mars symbol above planet (♂) -->
  <text x="160" y="42" text-anchor="middle" font-family="serif" font-size="22"
        fill="#dc2626" opacity="0.7" font-weight="700">♂</text>

  <!-- Hanuman gada (mace) — crossed diagonal, purple -->
  <g transform="translate(160, 200) rotate(-25)">
    <!-- Handle -->
    <rect x="-4" y="-80" width="8" height="130" fill="url(#mr_gada)" rx="2"/>
    <!-- Grip texture -->
    <g stroke="#140F1C" stroke-width="0.7" opacity="0.6">
      <line x1="-4" y1="20" x2="4" y2="20"/>
      <line x1="-4" y1="28" x2="4" y2="28"/>
      <line x1="-4" y1="36" x2="4" y2="36"/>
      <line x1="-4" y1="44" x2="4" y2="44"/>
    </g>
    <!-- Head (bulbous top) -->
    <ellipse cx="0" cy="-88" rx="22" ry="18" fill="url(#mr_gada_head)"/>
    <!-- Head detail -->
    <circle cx="0" cy="-88" r="14" fill="none" stroke="#78350f" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="-88" r="6" fill="#fef9c3" opacity="0.7"/>
  </g>

  <!-- Red flower offering (right of the gada) -->
  <g transform="translate(220, 235)">
    <!-- Petals -->
    <circle cx="0" cy="-10" r="8" fill="url(#mr_flower)"/>
    <circle cx="-10" cy="0" r="8" fill="url(#mr_flower)"/>
    <circle cx="10" cy="0" r="8" fill="url(#mr_flower)"/>
    <circle cx="-6" cy="8" r="8" fill="url(#mr_flower)"/>
    <circle cx="6" cy="8" r="8" fill="url(#mr_flower)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
    <!-- Stem -->
    <path d="M 0 15 Q 3 25, 0 35" stroke="#065f46" stroke-width="2" fill="none"/>
    <!-- Leaf -->
    <ellipse cx="4" cy="26" rx="4" ry="7" fill="#059669" transform="rotate(30 4 26)"/>
  </g>

  <!-- Second red flower on the left, smaller -->
  <g transform="translate(90, 245)">
    <circle cx="0" cy="-6" r="5" fill="url(#mr_flower)"/>
    <circle cx="-6" cy="0" r="5" fill="url(#mr_flower)"/>
    <circle cx="6" cy="0" r="5" fill="url(#mr_flower)"/>
    <circle cx="-3" cy="5" r="5" fill="url(#mr_flower)"/>
    <circle cx="3" cy="5" r="5" fill="url(#mr_flower)"/>
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>

  <!-- Ground/altar base line -->
  <line x1="40" y1="278" x2="280" y2="278" stroke="#E4A96A" stroke-width="1" opacity="0.4"/>
</svg>
