<?xml version="1.0" encoding="UTF-8"?>
<!-- Gochar 2027: a stylised orbital map of the year's slow-planet transits.
     Jupiter (the year's four stretches) at the top in gold, Saturn crossing
     from Pisces to Aries at the bottom in slate, and the Rahu-Ketu axis, which
     does not change sign in 2027. Purely illustrative: it states no verdict. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Gochar 2027 — the year's major planetary transits">
  <defs>
    <radialGradient id="aura-g27" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#F1E7D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jup-g27" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="sat-g27" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-g27)"/>

  <!-- Stars -->
  <g fill="#9E2B25" opacity="0.4">
    <circle cx="45"  cy="55"  r="1.5"/>
    <circle cx="275" cy="70"  r="2"/>
    <circle cx="55"  cy="260" r="1.5"/>
    <circle cx="285" cy="245" r="1.5"/>
    <circle cx="20"  cy="165" r="1"/>
    <circle cx="300" cy="170" r="1"/>
  </g>

  <!-- Orbital ring — represents the zodiac wheel -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="#9E2B25" stroke-width="1" opacity="0.4" stroke-dasharray="3 5"/>

  <!-- Central "2027" label -->
  <circle cx="160" cy="160" r="42" fill="#9E2B25" opacity="0.08"/>
  <text x="160" y="152" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="30" font-weight="700" fill="#9E2B25">2027</text>
  <text x="160" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#78716c" letter-spacing="2">GOCHAR</text>

  <!-- Jupiter — TOP position -->
  <circle cx="160" cy="55" r="22" fill="url(#jup-g27)"/>
  <text x="160" y="62" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="24" font-weight="700" fill="#78350f">♃</text>
  <text x="160" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#a16207" letter-spacing="1">JUPITER</text>

  <!-- Saturn, Pisces into Aries — BOTTOM position -->
  <circle cx="160" cy="265" r="20" fill="url(#sat-g27)"/>
  <text x="160" y="272" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="22" font-weight="700" fill="#f5f3ff">♄</text>
  <text x="160" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">PISCES TO ARIES</text>

  <!-- Rahu (left) and Ketu (right) — nodal axis -->
  <circle cx="55" cy="160" r="15" fill="#140F1C" opacity="0.85"/>
  <text x="55" y="166" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="18" font-weight="700" fill="#FAF6EF">☊</text>

  <circle cx="265" cy="160" r="15" fill="#57534e" opacity="0.85"/>
  <text x="265" y="166" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="18" font-weight="700" fill="#fef3c7">☋</text>

  <!-- Connecting axis line for Rahu-Ketu -->
  <line x1="70" y1="160" x2="250" y2="160" stroke="#9E2B25" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 4"/>
</svg>
