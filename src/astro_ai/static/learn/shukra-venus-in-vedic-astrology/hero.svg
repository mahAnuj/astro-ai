<?xml version="1.0" encoding="UTF-8"?>
<!-- Shukra (Venus): pearlescent white-pink planet body with soft harmony rays.
     Emphasises grace, art, beauty, love. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Shukra (Venus) — the planet of love and beauty">
  <defs>
    <radialGradient id="aura-vn" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fbcfe8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ven-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="55%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-vn)"/>

  <g fill="#9E2B25" opacity="0.4">
    <circle cx="45"  cy="65"  r="1.5"/>
    <circle cx="270" cy="80"  r="2"/>
    <circle cx="60"  cy="260" r="1.5"/>
    <circle cx="275" cy="250" r="1.5"/>
  </g>

  <!-- Petal / harmony rays — 8 soft curves suggesting a lotus / flower -->
  <g fill="none" stroke="#ec4899" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M 160 55 Q 175 100 160 130"/>
    <path d="M 160 265 Q 145 220 160 190"/>
    <path d="M 55 160 Q 100 145 130 160"/>
    <path d="M 265 160 Q 220 175 190 160"/>
    <path d="M 85 85 Q 115 110 130 130"/>
    <path d="M 235 235 Q 205 210 190 190"/>
    <path d="M 235 85 Q 205 110 190 130"/>
    <path d="M 85 235 Q 115 210 130 190"/>
  </g>

  <!-- Venus body -->
  <circle cx="160" cy="160" r="74" fill="url(#ven-body)"/>

  <!-- Highlight — pearlescent shine -->
  <ellipse cx="140" cy="135" rx="18" ry="10" fill="#fefce8" opacity="0.35"/>

  <!-- Venus glyph ♀ -->
  <text x="160" y="176" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="52" font-weight="700" fill="#831843" opacity="0.85">♀</text>
</svg>
