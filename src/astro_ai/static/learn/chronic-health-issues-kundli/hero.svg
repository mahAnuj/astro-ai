<?xml version="1.0" encoding="UTF-8"?>
<!-- Chronic health — visual metaphor: a human silhouette with a
     subtle Kalapurusha overlay (zodiac around the body), a small
     6th-house indicator in a kundali, and a warm healing lotus at
     the base. Muted teal/gold — respectful of the topic, not clinical. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Chronic health — human silhouette with zodiac body-region markers and healing lotus">
  <defs>
    <radialGradient id="ch_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ch_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="ch_lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="170" rx="150" ry="140" fill="url(#ch_aura)"/>

  <!-- Small kundali in top-right with 6th house highlighted -->
  <g transform="translate(240, 55)">
    <rect x="-25" y="-22" width="50" height="42" fill="none" stroke="#B03A22" stroke-width="1.2" opacity="0.55"/>
    <polygon points="0,-22 25,0 0,22 -25,0" fill="none" stroke="#B03A22" stroke-width="1" opacity="0.55"/>
    <!-- 6th house at lower-left -->
    <circle cx="-16" cy="-4" r="6" fill="#14b8a6" opacity="0.75"/>
    <text x="-16" y="-1" text-anchor="middle" font-family="serif" font-size="7" fill="#134e4a" font-weight="700">6</text>
  </g>

  <!-- Human silhouette centered -->
  <g fill="url(#ch_body)" opacity="0.85">
    <!-- Head (Aries — head/brain) -->
    <circle cx="160" cy="90" r="18"/>
    <!-- Torso -->
    <path d="M 138 108 Q 138 130, 148 135 L 172 135 Q 182 130, 182 108 Z" />
    <path d="M 145 135 L 145 195 Q 145 205, 155 205 L 165 205 Q 175 205, 175 195 L 175 135 Z"/>
    <!-- Arms (Gemini — arms) -->
    <path d="M 138 118 L 118 165 Q 116 170, 121 172 L 125 170 L 142 130 Z"/>
    <path d="M 182 118 L 202 165 Q 204 170, 199 172 L 195 170 L 178 130 Z"/>
    <!-- Legs -->
    <path d="M 148 205 L 145 260 Q 145 265, 150 265 L 158 265 Q 162 265, 162 260 L 162 205 Z"/>
    <path d="M 172 205 L 175 260 Q 175 265, 170 265 L 162 265 Q 158 265, 158 260 L 158 205 Z"/>
  </g>

  <!-- Body-region markers (Kalapurusha zodiac points) -->
  <g fill="#f59e0b" opacity="0.85">
    <!-- Head (Aries) -->
    <circle cx="160" cy="90" r="3"/>
    <!-- Heart / chest (Cancer) -->
    <circle cx="160" cy="145" r="3"/>
    <!-- Stomach (Leo) -->
    <circle cx="160" cy="170" r="3"/>
    <!-- Knees (Capricorn) -->
    <circle cx="153" cy="235" r="2.5"/>
    <circle cx="167" cy="235" r="2.5"/>
  </g>

  <!-- Subtle body-region labels -->
  <g font-family="serif" font-size="8" fill="#78350f" opacity="0.75">
    <text x="200" y="93" text-anchor="start">Aries — head</text>
    <text x="200" y="148" text-anchor="start">Cancer — heart</text>
    <text x="200" y="238" text-anchor="start">Capricorn — knees</text>
  </g>

  <!-- Healing lotus at bottom center -->
  <g transform="translate(160, 285)">
    <!-- Outer petals -->
    <ellipse cx="-14" cy="-2" rx="10" ry="5" fill="url(#ch_lotus)" opacity="0.85" transform="rotate(-25 -14 -2)"/>
    <ellipse cx="14" cy="-2" rx="10" ry="5" fill="url(#ch_lotus)" opacity="0.85" transform="rotate(25 14 -2)"/>
    <ellipse cx="0" cy="-6" rx="10" ry="5" fill="url(#ch_lotus)" opacity="0.95"/>
    <!-- Center -->
    <circle cx="0" cy="-3" r="3" fill="#b45309"/>
  </g>

  <!-- Base line -->
  <line x1="30" y1="295" x2="290" y2="295" stroke="#14b8a6" stroke-width="1" opacity="0.4"/>
</svg>
