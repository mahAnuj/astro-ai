<?xml version="1.0" encoding="UTF-8"?>
<!-- Ashwini nakshatra hero — stylised horse's head (Ashwini's symbol)
     with a golden sunrise (the Ashwini Kumaras arrive at dawn) behind.
     Brand palette: astro purple, cream, gold accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Ashwini nakshatra symbol — horse's head at dawn">
  <defs>
    <radialGradient id="dawn" cx="0.5" cy="0.68" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="45%" stop-color="#fde68a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f5f5f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horse" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#B03A22"/>
      <stop offset="60%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="sunray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Cream background rounded card -->
  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Dawn glow -->
  <ellipse cx="160" cy="215" rx="150" ry="120" fill="url(#dawn)"/>

  <!-- Sun disc rising at bottom -->
  <circle cx="160" cy="235" r="34" fill="#fbbf24"/>
  <circle cx="160" cy="235" r="34" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Sun rays (subtle) -->
  <g stroke="url(#sunray)" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="180" x2="160" y2="160"/>
    <line x1="128" y1="188" x2="112" y2="176"/>
    <line x1="192" y1="188" x2="208" y2="176"/>
    <line x1="105" y1="215" x2="82"  y2="215"/>
    <line x1="215" y1="215" x2="238" y2="215"/>
  </g>

  <!-- Horse silhouette head — facing right, mane flowing -->
  <g fill="url(#horse)">
    <path d="M 120 155
             C 118 130, 128 105, 152 92
             C 172 82, 195 84, 212 96
             C 222 103, 227 115, 226 128
             L 232 128
             C 240 128, 245 132, 245 138
             C 245 144, 240 148, 233 148
             L 226 148
             C 224 156, 220 163, 215 168
             L 218 180
             C 219 184, 217 187, 213 187
             L 205 187
             L 200 178
             C 190 182, 178 183, 168 181
             L 162 195
             C 160 199, 156 200, 152 197
             L 145 191
             C 138 188, 132 182, 128 175
             L 118 170
             C 114 168, 113 164, 116 160 Z"/>
    <!-- Mane wisps -->
    <path d="M 148 92
             C 138 82, 130 78, 122 82
             C 128 88, 135 92, 142 96
             Z"/>
    <path d="M 158 90
             C 152 76, 148 68, 142 66
             C 146 76, 150 84, 155 92
             Z"/>
  </g>

  <!-- Horse eye (gold dot) -->
  <circle cx="199" cy="121" r="3" fill="#fbbf24"/>

  <!-- Nostril (small dark accent) -->
  <ellipse cx="234" cy="140" rx="2.5" ry="1.5" fill="#140F1C"/>

  <!-- Small "1" — first nakshatra -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#9E2B25" opacity="0.35">1</text>
</svg>
