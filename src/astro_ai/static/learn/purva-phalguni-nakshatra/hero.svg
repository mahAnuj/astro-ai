<?xml version="1.0" encoding="UTF-8"?>
<!-- Purva Phalguni — the "former reddish one". Symbol: front legs of
     a bed, or hammock. Deity: Bhaga (delight, luxury). Ruled by
     Venus. Rendered as a lush hammock/canopy with flowering vines. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Purva Phalguni nakshatra symbol — a flowering hammock of delight">
  <defs>
    <radialGradient id="pfglow" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0%" stop-color="#fce7f3" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fbcfe8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pfhammock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pfrope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="180" rx="150" ry="130" fill="url(#pfglow)"/>

  <!-- Two posts (front legs of a bed) -->
  <rect x="55" y="90" width="12" height="180" fill="url(#pfrope)" rx="3"/>
  <rect x="253" y="90" width="12" height="180" fill="url(#pfrope)" rx="3"/>

  <!-- Post caps (decorative bulbs) -->
  <circle cx="61" cy="85" r="9" fill="#fbbf24"/>
  <circle cx="259" cy="85" r="9" fill="#fbbf24"/>

  <!-- Rope suspension to hammock -->
  <path d="M 65 100 Q 85 110, 100 145" stroke="url(#pfrope)" stroke-width="2.5" fill="none"/>
  <path d="M 255 100 Q 235 110, 220 145" stroke="url(#pfrope)" stroke-width="2.5" fill="none"/>

  <!-- Hammock — curved trapezoid -->
  <path d="M 95 150
           C 105 200, 140 225, 160 225
           C 180 225, 215 200, 225 150
           Q 220 148, 200 148
           Q 160 145, 120 148
           Q 100 148, 95 150 Z"
        fill="url(#pfhammock)"/>

  <!-- Hammock stripes (fabric detail) -->
  <g stroke="#fef9c3" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 100 160 Q 160 175, 220 160"/>
    <path d="M 105 178 Q 160 195, 215 178"/>
    <path d="M 115 198 Q 160 213, 205 198"/>
  </g>

  <!-- Flowers on the posts (Bhaga's delight) -->
  <g>
    <!-- Left post flower -->
    <circle cx="55" cy="120" r="4" fill="#fbbf24"/>
    <circle cx="50" cy="115" r="3" fill="#f472b6"/>
    <circle cx="60" cy="115" r="3" fill="#f472b6"/>
    <circle cx="50" cy="125" r="3" fill="#f472b6"/>
    <circle cx="60" cy="125" r="3" fill="#f472b6"/>
    <!-- Right post flower -->
    <circle cx="259" cy="120" r="4" fill="#fbbf24"/>
    <circle cx="254" cy="115" r="3" fill="#f472b6"/>
    <circle cx="264" cy="115" r="3" fill="#f472b6"/>
    <circle cx="254" cy="125" r="3" fill="#f472b6"/>
    <circle cx="264" cy="125" r="3" fill="#f472b6"/>
  </g>

  <!-- Small "11" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#6b21a8" opacity="0.35">11</text>
</svg>
