<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Sun remedies — Surya practices for confidence, authority, and vitality">
  <defs>
    <radialGradient id="sr_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="sr_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#sr_aura)"/>
  <!-- Sun with 12 rays -->
  <g transform="translate(160, 160)">
    <g fill="#f59e0b" opacity="0.85">
      <path d="M 0 -110 L 8 -80 L -8 -80 Z"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(30)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(60)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(90)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(120)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(150)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(180)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(210)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(240)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(270)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(300)"/>
      <path d="M 0 -110 L 8 -80 L -8 -80 Z" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="60" fill="url(#sr_glow)"/>
    <text x="0" y="10" font-family="Noto Sans Devanagari, serif" font-size="40" text-anchor="middle" fill="#78350f">☉</text>
  </g>
</svg>
