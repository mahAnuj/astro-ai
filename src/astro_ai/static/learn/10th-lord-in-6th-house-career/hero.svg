<?xml version="1.0" encoding="UTF-8"?>
<!-- 10th Lord in the 6th House — visual metaphor: a stylized kundali diamond
     with a highlighted "10" house at top and a highlighted "6" house at the
     right-side wing, connected by an arrow-arc showing the ruler travelling
     from throne (10) to battlefield (6). Below, a small tool / gavel /
     stethoscope silhouette suggesting service-through-struggle. Purple/gold
     on cream. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="10th lord in 6th house — the ruler of the career house travelling to the house of struggle and service">
  <defs>
    <radialGradient id="tl6_aura" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl6_arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tl6_house6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CB5A2E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9E2B25" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="tl6_house10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="140" rx="150" ry="115" fill="url(#tl6_aura)"/>

  <!-- Kundali diamond (North-Indian) at centre -->
  <g transform="translate(160, 160)" stroke="#9E2B25" fill="none">
    <rect x="-100" y="-100" width="200" height="200" stroke-width="2"/>
    <polygon points="0,-100 100,0 0,100 -100,0" stroke-width="1.6"/>
    <line x1="-100" y1="-100" x2="100" y2="100" stroke-width="1.2" opacity="0.7"/>
    <line x1="100" y1="-100" x2="-100" y2="100" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- 10th house triangle (top-centre) — highlighted -->
  <g transform="translate(160, 160)">
    <polygon points="0,-100 -50,-50 50,-50" fill="url(#tl6_house10)"/>
    <text x="0" y="-70" text-anchor="middle" font-family="serif" font-size="17" fill="#78350f" font-weight="800">10</text>
  </g>

  <!-- 6th house triangle (right-upper diamond wing) — highlighted -->
  <g transform="translate(160, 160)">
    <polygon points="100,0 50,-50 50,50" fill="url(#tl6_house6)"/>
    <text x="70" y="5" text-anchor="middle" font-family="serif" font-size="17" fill="#140F1C" font-weight="800">6</text>
  </g>

  <!-- Arrow arc from 10 to 6 (the lord's journey) -->
  <path d="M 155 92 Q 235 90 240 145" fill="none"
        stroke="url(#tl6_arrow)" stroke-width="3.2" stroke-linecap="round"
        stroke-dasharray="0" opacity="0.9"/>
  <!-- Arrow head near 6 -->
  <polygon points="240,145 233,140 235,152" fill="#d97706" opacity="0.95"/>

  <!-- Small lord glyph (crown circle) at the 10 -->
  <g transform="translate(160, 92)">
    <circle r="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <path d="M -6 2 L -6 -3 L -2 0 L 0 -5 L 2 0 L 6 -3 L 6 2 Z"
          fill="#78350f"/>
  </g>

  <!-- Service-through-struggle silhouette below (crossed tools: gavel + spanner shape) -->
  <g transform="translate(160, 260)" opacity="0.85">
    <!-- Gavel -->
    <g stroke="#140F1C" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="-30" y1="-15" x2="20" y2="15"/>
    </g>
    <rect x="-40" y="-25" width="20" height="14" rx="2" fill="#140F1C" transform="rotate(30 -30 -18)"/>
    <!-- Spanner-ish shape -->
    <g stroke="#B03A22" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="30" y1="-15" x2="-20" y2="15"/>
    </g>
    <circle cx="30" cy="-15" r="5" fill="#B03A22"/>
  </g>

  <!-- Base line -->
  <ellipse cx="160" cy="290" rx="85" ry="4" fill="#78716c" opacity="0.15"/>

  <!-- Gold accent dots -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="45" cy="55" r="1.8"/>
    <circle cx="275" cy="60" r="2.1"/>
    <circle cx="30" cy="95" r="1.5"/>
    <circle cx="290" cy="90" r="1.6"/>
    <circle cx="55" cy="30" r="1.5"/>
    <circle cx="265" cy="28" r="1.6"/>
  </g>
</svg>
