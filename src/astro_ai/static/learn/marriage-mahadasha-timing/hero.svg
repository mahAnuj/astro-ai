<?xml version="1.0" encoding="UTF-8"?>
<!-- Marriage Timing by Mahadasha — nine planetary clocks around a
     central wedding-symbol, one for each Vimshottari planet, with the
     Venus and Jupiter clocks glowing to indicate the strongest triggers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Marriage timing across the 9 Vimshottari Mahadashas — Venus and Jupiter are strongest triggers">
  <defs>
    <radialGradient id="mmt_aura" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmt_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mmt_center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="mmt_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Central warm aura -->
  <circle cx="160" cy="160" r="130" fill="url(#mmt_aura)"/>

  <!-- Central heart / wedding symbol -->
  <g transform="translate(160 160)">
    <circle r="30" fill="url(#mmt_center)" opacity="0.9"/>
    <path d="M 0 -12
             C -8 -20, -20 -14, -20 -4
             C -20 6, -10 14, 0 22
             C 10 14, 20 6, 20 -4
             C 20 -14, 8 -20, 0 -12 Z"
          fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- 9 planetary clocks arranged in a ring -->
  <!-- Positions: 0deg=top, going clockwise for the 9 planets -->
  <g font-family="Crimson Pro, Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">
    <!-- 12 o'clock: Sun -->
    <circle cx="160" cy="55" r="18" fill="#fef3c7" stroke="#78350f" stroke-width="1.5"/>
    <text x="160" y="63" fill="#78350f">☉</text>

    <!-- Rotating positions for 8 more planets around a 108px radius circle -->
    <!-- 40deg: Moon -->
    <circle cx="228" cy="80" r="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="228" y="88" fill="#334155">☾</text>

    <!-- 80deg: Mars -->
    <circle cx="266" cy="140" r="18" fill="#fee2e2" stroke="#9f1239" stroke-width="1.5"/>
    <text x="266" y="148" fill="#9f1239">♂</text>

    <!-- 120deg: Rahu -->
    <circle cx="266" cy="200" r="18" fill="#ede9fe" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="266" y="208" fill="#4c1d95">☊</text>

    <!-- 160deg: JUPITER (glowing — strongest for female charts) -->
    <circle cx="228" cy="260" r="24" fill="url(#mmt_glow)"/>
    <circle cx="228" cy="260" r="18" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
    <text x="228" y="268" fill="#78350f" font-size="22">♃</text>

    <!-- 200deg: Saturn -->
    <circle cx="160" cy="285" r="18" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="160" y="293" fill="#1e293b">♄</text>

    <!-- 240deg: Mercury -->
    <circle cx="92" cy="260" r="18" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
    <text x="92" y="268" fill="#166534">☿</text>

    <!-- 280deg: Ketu -->
    <circle cx="54" cy="200" r="18" fill="#ede9fe" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="54" y="208" fill="#4c1d95">☋</text>

    <!-- 320deg: VENUS (glowing — strongest for male charts) -->
    <circle cx="54" cy="140" r="24" fill="url(#mmt_glow)"/>
    <circle cx="54" cy="140" r="18" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
    <text x="54" y="148" fill="#78350f" font-size="22">♀</text>

    <!-- 360deg: (back to Sun) — but we placed a slot at 320 already; add Moon-mars gap fill -->
  </g>

  <!-- Connecting arcs from Venus and Jupiter TO the center (highlighting the triggers) -->
  <g stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.65" stroke-dasharray="4,4">
    <line x1="72" y1="140" x2="140" y2="155"/>
    <line x1="212" y1="255" x2="175" y2="180"/>
  </g>

  <!-- Small text label -->
  <text x="160" y="20" text-anchor="middle"
        font-family="Inter, Helvetica, sans-serif"
        font-size="11" font-weight="600" fill="#78350f" letter-spacing="2">MARRIAGE MAHADASHA</text>
</svg>
