<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Dhana Yogas — wealth combinations in your kundli">
  <defs>
    <radialGradient id="dy_gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="dy_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#dy_aura)"/>
  <!-- Central gold coin -->
  <circle cx="160" cy="160" r="80" fill="url(#dy_gold)" stroke="#78350f" stroke-width="3"/>
  <text x="160" y="180" font-family="Noto Sans Devanagari, serif" font-size="60" text-anchor="middle" fill="#78350f">श्री</text>
  <!-- 9 wealth points around -->
  <g fill="#CB5A2E" opacity="0.85">
    <circle cx="160" cy="50" r="8"/>
    <circle cx="220" cy="80" r="8"/>
    <circle cx="260" cy="140" r="8"/>
    <circle cx="260" cy="200" r="8"/>
    <circle cx="220" cy="260" r="8"/>
    <circle cx="160" cy="285" r="8"/>
    <circle cx="100" cy="260" r="8"/>
    <circle cx="60" cy="200" r="8"/>
    <circle cx="60" cy="140" r="8"/>
  </g>
</svg>
