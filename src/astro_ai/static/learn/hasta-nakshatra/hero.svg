<?xml version="1.0" encoding="UTF-8"?>
<!-- Hasta — the "hand". Symbol: an open palm / hand. Deity: Savitar
     (Sun as inspirer). Ruled by the Moon. Rendered as an open golden
     palm with subtle inspiration rays. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Hasta nakshatra symbol — an open palm with inspiration rays">
  <defs>
    <radialGradient id="hastaglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hastapalm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4A96A"/>
      <stop offset="60%" stop-color="#B03A22"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <linearGradient id="hastalight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <circle cx="160" cy="170" r="140" fill="url(#hastaglow)"/>

  <!-- Rays of light streaming down from top (Savitar) -->
  <g stroke="url(#hastalight)" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="160" y1="10" x2="160" y2="70"/>
    <line x1="120" y1="20" x2="130" y2="72"/>
    <line x1="200" y1="20" x2="190" y2="72"/>
    <line x1="90" y1="35" x2="105" y2="80"/>
    <line x1="230" y1="35" x2="215" y2="80"/>
  </g>

  <!-- Palm - open hand with fingers up -->
  <g fill="url(#hastapalm)">
    <!-- Palm body -->
    <path d="M 110 190
             Q 105 175, 108 155
             Q 108 148, 115 145
             L 205 145
             Q 212 148, 212 155
             Q 215 175, 210 190
             L 210 265
             Q 210 275, 200 275
             L 120 275
             Q 110 275, 110 265 Z"/>
    <!-- Thumb -->
    <path d="M 108 175
             Q 90 175, 82 160
             Q 78 152, 82 145
             Q 88 138, 96 141
             Q 105 145, 108 155 Z"/>
    <!-- Fingers -->
    <!-- Index -->
    <rect x="114" y="80" width="18" height="80" rx="9"/>
    <!-- Middle -->
    <rect x="140" y="68" width="18" height="92" rx="9"/>
    <!-- Ring -->
    <rect x="166" y="75" width="18" height="85" rx="9"/>
    <!-- Pinky -->
    <rect x="192" y="90" width="16" height="70" rx="8"/>
  </g>

  <!-- Palm lines (subtle) -->
  <g stroke="#fef9c3" stroke-width="1.5" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M 125 180 Q 155 195, 195 178"/>
    <path d="M 128 205 Q 160 220, 200 205"/>
    <path d="M 145 195 Q 148 225, 152 250"/>
  </g>

  <!-- Small "13" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#9E2B25" opacity="0.35">13</text>
</svg>
