<?xml version="1.0" encoding="UTF-8"?>
<!-- Stylised Mars (Mangal) glyph with surrounding energy.
     Custom illustration matching Shubh Bhagya brand palette (purple + gold +
     a Mars-red accent). Decorative; carries no informational content. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Mars (Mangal) symbol with energy aura">
  <defs>
    <radialGradient id="aura" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#fecaca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E2B25"/>
      <stop offset="100%" stop-color="#17131A"/>
    </linearGradient>
  </defs>

  <!-- Soft aura backdrop -->
  <circle cx="160" cy="170" r="140" fill="url(#aura)"/>

  <!-- Decorative outer ring with tick marks (a stylised zodiac wheel) -->
  <circle cx="160" cy="170" r="118" fill="none" stroke="#9E2B25" stroke-width="1.5" opacity="0.35"/>
  <g stroke="#9E2B25" stroke-width="1.5" opacity="0.4">
    <line x1="160" y1="52"  x2="160" y2="60"/>
    <line x1="160" y1="280" x2="160" y2="288"/>
    <line x1="42"  y1="170" x2="50"  y2="170"/>
    <line x1="270" y1="170" x2="278" y2="170"/>
    <line x1="78"  y1="88"  x2="84"  y2="94"/>
    <line x1="236" y1="88"  x2="242" y2="94"/>
    <line x1="78"  y1="252" x2="84"  y2="246"/>
    <line x1="236" y1="252" x2="242" y2="246"/>
  </g>

  <!-- Mid ring with gold dots (the 12 rashis) -->
  <g fill="#d97706">
    <circle cx="160" cy="78"  r="3"/>
    <circle cx="217" cy="93"  r="3"/>
    <circle cx="259" cy="135" r="3"/>
    <circle cx="259" cy="205" r="3"/>
    <circle cx="217" cy="247" r="3"/>
    <circle cx="160" cy="262" r="3"/>
    <circle cx="103" cy="247" r="3"/>
    <circle cx="61"  cy="205" r="3"/>
    <circle cx="61"  cy="135" r="3"/>
    <circle cx="103" cy="93"  r="3"/>
    <circle cx="138" cy="84"  r="2"/>
    <circle cx="182" cy="84"  r="2"/>
  </g>

  <!-- Mars planet body -->
  <circle cx="160" cy="180" r="48" fill="url(#planet)"/>

  <!-- Subtle surface "canyons" on the planet -->
  <g stroke="#7f1d1d" stroke-width="1.5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M133 168 q12 -8 25 -2 t30 4"/>
    <path d="M138 192 q14 6 30 0 t22 -6"/>
    <path d="M148 207 q12 4 22 -3"/>
  </g>

  <!-- Classical Mars symbol — circle with arrow at 45° (over the planet) -->
  <g transform="translate(192 148)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#ffd764" stroke-width="3.5"/>
    <line x1="11" y1="-11" x2="28" y2="-28" stroke="#ffd764" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="20,-28 28,-28 28,-20" fill="none" stroke="#ffd764" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Devanagari label below -->
  <text x="160" y="305" text-anchor="middle"
        font-family="'Noto Sans Devanagari', serif"
        font-size="22" fill="#9E2B25" font-weight="600" letter-spacing="2">मंगल</text>
</svg>
