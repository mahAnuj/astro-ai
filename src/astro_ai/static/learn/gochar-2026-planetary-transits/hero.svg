<?xml version="1.0" encoding="UTF-8"?>
<!-- Gochar 2026: a stylised orbital map showing the key transits of the year.
     Jupiter in Cancer (exalted!) at the top in gold, Saturn in Pisces at the
     bottom in slate, and the Rahu-Ketu axis. Emphasises the "year in the sky"
     story rather than any single planet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Gochar 2026 — the year's major planetary transits">
  <defs>
    <radialGradient id="aura-g26" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f0e7fb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jup-g26" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="sat-g26" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-g26)"/>

  <!-- Stars -->
  <g fill="#6b21a8" opacity="0.4">
    <circle cx="45"  cy="55"  r="1.5"/>
    <circle cx="275" cy="70"  r="2"/>
    <circle cx="55"  cy="260" r="1.5"/>
    <circle cx="285" cy="245" r="1.5"/>
    <circle cx="20"  cy="165" r="1"/>
    <circle cx="300" cy="170" r="1"/>
  </g>

  <!-- Orbital ring — represents the zodiac wheel -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="#6b21a8" stroke-width="1" opacity="0.4" stroke-dasharray="3 5"/>

  <!-- Central "2026" label -->
  <circle cx="160" cy="160" r="42" fill="#6b21a8" opacity="0.08"/>
  <text x="160" y="152" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="30" font-weight="700" fill="#6b21a8">2026</text>
  <text x="160" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#78716c" letter-spacing="2">GOCHAR</text>

  <!-- Jupiter exalted in Cancer — TOP position (most-important 2026 transit) -->
  <circle cx="160" cy="55" r="22" fill="url(#jup-g26)"/>
  <text x="160" y="62" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="24" font-weight="700" fill="#78350f">♃</text>
  <text x="160" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#a16207" letter-spacing="1">EXALTED</text>

  <!-- Saturn in Pisces — BOTTOM position -->
  <circle cx="160" cy="265" r="20" fill="url(#sat-g26)"/>
  <text x="160" y="272" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="22" font-weight="700" fill="#f5f3ff">♄</text>
  <text x="160" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569" letter-spacing="1">PISCES</text>

  <!-- Rahu (left) and Ketu (right) — nodal axis -->
  <circle cx="55" cy="160" r="15" fill="#4c1d95" opacity="0.85"/>
  <text x="55" y="166" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="18" font-weight="700" fill="#ede9fe">☊</text>

  <circle cx="265" cy="160" r="15" fill="#57534e" opacity="0.85"/>
  <text x="265" y="166" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="18" font-weight="700" fill="#fef3c7">☋</text>

  <!-- Connecting axis line for Rahu-Ketu -->
  <line x1="70" y1="160" x2="250" y2="160" stroke="#6b21a8" stroke-width="0.8" opacity="0.35" stroke-dasharray="4 4"/>
</svg>
