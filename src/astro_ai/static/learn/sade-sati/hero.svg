<?xml version="1.0" encoding="UTF-8"?>
<!-- Saturn (Shani) with rings + Moon (Chandra) being transited. The
     three-phase concept rendered as three small marker arcs showing
     Saturn's slow movement across the Moon's neighbourhood. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Saturn transiting the Moon">
  <defs>
    <radialGradient id="aura-ss" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e0e7ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saturn-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#3b3530"/>
    </linearGradient>
    <linearGradient id="moon-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Soft cosmic backdrop -->
  <circle cx="160" cy="165" r="140" fill="url(#aura-ss)"/>

  <!-- Saturn's slow orbital arc — the 7.5-year path -->
  <path d="M 60 200 Q 160 100 260 200" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>

  <!-- Three phase markers along the arc -->
  <g fill="#6b21a8" opacity="0.55">
    <circle cx="115" cy="155" r="3.5"/>
    <text x="115" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6b21a8" font-weight="600">Anu</text>
    <circle cx="160" cy="140" r="4.5"/>
    <text x="160" y="123" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6b21a8" font-weight="600">Madhya</text>
    <circle cx="205" cy="155" r="3.5"/>
    <text x="205" y="138" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#6b21a8" font-weight="600">Uttara</text>
  </g>

  <!-- Moon (Chandra) — the thing being transited, smaller, lower -->
  <circle cx="160" cy="200" r="22" fill="url(#moon-body)" stroke="#fcd34d" stroke-width="1.5"/>
  <!-- Subtle crater texture -->
  <g fill="#e5b56b" opacity="0.4">
    <circle cx="154" cy="196" r="2"/>
    <circle cx="165" cy="205" r="1.5"/>
    <circle cx="158" cy="208" r="1"/>
  </g>

  <!-- Saturn — at Madhya position (over the Moon), shown ahead in the arc -->
  <ellipse cx="160" cy="140" rx="50" ry="14" fill="none" stroke="#9ca3af" stroke-width="1.5" opacity="0.7" transform="rotate(-12 160 140)"/>
  <ellipse cx="160" cy="140" rx="40" ry="10" fill="none" stroke="#d1d5db" stroke-width="1" opacity="0.5" transform="rotate(-12 160 140)"/>
  <circle cx="160" cy="140" r="28" fill="url(#saturn-body)"/>
  <!-- Front part of rings -->
  <path d="M 110 142 Q 160 158 210 142" fill="none" stroke="#9ca3af" stroke-width="2" opacity="0.8"/>

  <!-- Shani symbol — classical mark -->
  <g transform="translate(184 116)" stroke="#ffd764" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M0 8 Q 6 -2 12 8"/>
    <line x1="6" y1="3" x2="6" y2="14"/>
  </g>

  <!-- Devanagari label -->
  <text x="160" y="295" text-anchor="middle"
        font-family="'Noto Sans Devanagari', serif"
        font-size="20" fill="#6b21a8" font-weight="600">साढ़े साती</text>
</svg>
