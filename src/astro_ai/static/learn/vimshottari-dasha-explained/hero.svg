<?xml version="1.0" encoding="UTF-8"?>
<!-- Vimshottari Dasha: a 120-year timeline wheel. Nine segments sized by their
     Mahadasha years (Ketu 7, Venus 20, Sun 6, Moon 10, Mars 7, Rahu 18,
     Jupiter 16, Saturn 19, Mercury 17). Arc lengths proportional to years. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Vimshottari Dasha 120-year wheel">
  <defs>
    <radialGradient id="aura-vd" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f0e7fb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-vd)"/>

  <!-- Timeline wheel — 9 segments proportional to years (total 120).
       Each arc uses stroke-dasharray around a large circle for simplicity.
       Radius 100, circumference ≈ 628. Segments by fraction of 120 years. -->
  <g fill="none" stroke-width="20" transform="rotate(-90 160 160)">
    <!-- Ketu 7y (7/120 = 5.83%) -->
    <circle cx="160" cy="160" r="100" stroke="#a16207" stroke-dasharray="36.6 591.6"/>
    <!-- Venus 20y (16.67%) -->
    <circle cx="160" cy="160" r="100" stroke="#ec4899" stroke-dasharray="104.7 523.5" stroke-dashoffset="-36.6"/>
    <!-- Sun 6y (5%) -->
    <circle cx="160" cy="160" r="100" stroke="#d97706" stroke-dasharray="31.4 596.8" stroke-dashoffset="-141.3"/>
    <!-- Moon 10y (8.33%) -->
    <circle cx="160" cy="160" r="100" stroke="#94a3b8" stroke-dasharray="52.4 575.8" stroke-dashoffset="-172.7"/>
    <!-- Mars 7y (5.83%) -->
    <circle cx="160" cy="160" r="100" stroke="#dc2626" stroke-dasharray="36.6 591.6" stroke-dashoffset="-225.1"/>
    <!-- Rahu 18y (15%) -->
    <circle cx="160" cy="160" r="100" stroke="#4b5563" stroke-dasharray="94.3 533.9" stroke-dashoffset="-261.7"/>
    <!-- Jupiter 16y (13.33%) -->
    <circle cx="160" cy="160" r="100" stroke="#eab308" stroke-dasharray="83.8 544.4" stroke-dashoffset="-356.0"/>
    <!-- Saturn 19y (15.83%) -->
    <circle cx="160" cy="160" r="100" stroke="#1c1917" stroke-dasharray="99.5 528.7" stroke-dashoffset="-439.8"/>
    <!-- Mercury 17y (14.17%) -->
    <circle cx="160" cy="160" r="100" stroke="#16a34a" stroke-dasharray="89.0 539.2" stroke-dashoffset="-539.3"/>
  </g>

  <!-- Center label -->
  <text x="160" y="152" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="30" font-weight="700" fill="#6b21a8">120</text>
  <text x="160" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#78716c" letter-spacing="1.5">YEARS</text>
</svg>
