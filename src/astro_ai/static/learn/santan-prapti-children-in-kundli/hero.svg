<?xml version="1.0" encoding="UTF-8"?>
<!-- Santan Prapti — visual metaphor: a small sprouting seedling
     inside a cupped-hands shape, with Jupiter as a warm halo above
     and a subtle 5th-house indicator in a small kundali. Warm gold
     and soft green — hopeful but respectful of the emotional load. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Santan Prapti — a seedling in cupped hands under a warm Jupiter halo">
  <defs>
    <radialGradient id="sp_aura" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp_hands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sp_leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="sp_jupiter" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="170" rx="150" ry="140" fill="url(#sp_aura)"/>

  <!-- Small kundali in top-right with 5th house highlighted -->
  <g transform="translate(240, 55)">
    <rect x="-25" y="-22" width="50" height="42" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
    <polygon points="0,-22 25,0 0,22 -25,0" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.55"/>
    <!-- 5th house at lower-left inner triangle -->
    <circle cx="-13" cy="8" r="6" fill="#fbbf24" opacity="0.75"/>
    <text x="-13" y="11" text-anchor="middle" font-family="serif" font-size="7" fill="#78350f" font-weight="700">5</text>
  </g>

  <!-- Jupiter (Guru) — warm circle above -->
  <g transform="translate(160, 80)">
    <circle cx="0" cy="0" r="22" fill="url(#sp_jupiter)" opacity="0.9"/>
    <!-- Ring around Jupiter -->
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.55"/>
    <text x="0" y="4" text-anchor="middle" font-family="serif" font-size="11" fill="#78350f" font-weight="700">Guru</text>
  </g>

  <!-- Gentle rays of blessing from Jupiter downward -->
  <g stroke="#fbbf24" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
    <line x1="150" y1="105" x2="140" y2="150"/>
    <line x1="160" y1="105" x2="160" y2="150"/>
    <line x1="170" y1="105" x2="180" y2="150"/>
  </g>

  <!-- Cupped hands at bottom center -->
  <g fill="url(#sp_hands)">
    <!-- Left hand -->
    <path d="M 90 210 Q 88 190, 105 180 Q 130 175, 150 200 L 160 235 L 100 240 Q 88 232, 90 210 Z" opacity="0.92"/>
    <!-- Right hand -->
    <path d="M 230 210 Q 232 190, 215 180 Q 190 175, 170 200 L 160 235 L 220 240 Q 232 232, 230 210 Z" opacity="0.92"/>
  </g>

  <!-- Seedling emerging from the cupped hands -->
  <g transform="translate(160, 200)">
    <!-- Small pot of soil visible between hands -->
    <ellipse cx="0" cy="12" rx="18" ry="4" fill="#78350f" opacity="0.55"/>
    <!-- Stem -->
    <line x1="0" y1="10" x2="0" y2="-25" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M 0 -10 Q -14 -18, -18 -8 Q -12 -5, 0 -10 Z" fill="url(#sp_leaf)"/>
    <!-- Right leaf -->
    <path d="M 0 -15 Q 14 -22, 18 -12 Q 12 -9, 0 -15 Z" fill="url(#sp_leaf)"/>
    <!-- Top bud -->
    <circle cx="0" cy="-27" r="4" fill="#86efac"/>
  </g>

  <!-- Ground line -->
  <line x1="30" y1="272" x2="290" y2="272" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
</svg>
