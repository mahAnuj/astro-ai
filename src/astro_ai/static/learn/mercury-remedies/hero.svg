<?xml version="1.0" encoding="UTF-8"?>
<!-- Mercury Remedies — Budha as intellect / speech / commerce.
     Green palette (Mercury's grass-green color); a scroll/quill and
     an emerald glint with a green flower. Scholarly, articulate, gentle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Mercury Remedies — scroll of learning and emerald offering">
  <defs>
    <radialGradient id="me_aura" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#86efac" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="me_planet" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="55%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="me_scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefbf3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="me_scroll_edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="me_emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="me_green_flower" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <circle cx="160" cy="140" r="150" fill="url(#me_aura)"/>

  <!-- Mercury planet (small, top center) -->
  <circle cx="160" cy="78" r="24" fill="url(#me_planet)"/>
  <!-- Mercury surface features (subtle craters) -->
  <circle cx="153" cy="72" r="2.5" fill="#166534" opacity="0.45"/>
  <circle cx="168" cy="76" r="2" fill="#166534" opacity="0.45"/>
  <circle cx="162" cy="86" r="2" fill="#166534" opacity="0.45"/>
  <!-- Mercury symbol (☿) above -->
  <text x="160" y="42" text-anchor="middle" font-family="serif" font-size="22"
        fill="#166534" opacity="0.7" font-weight="700">☿</text>

  <!-- Rays connecting Mercury to the scroll (wisdom flowing down) -->
  <g stroke="#4ade80" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <line x1="150" y1="100" x2="130" y2="150"/>
    <line x1="170" y1="100" x2="190" y2="150"/>
    <line x1="160" y1="104" x2="160" y2="145"/>
  </g>

  <!-- Scroll (rolled parchment of learning) -->
  <g transform="translate(160, 210)">
    <!-- Left roll -->
    <rect x="-95" y="-25" width="20" height="50" fill="url(#me_scroll_edge)" rx="4"/>
    <ellipse cx="-85" cy="-25" rx="10" ry="4" fill="#a16207"/>
    <ellipse cx="-85" cy="25" rx="10" ry="4" fill="#78350f"/>

    <!-- Right roll -->
    <rect x="75" y="-25" width="20" height="50" fill="url(#me_scroll_edge)" rx="4"/>
    <ellipse cx="85" cy="-25" rx="10" ry="4" fill="#a16207"/>
    <ellipse cx="85" cy="25" rx="10" ry="4" fill="#78350f"/>

    <!-- Parchment (open middle) -->
    <rect x="-75" y="-22" width="150" height="44" fill="url(#me_scroll)"/>

    <!-- Text lines on parchment -->
    <g stroke="#166534" stroke-width="1" opacity="0.5">
      <line x1="-65" y1="-12" x2="60" y2="-12"/>
      <line x1="-65" y1="-4" x2="50" y2="-4"/>
      <line x1="-65" y1="4" x2="55" y2="4"/>
      <line x1="-65" y1="12" x2="45" y2="12"/>
    </g>
  </g>

  <!-- Emerald (Mercury's classical gemstone) — center-below-scroll -->
  <g transform="translate(160, 258)">
    <polygon points="-10,-6 10,-6 14,0 10,6 -10,6 -14,0" fill="url(#me_emerald)"/>
    <polygon points="-10,-6 10,-6 6,-2 -6,-2" fill="#ffffff" opacity="0.6"/>
    <line x1="-10" y1="-6" x2="-14" y2="0" stroke="#14532d" stroke-width="0.5"/>
    <line x1="10" y1="-6" x2="14" y2="0" stroke="#14532d" stroke-width="0.5"/>
  </g>

  <!-- Green flower offering on left -->
  <g transform="translate(58, 218)">
    <circle cx="0" cy="-7" r="6" fill="url(#me_green_flower)"/>
    <circle cx="-7" cy="0" r="6" fill="url(#me_green_flower)"/>
    <circle cx="7" cy="0" r="6" fill="url(#me_green_flower)"/>
    <circle cx="-5" cy="6" r="6" fill="url(#me_green_flower)"/>
    <circle cx="5" cy="6" r="6" fill="url(#me_green_flower)"/>
    <circle cx="0" cy="0" r="3" fill="#78350f"/>
  </g>

  <!-- Quill (writing instrument) on right of scroll -->
  <g transform="translate(258, 190) rotate(20)">
    <!-- Feather -->
    <path d="M 0 0 Q -3 -20, 0 -40 Q 3 -55, 0 -70" stroke="#166534" stroke-width="2" fill="none"/>
    <ellipse cx="-1" cy="-50" rx="4" ry="18" fill="#4ade80" opacity="0.75"/>
    <ellipse cx="1" cy="-30" rx="3" ry="12" fill="#22c55e" opacity="0.75"/>
    <!-- Nib -->
    <path d="M -2 0 L 0 6 L 2 0 Z" fill="#78350f"/>
  </g>

  <!-- Small "ॐ" (Om) top-left -->
  <text x="55" y="42" text-anchor="middle" font-family="Noto Sans Devanagari, serif"
        font-size="18" fill="#166534" opacity="0.55">ॐ</text>

  <!-- Ground/altar line -->
  <line x1="40" y1="278" x2="280" y2="278" stroke="#4ade80" stroke-width="1" opacity="0.4"/>
</svg>
