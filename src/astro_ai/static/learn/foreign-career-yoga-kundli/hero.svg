<?xml version="1.0" encoding="UTF-8"?>
<!-- Foreign Career Yoga — visual metaphor: a stylized world globe with
     a directional dashed arc leaving India (subcontinent), a Rahu glyph
     watching over the trajectory, and a small kundali diamond anchoring
     the natal signature. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Foreign career yoga Kundali — a directional arc leaving home with the Rahu signature above">
  <defs>
    <radialGradient id="fc_aura" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#c7d2fe" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fc_globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B03A22"/>
      <stop offset="100%" stop-color="#140F1C"/>
    </linearGradient>
    <radialGradient id="fc_ocean" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <linearGradient id="fc_land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>

  <!-- Cool aura suggesting sky/atmosphere -->
  <ellipse cx="160" cy="180" rx="150" ry="110" fill="url(#fc_aura)"/>

  <!-- Stars -->
  <g fill="#9E2B25" opacity="0.32">
    <circle cx="35"  cy="35"  r="1.5"/>
    <circle cx="290" cy="45"  r="2"/>
    <circle cx="280" cy="290" r="1.5"/>
    <circle cx="45"  cy="285" r="1.5"/>
    <circle cx="255" cy="20"  r="1.2"/>
  </g>

  <!-- Rahu glyph and label at top (planet of foreign matters) -->
  <text x="160" y="35" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="34" font-weight="700" fill="#B03A22">☊</text>
  <text x="160" y="55" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="11" font-weight="700" fill="#140F1C" letter-spacing="2">RAHU</text>

  <!-- World globe -->
  <circle cx="160" cy="175" r="72" fill="url(#fc_ocean)" stroke="url(#fc_globe)" stroke-width="2.5"/>

  <!-- Latitude lines (curved to suggest globe) -->
  <g stroke="#B03A22" stroke-width="1" fill="none" opacity="0.35">
    <ellipse cx="160" cy="175" rx="72" ry="18"/>
    <ellipse cx="160" cy="175" rx="72" ry="36"/>
    <ellipse cx="160" cy="175" rx="72" ry="54"/>
  </g>
  <!-- Longitude line (vertical) -->
  <line x1="160" y1="103" x2="160" y2="247" stroke="#B03A22" stroke-width="1" opacity="0.35"/>

  <!-- Abstract India-shape (starting location) -->
  <path d="M 155 165 Q 168 158 175 172 Q 180 185 172 195 Q 165 205 158 200 Q 150 195 152 180 Q 150 172 155 165 Z"
        fill="url(#fc_land)" stroke="#365314" stroke-width="1"/>

  <!-- Dashed arc — trajectory from India outward (to west/left representing "abroad") -->
  <path d="M 165 175 Q 130 145 100 130 Q 75 120 55 115"
        fill="none" stroke="#eab308" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="5,4"/>
  <!-- Arrow head at end -->
  <polygon points="55,115 65,110 65,120" fill="#b45309"/>

  <!-- Small kundali diamond at bottom — anchoring "the chart" -->
  <g fill="none" stroke="url(#fc_globe)" stroke-width="1.8" stroke-linejoin="round" opacity="0.85">
    <rect x="130" y="265" width="60" height="45" rx="2"/>
    <polygon points="160,265 190,287.5 160,310 130,287.5"/>
  </g>
  <!-- 12 label in the kundali (the foreign house) -->
  <text x="160" y="292" text-anchor="middle"
        font-family="Crimson Pro, Georgia, serif"
        font-size="11" font-weight="700" fill="#B03A22">12</text>
</svg>
