<?xml version="1.0" encoding="UTF-8"?>
<!-- Gajakesari Yoga — "elephant-lion" yoga. Combines Jupiter (regal
     wisdom) + Moon (mind/mother) in a specific angular relationship.
     Rendered as a stylised elephant + lion silhouette combined with
     a warm golden aura suggesting fame and prosperity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Gajakesari Yoga — the elephant-lion combination">
  <defs>
    <radialGradient id="gaja_aura" cx="0.5" cy="0.55" r="0.65">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gaja_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="lion_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <circle cx="160" cy="170" r="140" fill="url(#gaja_aura)"/>

  <!-- Elephant silhouette (left) -->
  <g fill="url(#gaja_body)">
    <!-- Body -->
    <ellipse cx="105" cy="185" rx="45" ry="35"/>
    <!-- Head -->
    <ellipse cx="70" cy="150" rx="28" ry="30"/>
    <!-- Trunk (curving down and out) -->
    <path d="M 60 165
             Q 45 180, 42 205
             Q 40 225, 50 235
             Q 55 240, 60 230
             Q 60 215, 55 200
             Z"/>
    <!-- Ear (big classical elephant ear) -->
    <ellipse cx="90" cy="140" rx="18" ry="22" transform="rotate(-15 90 140)"/>
    <!-- Legs -->
    <rect x="80" y="215" width="10" height="35" rx="3"/>
    <rect x="110" y="215" width="10" height="35" rx="3"/>
    <rect x="130" y="215" width="10" height="35" rx="3"/>
  </g>
  <!-- Elephant eye -->
  <circle cx="75" cy="146" r="2.5" fill="#fbbf24"/>
  <!-- Elephant tusk (small white) -->
  <ellipse cx="58" cy="170" rx="2" ry="6" fill="#fef9c3"/>

  <!-- Lion silhouette (right) -->
  <g fill="url(#lion_body)">
    <!-- Body -->
    <ellipse cx="220" cy="190" rx="45" ry="30"/>
    <!-- Head (with mane suggestion) -->
    <circle cx="255" cy="155" r="27"/>
    <!-- Mane strands radiating -->
    <path d="M 232 138 L 220 125 M 245 130 L 240 115 M 265 128 L 268 112 M 278 138 L 288 125 M 283 155 L 297 155 M 280 172 L 290 180 M 268 180 L 268 195 M 245 178 L 240 190 M 232 172 L 218 178"
          stroke="url(#lion_body)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="200" y="215" width="10" height="35" rx="3"/>
    <rect x="225" y="215" width="10" height="35" rx="3"/>
    <rect x="248" y="215" width="10" height="35" rx="3"/>
    <!-- Tail curling up -->
    <path d="M 265 205 Q 285 195, 280 175 Q 275 172, 273 180" stroke="url(#lion_body)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Lion eye -->
  <circle cx="252" cy="150" r="2.5" fill="#fef9c3"/>
  <!-- Lion mouth line -->
  <path d="M 250 162 Q 255 165, 260 162" stroke="#78350f" stroke-width="1.5" fill="none"/>

  <!-- Uniting radiance overhead — Jupiter/Moon symbolic union -->
  <g opacity="0.6">
    <circle cx="160" cy="90" r="18" fill="#fef9c3"/>
    <circle cx="160" cy="90" r="18" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <!-- Sanskrit "ॐ" subtle -->
  <text x="160" y="97" text-anchor="middle" font-family="Noto Sans Devanagari, serif"
        font-size="20" fill="#6b21a8" opacity="0.85">ॐ</text>

  <!-- Ground line -->
  <line x1="40" y1="255" x2="280" y2="255" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
</svg>
