<?xml version="1.0" encoding="UTF-8"?>
<!-- Budha (Mercury): emerald-green planet body with quick-motion lines.
     Emphasises intellect, speed, communication. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Budha (Mercury) — the intellect planet">
  <defs>
    <radialGradient id="aura-me" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#a7f3d0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="merc-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-me)"/>

  <g fill="#6b21a8" opacity="0.4">
    <circle cx="45"  cy="65"  r="1.5"/>
    <circle cx="270" cy="80"  r="2"/>
    <circle cx="60"  cy="260" r="1.5"/>
    <circle cx="275" cy="250" r="1.5"/>
  </g>

  <!-- Motion arcs — signalling speed / flow -->
  <g fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M 60 100 Q 100 80 140 90"/>
    <path d="M 180 230 Q 220 240 260 220"/>
    <path d="M 250 90 Q 240 130 220 145"/>
    <path d="M 70 175 Q 90 210 100 230"/>
  </g>

  <!-- Mercury body -->
  <circle cx="160" cy="160" r="72" fill="url(#merc-body)"/>

  <!-- Mercury glyph ☿ -->
  <text x="160" y="172" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="46" font-weight="700" fill="#ecfdf5" opacity="0.9">☿</text>
</svg>
