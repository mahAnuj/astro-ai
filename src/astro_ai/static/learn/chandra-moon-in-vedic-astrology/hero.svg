<?xml version="1.0" encoding="UTF-8"?>
<!-- Chandra (Moon): crescent + full-moon layer in soft silvers, cool blue
     backdrop suggesting night sky. Emphasises the "mind, mother, emotion"
     softness distinct from Sun's fire. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Chandra (Moon) — the mind of the chart">
  <defs>
    <radialGradient id="aura-mo" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c7d2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <!-- Cool night aura -->
  <circle cx="160" cy="160" r="150" fill="url(#aura-mo)"/>

  <!-- Stars — brighter/more stars for night mood -->
  <g fill="#9E2B25" opacity="0.5">
    <circle cx="45"  cy="55"  r="1.5"/>
    <circle cx="72"  cy="90"  r="1"/>
    <circle cx="275" cy="65"  r="2"/>
    <circle cx="255" cy="105" r="1.2"/>
    <circle cx="55"  cy="255" r="1.5"/>
    <circle cx="280" cy="245" r="1.5"/>
    <circle cx="25"  cy="165" r="1"/>
    <circle cx="295" cy="175" r="1"/>
    <circle cx="115" cy="35"  r="1"/>
    <circle cx="210" cy="42"  r="1"/>
  </g>

  <!-- Full moon body -->
  <circle cx="160" cy="160" r="88" fill="url(#moon-body)"/>

  <!-- Craters (subtle) -->
  <g fill="#94a3b8" opacity="0.35">
    <circle cx="135" cy="140" r="10"/>
    <circle cx="185" cy="165" r="7"/>
    <circle cx="155" cy="190" r="8"/>
    <circle cx="180" cy="130" r="5"/>
  </g>

  <!-- Crescent overlay — the shadow half, subtle to keep the full disk visible -->
  <path d="M 160 72 A 88 88 0 0 1 160 248 A 60 60 0 0 0 160 72 Z"
        fill="#f5f3ff" opacity="0.35"/>

  <!-- Classical Moon glyph on the illuminated side -->
  <text x="130" y="180" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="52" font-weight="700" fill="#140F1C" opacity="0.65">☾</text>
</svg>
