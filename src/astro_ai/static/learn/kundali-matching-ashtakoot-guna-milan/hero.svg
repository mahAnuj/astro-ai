<?xml version="1.0" encoding="UTF-8"?>
<!-- Kundali Matching: two overlapping rings (bride and groom charts intersecting)
     with the compatibility score "36" as centrepiece. Visually communicates the
     joining/comparison metaphor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Kundali Matching — Ashtakoot Guna Milan compatibility scoring">
  <defs>
    <radialGradient id="aura-km" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbcfe8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-bride" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="ring-groom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#aura-km)"/>

  <!-- Stars -->
  <g fill="#9E2B25" opacity="0.4">
    <circle cx="45"  cy="60"  r="1.5"/>
    <circle cx="275" cy="80"  r="2"/>
    <circle cx="60"  cy="255" r="1.5"/>
    <circle cx="280" cy="245" r="1.5"/>
  </g>

  <!-- Two overlapping rings — the interlocking charts -->
  <circle cx="115" cy="160" r="75" fill="none" stroke="url(#ring-bride)" stroke-width="6" opacity="0.9"/>
  <circle cx="205" cy="160" r="75" fill="none" stroke="url(#ring-groom)" stroke-width="6" opacity="0.9"/>

  <!-- Sanskrit for "matching" glyphs in each ring -->
  <text x="80" y="167" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="32" font-weight="700" fill="#831843" opacity="0.6">♀</text>
  <text x="240" y="167" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="32" font-weight="700" fill="#78350f" opacity="0.6">♂</text>

  <!-- Intersection zone — the "compatibility score" area -->
  <circle cx="160" cy="160" r="34" fill="#ffffff" stroke="#9E2B25" stroke-width="2"/>
  <text x="160" y="158" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="26" font-weight="700" fill="#9E2B25">36</text>
  <text x="160" y="178" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#78716c" letter-spacing="1.5">GUNAS</text>
</svg>
