<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Manglik remedies — practices for Mars in marriage charts">
  <defs>
    <radialGradient id="mr_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <g fill="#6b21a8" opacity="0.3">
    <circle cx="42" cy="45" r="1.5"/><circle cx="280" cy="55" r="2"/>
    <circle cx="275" cy="275" r="1.5"/><circle cx="50" cy="270" r="1.5"/>
  </g>
  <!-- Mars glyph in center -->
  <circle cx="160" cy="160" r="70" fill="url(#mr_glow)"/>
  <text x="160" y="180" font-family="Noto Sans Devanagari, serif" font-size="70" text-anchor="middle" fill="#fef3c7">♂</text>
  <!-- Hanuman + Vishnu associations - devotional hands -->
  <text x="80" y="80" font-family="Noto Sans Devanagari, serif" font-size="32" fill="#f59e0b">🙏</text>
  <text x="230" y="80" font-family="Noto Sans Devanagari, serif" font-size="32" fill="#f59e0b">🙏</text>
  <!-- Two rings suggesting Kumbh Vivah -->
  <circle cx="120" cy="270" r="18" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="200" cy="270" r="18" fill="none" stroke="#f59e0b" stroke-width="3"/>
</svg>
