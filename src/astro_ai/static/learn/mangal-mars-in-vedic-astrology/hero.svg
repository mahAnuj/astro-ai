<?xml version="1.0" encoding="UTF-8"?>
<!-- Mangal (Mars): fiery red planet body with the Mars glyph and radiating heat.
     Emphasises the martial / energetic / courage aspect of Mars. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Mangal (Mars) — the warrior planet">
  <defs>
    <radialGradient id="aura-ma" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#fecaca" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fca5a5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mars-body" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Fiery aura -->
  <circle cx="160" cy="160" r="150" fill="url(#aura-ma)"/>

  <!-- Stars -->
  <g fill="#6b21a8" opacity="0.4">
    <circle cx="45"  cy="60"  r="1.5"/>
    <circle cx="275" cy="80"  r="2"/>
    <circle cx="60"  cy="255" r="1.5"/>
    <circle cx="280" cy="245" r="1.5"/>
  </g>

  <!-- Heat lines radiating -->
  <g stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="160" y1="35" x2="160" y2="65"/>
    <line x1="160" y1="255" x2="160" y2="285"/>
    <line x1="35" y1="160" x2="65" y2="160"/>
    <line x1="255" y1="160" x2="285" y2="160"/>
    <line x1="70" y1="70" x2="90" y2="90"/>
    <line x1="230" y1="230" x2="250" y2="250"/>
    <line x1="250" y1="70" x2="230" y2="90"/>
    <line x1="90" y1="230" x2="70" y2="250"/>
  </g>

  <!-- Mars body -->
  <circle cx="160" cy="160" r="78" fill="url(#mars-body)"/>

  <!-- Surface texture — subtle craters/streaks -->
  <g fill="#7f1d1d" opacity="0.5">
    <ellipse cx="140" cy="145" rx="14" ry="8"/>
    <ellipse cx="180" cy="175" rx="10" ry="6"/>
    <ellipse cx="150" cy="185" rx="8" ry="5"/>
  </g>

  <!-- Mars glyph ♂ -->
  <text x="160" y="172" text-anchor="middle" font-family="Crimson Pro, Georgia, serif" font-size="48" font-weight="700" fill="#fef2f2" opacity="0.9">♂</text>
</svg>
