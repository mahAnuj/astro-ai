<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Ketu remedies — classical practices for Ketu's detachment effects">
  <defs>
    <radialGradient id="kr_aura" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fefbf3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="140" ry="130" fill="url(#kr_aura)"/>
  <g fill="#9E2B25" opacity="0.35">
    <circle cx="42" cy="45" r="1.5"/><circle cx="280" cy="55" r="2"/>
    <circle cx="275" cy="275" r="1.5"/><circle cx="50" cy="270" r="1.5"/>
  </g>
  <!-- Ketu = serpent's tail — descending flame + tail -->
  <path d="M 160 60 Q 180 80 170 110 Q 155 130 165 155 Q 175 180 155 210 Q 140 240 160 265"
        stroke="#dc2626" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Ganesha suggestion — presiding deity -->
  <g transform="translate(160, 195)">
    <circle cx="0" cy="0" r="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="10" font-family="Noto Sans Devanagari, serif" font-size="34" text-anchor="middle" fill="#7c2d12">ॐ</text>
  </g>
  <!-- Sacred flame -->
  <path d="M 160 55 Q 150 45 155 35 Q 160 25 165 35 Q 170 45 160 55"
        fill="#f59e0b" opacity="0.9"/>
</svg>
