<?xml version="1.0" encoding="UTF-8"?>
<!-- Swati — the "self-going / independent" nakshatra. Symbol: young
     shoot swaying in the wind; or coral. Deity: Vayu (wind). Ruled
     by Rahu. Rendered as a slender young shoot bending in wind,
     against a subtle air-current backdrop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="Swati nakshatra symbol — young shoot swaying in the wind">
  <defs>
    <radialGradient id="swatibreeze" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#d9f99d" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#a7f3d0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5f5f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swatishoot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#140F1C"/>
      <stop offset="50%" stop-color="#B03A22"/>
      <stop offset="100%" stop-color="#CB5A2E"/>
    </linearGradient>
    <linearGradient id="swatileaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="320" fill="#fefbf3" rx="24"/>
  <ellipse cx="160" cy="160" rx="150" ry="130" fill="url(#swatibreeze)"/>

  <!-- Wind current lines (drifting horizontal curves) -->
  <g stroke="#E4A96A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M 40 90 Q 100 82, 160 92 Q 220 100, 280 88"/>
    <path d="M 30 130 Q 90 122, 150 128 Q 200 132, 260 122"/>
    <path d="M 40 240 Q 100 232, 160 240 Q 210 244, 275 236"/>
    <path d="M 50 265 Q 110 262, 170 268 Q 220 272, 275 265"/>
  </g>

  <!-- Ground / soil -->
  <ellipse cx="160" cy="270" rx="65" ry="8" fill="#78350f" opacity="0.7"/>

  <!-- Slender curving stem — the "self-going" shoot -->
  <path d="M 158 270
           Q 168 250, 172 220
           Q 175 190, 168 160
           Q 158 128, 172 100
           Q 180 82, 178 65"
        stroke="url(#swatishoot)" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- Leaves along the stem, showing wind direction -->
  <g>
    <!-- Lower leaf -->
    <ellipse cx="188" cy="215" rx="20" ry="8" fill="url(#swatileaf)"
             transform="rotate(20 188 215)"/>
    <!-- Middle leaf (leaning further with wind) -->
    <ellipse cx="153" cy="170" rx="22" ry="9" fill="url(#swatileaf)"
             transform="rotate(-25 153 170)"/>
    <!-- Upper leaf -->
    <ellipse cx="192" cy="120" rx="18" ry="7" fill="url(#swatileaf)"
             transform="rotate(35 192 120)"/>
  </g>

  <!-- Bud at top -->
  <ellipse cx="178" cy="60" rx="7" ry="10" fill="#f472b6"/>
  <ellipse cx="178" cy="58" rx="4" ry="6" fill="#fef3c7" opacity="0.7"/>

  <!-- Small "15" -->
  <text x="30" y="46" font-family="Crimson Pro, serif" font-size="26"
        font-weight="700" fill="#9E2B25" opacity="0.35">15</text>
</svg>
